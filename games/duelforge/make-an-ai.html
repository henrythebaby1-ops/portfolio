<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuelForge | Make an AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-shell">
    <header class="top-bar">
      <h1 class="brand">Make an AI</h1>
      <span class="path-tag" data-path-tag></span>
    </header>
    <nav class="nav-grid">
      <a class="nav-link" data-page="start.html" href="start.html">Start</a>
      <a class="nav-link" data-page="home.html" href="home.html">Home</a>
      <a class="nav-link" data-page="history-ai.html" href="history-ai.html">History AI</a>
      <a class="nav-link" data-page="language-ai.html" href="language-ai.html">Language AI</a>
      <a class="nav-link" data-page="learning-ai.html" href="learning-ai.html">Learning AI</a>
      <a class="nav-link" data-page="coding-ai.html" href="coding-ai.html">Coding AI</a>
      <a class="nav-link" data-page="math-ai.html" href="math-ai.html">Math AI</a>
      <a class="nav-link" data-page="reading-ai.html" href="reading-ai.html">Reading AI</a>
      <a class="nav-link" data-page="make-an-ai.html" href="make-an-ai.html">Make an AI</a>
      <a class="nav-link" data-page="about.html" href="about.html">About Us</a>
    </nav>
    <section class="hero split">
      <div>
        <h2>Build Your Own Tutor Model</h2>
        <p>Follow your naming rule: <strong>DuelForge [Topic] [Model Number]</strong>.</p>
        <p class="note">Example names: DuelForge Biology 07, DuelForge Finance 08.</p>
      </div>
      <div class="section-card">
        <h3>Model Setup</h3>
        <form class="form-grid" action="#" method="post">
          <label for="topic">Topic Name</label>
          <input id="topic" name="topic" placeholder="Biology" />
          <label for="number">Model Number</label>
          <input id="number" name="number" placeholder="07" />
          <label for="tone">Teaching Style</label>
          <select id="tone" name="tone">
            <option>Beginner Friendly</option>
            <option>Exam Focused</option>
            <option>Advanced Deep Dive</option>
          </select>
          <label for="description">What should this AI help users learn?</label>
          <textarea id="description" name="description" rows="4" placeholder="Explain the learning outcomes"></textarea>
          <button class="btn btn-primary" type="submit">Create DuelForge Model</button>
        </form>
      </div>
    </section>
    <footer>DuelForge.net/make-an-ai</footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
