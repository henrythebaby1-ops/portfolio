<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA — AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080b0f;
    --surface: #0e1318;
    --border: #1c2530;
    --accent: #00e5a0;
    --accent2: #0099ff;
    --text: #c8d8e8;
    --dim: #4a6070;
    --user-bg: #0f1f2e;
    --ai-bg: #091812;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,160,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,160,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,11,15,0.92);
    backdrop-filter: blur(16px);
  }

  .logo-mark {
    width: 38px; height: 38px;
    border: 1.5px solid var(--accent);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .logo-mark::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.55); opacity: 0.6; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 21px;
    letter-spacing: 0.1em;
    color: #fff;
  }
  .logo-text span { color: var(--accent); }

  .subtitle {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.14em;
    margin-top: 1px;
  }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.1em;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 2s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px;
    position: relative;
    z-index: 1;
    scroll-behavior: smooth;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .welcome {
    text-align: center;
    padding: 48px 16px;
    animation: fadeUp 0.6s ease both;
  }
  .welcome h2 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 10px;
  }
  .welcome h2 span { color: var(--accent); }
  .welcome p {
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.06em;
    line-height: 1.7;
    max-width: 320px;
    margin: 0 auto 28px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 420px;
    margin: 0 auto;
  }
  .chip {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 11px;
    color: var(--dim);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
    background: transparent;
    font-family: 'DM Mono', monospace;
  }
  .chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,229,160,0.05);
  }

  .message {
    display: flex;
    gap: 14px;
    animation: fadeUp 0.35s ease both;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
    font-family: 'Syne', sans-serif;
  }
  .avatar.ai {
    background: rgba(0,229,160,0.12);
    border: 1px solid rgba(0,229,160,0.25);
    color: var(--accent);
  }
  .avatar.user-av {
    background: rgba(0,153,255,0.12);
    border: 1px solid rgba(0,153,255,0.25);
    color: var(--accent2);
  }

  .bubble {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.75;
    letter-spacing: 0.01em;
    max-width: calc(100% - 48px);
  }
  .message.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid rgba(0,229,160,0.1);
    border-radius: 4px 12px 12px 12px;
    color: var(--text);
  }
  .message.user .bubble {
    background: var(--user-bg);
    border: 1px solid rgba(0,153,255,0.12);
    border-radius: 12px 4px 12px 12px;
    color: #d0e8ff;
  }

  .typing-indicator {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 6px 0;
  }
  .typing-indicator span {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
    opacity: 0.6;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .input-area {
    position: relative;
    z-index: 10;
    padding: 16px 24px 20px;
    background: rgba(8,11,15,0.95);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 820px;
    margin: 0 auto;
  }

  textarea {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    resize: none;
    outline: none;
    min-height: 46px;
    max-height: 160px;
    line-height: 1.6;
    transition: border-color 0.2s;
    overflow-y: auto;
  }
  textarea::placeholder { color: var(--dim); }
  textarea:focus { border-color: rgba(0,229,160,0.3); }

  .send-btn {
    width: 46px; height: 46px;
    border-radius: 10px;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #00ffb2; transform: scale(1.05); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 18px; height: 18px; fill: #080b0f; }

  .footer-note {
    text-align: center;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.08em;
    margin-top: 8px;
  }

  /* Markdown-ish formatting */
  .bubble code {
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.15);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--accent);
  }
  .bubble pre {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12px;
    line-height: 1.6;
  }
  .bubble pre code {
    background: none;
    border: none;
    padding: 0;
    color: #a8e6cf;
  }
  .bubble strong { color: #fff; font-weight: 500; }
  .bubble em { font-style: italic; color: #9ab8cc; }
</style>
</head>
<body>

<header>
  <div class="logo-mark"></div>
  <div>
    <div class="logo-text">NOV<span>A</span></div>
    <div class="subtitle">ARTIFICIAL INTELLIGENCE</div>
  </div>
  <div class="status">
    <div class="dot"></div>
    ONLINE
  </div>
</header>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <h2>Hello, I'm <span>NOVA</span></h2>
    <p>An AI built to think, create, and assist. Ask me anything — from code to creative writing to deep questions.</p>
    <div class="chips">
      <button class="chip" onclick="sendChip(this)">Write a short poem</button>
      <button class="chip" onclick="sendChip(this)">Explain quantum entanglement</button>
      <button class="chip" onclick="sendChip(this)">Give me a fun fact</button>
      <button class="chip" onclick="sendChip(this)">Help me brainstorm ideas</button>
      <button class="chip" onclick="sendChip(this)">Write a Python function</button>
      <button class="chip" onclick="sendChip(this)">What can you do?</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="input" placeholder="Ask NOVA anything..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="footer-note">NOVA · Powered by Claude · Press Enter to send</div>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');

let messages = [];
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendChip(btn) {
  inputEl.value = btn.textContent;
  sendMessage();
}

function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  // Code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${escapeHTML(code.trim())}</code></pre>`
  );
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Newlines
  text = text.replace(/\n/g, '<br>');
  return text;
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'ai' ? 'ai' : 'user-av'}`;
  avatar.textContent = role === 'ai' ? 'N' : 'U';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (role === 'ai') {
    bubble.innerHTML = renderMarkdown(content);
  } else {
    bubble.textContent = content;
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return { div, bubble };
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typing';

  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.textContent = 'N';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;

  div.appendChild(avatar);
  div.appendChild(bubble);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  // Hide welcome
  if (welcome) welcome.style.display = 'none';

  inputEl.value = '';
  inputEl.style.height = 'auto';
  isLoading = true;
  sendBtn.disabled = true;

  messages.push({ role: 'user', content: text });
  addMessage('user', text);
  addTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1024,
        system: "You are NOVA, a sleek and intelligent AI assistant. You're helpful, thoughtful, and slightly futuristic in tone — concise but never cold. You format code with markdown backticks.",
        messages: messages
      })
    });

    const data = await response.json();
    removeTyping();

    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      messages.push({ role: 'assistant', content: reply });
      addMessage('ai', reply);
    } else if (data.error) {
      addMessage('ai', `⚠ Error: ${data.error.message}`);
    }
  } catch (err) {
    removeTyping();
    addMessage('ai', `⚠ Connection error. Please try again.`);
  }

  isLoading = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

inputEl.focus();
</script>
</body>
</html>
