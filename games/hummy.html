<script>
/* ---------------- CONFIG ---------------- */
// OpenRouter — unlike NVIDIA/Eden, OpenRouter's API supports direct
// browser-side calls (CORS-friendly), so no local proxy server is needed.
// This file works completely standalone — just open it in a browser.
// Get your own key at https://openrouter.ai/keys
const ENTERAPIKEYHERE = ""; // add your own OpenRouter key here (never commit it)
const OPENROUTER_MODEL = "openai/gpt-4o-mini"; // any OpenRouter model slug works

// Santa Clara County Library's catalog (sccl.bibliocommons.com) has no
// public API, and per-branch availability loads through BiblioCommons'
// internal endpoints, not the page HTML — so it can't be reliably scraped.
// Instead, every recommendation links straight into SCCLD's real, live
// search results, so availability shown is always accurate and current.
// Branch codes below are the real BiblioCommons "Available at" facet values
// (verified against the live SCCLD catalog): appending &f_STATUS=<CODE> to a
// search URL filters results to copies available now at that branch.
// _online_ is the catalog's own code for "Available Online" (e-book/audio).
const SCCLD_BRANCHES = [
  { code:"WO", label:"Woodland Library",     aliases:["los altos woodland","woodland"] },
  { code:"LA", label:"Los Altos Library",    aliases:["los altos"] },
  { code:"CA", label:"Campbell Library",     aliases:["campbell"] },
  { code:"CU", label:"Cupertino Library",    aliases:["cupertino"] },
  { code:"GI", label:"Gilroy Library",       aliases:["gilroy"] },
  { code:"MI", label:"Milpitas Library",     aliases:["milpitas"] },
  { code:"MH", label:"Morgan Hill Library",  aliases:["morgan hill"] },
  { code:"SA", label:"Saratoga Library",     aliases:["saratoga"] },
  { code:"BK", label:"the Bookmobile",       aliases:["bookmobile"] }
];
const ONLINE_FILTER = { code:"_online_", label:"online copies" };

// "at Cupertino Library" vs "as online copies" — keeps the copy readable
// whether the user named a branch or asked for a digital copy.
function filterPhrase(branch){
  return branch.code === "_online_" ? `as ${branch.label}` : `at ${branch.label}`;
}

// Returns {code,label} for the first branch named in the query, or the online
// filter if they asked for a digital copy. Longer names are listed first so
// "Los Altos Woodland" doesn't get swallowed by the "los altos" alias.
function detectBranch(query){
  const q = query.toLowerCase();
  for(const branch of SCCLD_BRANCHES){
    if(branch.aliases.some(a => q.includes(a))) return branch;
  }
  if(/\b(e-?book|ebook|audiobook|digital|online|kindle|libby)\b/.test(q)) return ONLINE_FILTER;
  return null;
}

function sccldSearchUrl(title, branch){
  let url = `https://sccl.bibliocommons.com/v2/search?query=${encodeURIComponent(title)}&searchType=smart`;
  if(branch) url += `&f_STATUS=${encodeURIComponent(branch.code)}`;
  return url;
}

/* ---------------- LANGUAGE ----------------
   The interface strings and the shelf language come from i18n.js. `t()` fills
   {placeholders}; a `_one` variant is used for a count of exactly one where
   the language keeps a singular. */
const LANG_KEY = 'stacks.lang';
const I18N = window.HUMMY_I18N || { en: { name: 'English', locale: 'en-US', catalog: '', strings: {} } };
let LANG = 'en';

function t(key, vars){
  const dict = (I18N[LANG] || I18N.en).strings;
  let str = dict[key];
  // The singular form is chosen by `count` when given, else by `n`: in
  // "1 of 2 copies" the noun agrees with the total, not the number in stock.
  const governs = vars && (typeof vars.count === 'number' ? vars.count : vars.n);
  if(governs === 1 && dict[key + '_one']) str = dict[key + '_one'];
  if(str == null) str = (I18N.en.strings[key] != null ? I18N.en.strings[key] : key);
  return String(str).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null) ? String(vars[k]) : '');
}
const locale = () => (I18N[LANG] || I18N.en).locale || 'en-US';
const catalogLang = () => (I18N[LANG] || I18N.en).catalog || '';

function initLanguagePicker(){
  const sel = document.getElementById('langPick');
  sel.innerHTML = Object.entries(I18N).map(([code, l]) => `<option value="${code}">${esc(l.name)}</option>`).join('');
  try{ const saved = localStorage.getItem(LANG_KEY); if(saved && I18N[saved]) LANG = saved; }catch(e){}
  sel.value = LANG;
  sel.addEventListener('change', () => {
    LANG = I18N[sel.value] ? sel.value : 'en';
    try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
    applyLanguage();
    // A language adds its own shelves (and a pill) beside the others, so the
    // bar and the home page are rebuilt; the rest of the collection stays.
    if(PILL_NAV) buildCategoryBar().then(() => { if(BROWSING && BROWSING.events) openEvents(BROWSING.audience || '', null, null); else loadHome(); });
  });
  applyLanguage();
}

/* Static bits of the page that aren't re-rendered by a view change. */
function applyLanguage(){
  document.documentElement.lang = LANG;
  document.getElementById('promptInput').placeholder = t('search.placeholder');
  document.getElementById('promptInput').setAttribute('aria-label', t('search.aria'));
  document.getElementById('searchOpenLabel').textContent = t('search.open');
  document.getElementById('listOpenLabel').textContent = t('nav.list');
  document.getElementById('luckyOpenLabel').textContent = t('lucky.btn');
  document.getElementById('luckyTitle').textContent = t('lucky.title');
  document.getElementById('addAllLabel').textContent = t('list.addAllHere');
  document.getElementById('listOpen').setAttribute('aria-label', t('nav.list'));
  document.getElementById('searchTitle').textContent = t('search.title');
  document.getElementById('searchTryLabel').textContent = t('search.try');
  renderSearchChips();
  document.getElementById('partnersLabel').textContent = t('footer.poweredBy');
  document.getElementById('lblLibrary').textContent = t('top.myLibrary');
  document.getElementById('lblLanguage').textContent = t('top.language');
  const sel = document.getElementById('homeBranch');
  if(sel && sel.options.length) sel.options[0].textContent = t('top.allBranches');
  const shuffle = document.getElementById('shuffleBtn');
  if(shuffle) shuffle.lastChild.textContent = ' ' + t('shelf.shuffle');
  updateLiveBadge();
}

/* ---------------- PillNav (React Bits) — vanilla port ----------------
   Same DOM, same GSAP timelines, same props as the React component:
   logo, items, activeHref, ease, baseColor, pillColor, hoveredPillTextColor,
   pillTextColor, onMobileMenuClick, initialLoadAnimation. Items may carry a
   `menu` of sub-items (our shelves), shown under the pill on hover. */
function createPillNav(container, opts){
  if(container._resize) window.removeEventListener('resize', container._resize);
  const {
    logo, logoAlt = 'Logo', wordmark = '', items = [], activeHref,
    className = '', ease = 'power3.easeOut',
    baseColor = '#fff', pillColor = '#120F17', hoveredPillTextColor = '#120F17', pillTextColor,
    onMobileMenuClick, initialLoadAnimation = true, onSelect
  } = opts;
  const g = window.gsap;
  const vars = `--base:${baseColor};--pill-bg:${pillColor};--hover-text:${hoveredPillTextColor};--pill-text:${pillTextColor ?? baseColor}`;

  container.innerHTML = `
    <nav class="pill-nav ${esc(className)}" aria-label="Primary" style="${vars}">
      <a class="pill-logo" href="${esc(items[0]?.href || '#')}" aria-label="Home"><img src="${esc(logo)}" alt="${esc(logoAlt)}"></a>
      ${wordmark ? `<span class="pill-wordmark">${esc(wordmark)}</span>` : ''}
      <div class="pill-nav-items desktop-only">
        <ul class="pill-list" role="menubar">
          ${items.map(it => `
            <li role="none">
              <a role="menuitem" href="${esc(it.href)}" class="pill${activeHref === it.href ? ' is-active' : ''}" aria-label="${esc(it.ariaLabel || it.label)}"${it.menu ? ' aria-haspopup="true"' : ''}>
                <span class="hover-circle" aria-hidden="true"></span>
                <span class="label-stack"><span class="pill-label">${esc(it.label)}</span><span class="pill-label-hover" aria-hidden="true">${esc(it.label)}</span></span>
              </a>
              ${it.menu ? `<div class="menu" role="menu">${it.menu.map(m => `<button role="menuitem" data-href="${esc(m.href)}">${esc(m.label)}</button>`).join('')}</div>` : ''}
            </li>`).join('')}
        </ul>
      </div>
      <button class="mobile-menu-button mobile-only" aria-label="Toggle menu"><span class="hamburger-line"></span><span class="hamburger-line"></span></button>
    </nav>
    <div class="mobile-menu-popover mobile-only" style="${vars}">
      <ul class="mobile-menu-list">
        ${items.map(it => it.menu
          ? `<li><div class="mobile-menu-sub">${esc(it.label)}</div></li>` + it.menu.map(m => `<li><a href="${esc(m.href)}" class="mobile-menu-link">${esc(m.label)}</a></li>`).join('')
          : `<li><a href="${esc(it.href)}" class="mobile-menu-link${activeHref === it.href ? ' is-active' : ''}">${esc(it.label)}</a></li>`).join('')}
      </ul>
    </div>`;

  const nav = container.querySelector('.pill-nav');
  const logoEl = container.querySelector('.pill-logo');
  const logoImg = logoEl.querySelector('img');
  const navItems = container.querySelector('.pill-nav-items');
  const pills = [...container.querySelectorAll('.pill')];
  const circles = pills.map(p => p.querySelector('.hover-circle'));
  const hamburger = container.querySelector('.mobile-menu-button');
  const menu = container.querySelector('.mobile-menu-popover');
  const tls = []; const active = []; let logoTween = null; let mobileOpen = false;

  function layout(){
    if(!g) return;
    circles.forEach((circle, i) => {
      const pill = circle.parentElement;
      const { width: w, height: h } = pill.getBoundingClientRect();
      const R = ((w * w) / 4 + h * h) / (2 * h);
      const D = Math.ceil(2 * R) + 2;
      const delta = Math.ceil(R - Math.sqrt(Math.max(0, R * R - (w * w) / 4))) + 1;
      const originY = D - delta;
      circle.style.width = `${D}px`; circle.style.height = `${D}px`; circle.style.bottom = `-${delta}px`;
      g.set(circle, { xPercent: -50, scale: 0, transformOrigin: `50% ${originY}px` });
      const label = pill.querySelector('.pill-label');
      const white = pill.querySelector('.pill-label-hover');
      if(label) g.set(label, { y: 0 });
      if(white) g.set(white, { y: h + 12, opacity: 0 });
      tls[i]?.kill();
      const tl = g.timeline({ paused: true });
      tl.to(circle, { scale: 1.2, xPercent: -50, duration: 2, ease, overwrite: 'auto' }, 0);
      if(label) tl.to(label, { y: -(h + 8), duration: 2, ease, overwrite: 'auto' }, 0);
      if(white){ g.set(white, { y: Math.ceil(h + 100), opacity: 0 }); tl.to(white, { y: 0, opacity: 1, duration: 2, ease, overwrite: 'auto' }, 0); }
      tls[i] = tl;
    });
  }
  layout();
  container._resize = layout;
  window.addEventListener('resize', layout);
  if(document.fonts?.ready) document.fonts.ready.then(layout).catch(() => {});
  if(g && menu) g.set(menu, { visibility: 'hidden', opacity: 0, scaleY: 1 });
  if(g && initialLoadAnimation){
    g.set(logoEl, { scale: 0 }); g.to(logoEl, { scale: 1, duration: 0.6, ease });
    if(navItems){
      g.set(navItems, { width: 0, overflow: 'hidden' });
      // "auto" resolves to a pixel width when the tween starts — before the web
      // font has necessarily loaded. Left in place, that width kept the track
      // narrower than its pills once the real font arrived, and the flex row
      // laid the Search button over the last two. Clearing the inline width
      // (not just the overflow) returns the track to its natural size.
      g.to(navItems, { width: 'auto', duration: 0.6, ease, onComplete: () => g.set(navItems, { clearProps: 'width,overflow' }) });
    }
    // The reveal is decoration; the layout must not depend on it. Animation
    // frames stop in a background tab, and a page opened there would sit with
    // a zero-width nav and an invisible logo until they resumed — so after
    // the tween's own duration, whatever state it reached is finalised.
    setTimeout(() => {
      g.killTweensOf([logoEl, navItems].filter(Boolean));
      g.set(logoEl, { clearProps: 'transform,scale' });
      if(navItems) g.set(navItems, { clearProps: 'width,overflow' });
    }, 900);
  }

  const enter = i => { const tl = tls[i]; if(!tl) return; active[i]?.kill(); active[i] = tl.tweenTo(tl.duration(), { duration: 0.3, ease, overwrite: 'auto' }); };
  const leave = i => { const tl = tls[i]; if(!tl) return; active[i]?.kill(); active[i] = tl.tweenTo(0, { duration: 0.2, ease, overwrite: 'auto' }); };
  pills.forEach((p, i) => {
    p.addEventListener('mouseenter', () => enter(i));
    p.addEventListener('mouseleave', () => leave(i));
    p.addEventListener('click', e => { e.preventDefault(); onSelect?.(items[i], p); });
  });
  logoEl.addEventListener('mouseenter', () => {
    if(!g) return; logoTween?.kill(); g.set(logoImg, { rotate: 0 });
    logoTween = g.to(logoImg, { rotate: 360, duration: 0.2, ease, overwrite: 'auto' });
  });
  logoEl.addEventListener('click', e => { e.preventDefault(); onSelect?.(items[0], pills[0]); });
  container.querySelectorAll('.menu button').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const sub = items.flatMap(it => it.menu || []).find(m => m.href === b.dataset.href);
    onSelect?.(sub, b);
  }));

  function toggleMobile(){
    mobileOpen = !mobileOpen;
    if(g && hamburger){
      const lines = hamburger.querySelectorAll('.hamburger-line');
      g.to(lines[0], { rotation: mobileOpen ? 45 : 0, y: mobileOpen ? 3 : 0, duration: 0.3, ease });
      g.to(lines[1], { rotation: mobileOpen ? -45 : 0, y: mobileOpen ? -3 : 0, duration: 0.3, ease });
    }
    if(g && menu){
      if(mobileOpen){ g.set(menu, { visibility: 'visible' }); g.fromTo(menu, { opacity: 0, y: 10, scaleY: 1 }, { opacity: 1, y: 0, scaleY: 1, duration: 0.3, ease, transformOrigin: 'top center' }); }
      else g.to(menu, { opacity: 0, y: 10, scaleY: 1, duration: 0.2, ease, transformOrigin: 'top center', onComplete: () => g.set(menu, { visibility: 'hidden' }) });
    }
    onMobileMenuClick?.();
  }
  hamburger.addEventListener('click', toggleMobile);
  container.querySelectorAll('.mobile-menu-link').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const href = a.getAttribute('href');
    const it = items.find(x => x.href === href) || items.flatMap(x => x.menu || []).find(m => m.href === href);
    if(mobileOpen) toggleMobile();
    onSelect?.(it, a);
  }));

  return {
    setActive(href){
      pills.forEach((p, i) => p.classList.toggle('is-active', items[i].href === href || !!(items[i].menu || []).find(m => m.href === href)));
      container.querySelectorAll('.menu button').forEach(b => b.classList.toggle('is-on', b.dataset.href === href));
      container.querySelectorAll('.mobile-menu-link').forEach(a => a.classList.toggle('is-active', a.getAttribute('href') === href));
    },
    layout
  };
}

/* ---------------- BROWSE: the category bar ----------------
   Age groups and genres come from the server so the bar and the shelves can
   never disagree about what exists. Picking one swaps the grid to that shelf;
   "Featured shelf" returns to the curated showcase. */
let BROWSING = null; // {group, shelf} or null for the featured shelf
let BROWSE_POOL = []; // the full demand-ranked pool for the open shelf
const SHELF_SIZE = 18;

/* Eighteen from the pool. The first draw is the top of the demand ranking —
   the shelf's best foot forward. A shuffle draws at random from the whole
   pool, avoiding what's on screen, so "not that one, show me others" keeps
   producing genuinely different books rather than reordering the same set. */
function drawShelf(pool, exclude){
  const seen = new Set((exclude || []).map(i => i.book.id));
  const fresh = pool.filter(b => !seen.has(b.id));
  const source = fresh.length >= SHELF_SIZE ? fresh : pool;
  const picks = [...source];
  for(let i = picks.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [picks[i], picks[j]] = [picks[j], picks[i]]; }
  return picks.slice(0, SHELF_SIZE);
}

document.getElementById('shuffleBtn').addEventListener('click', () => {
  if(!BROWSING || !BROWSE_POOL.length) return;
  const { group, shelf } = BROWSING;
  const label = t(`shelf.${shelf}`);
  const items = drawShelf(BROWSE_POOL, CURRENT_ITEMS).map(b => ({ band: label, book: b, branches: null }));
  BROWSING = { group, shelf, gen: (BROWSING.gen || 0) + 1 }; // invalidates in-flight hydration
  resetReveal();
  renderGrid(items);
  document.querySelector('.main').scrollTop = 0;
  resultCount.textContent = t('shelf.different', { n: items.length }) + (HOME_BRANCH ? ' · ' + t('shelf.checking', { branch: HOME_BRANCH.label }) : '');
  hydrateBranches(items, group, shelf, BROWSING.gen);
});

let PILL_NAV = null;

async function buildCategoryBar(){
  let cats = [];
  if(CATALOG_LIVE){
    try{ cats = (await (await fetch(`/api/browse?categories=1&lang=${encodeURIComponent(catalogLang())}`)).json()).categories || []; }catch(e){}
  }
  const items = [{ label: t('nav.all'), href: '#all' }].concat(cats.map(g => ({
    label: g.id === 'new' ? t('nav.newShort') : g.id === 'lang' ? (I18N[LANG] || I18N.en).name : t(`nav.${g.id}`), href: `#${g.id}`,
    menu: g.shelves.map(sh => ({ label: t(`shelf.${sh.id}`), href: `#${g.id}/${sh.id}`, group: g.id, shelf: sh.id, groupLabel: t(`nav.${g.id}`) }))
  })));
  // Events: the calendar, narrowed by who it's for.
  items.push({
    label: t('nav.events'), href: '#events',
    menu: [
      { label: t('ev.all'),    href: '#events/all',     audience: '' },
      { label: t('ev.babies'), href: '#events/babies',  audience: 'babies' },
      { label: t('ev.kids'),   href: '#events/kids',    audience: 'kids' },
      { label: t('ev.teens'),  href: '#events/teens',   audience: 'teens' },
      { label: t('ev.adults'), href: '#events/adults',  audience: 'adults' },
      { label: t('ev.family'), href: '#events/family',  audience: 'family' }
    ]
  });

  PILL_NAV = createPillNav(document.getElementById('pillNav'), {
    logo: 'assets/hummy.png', logoAlt: 'Hummy AI', wordmark: 'Hummy AI', key: LANG,
    items, activeHref: '#all', ease: 'power3.easeOut',
    baseColor: '#006075', pillColor: '#ffffff', hoveredPillTextColor: '#ffffff', pillTextColor: '#003642',
    onSelect: (item) => {
      if(!item) return;
      if(item.href === '#all') { loadHome(); return; }
      if(item.href.startsWith('#events')){
        const target = 'audience' in item ? item : item.menu[0];
        openEvents(target.audience, target.href, target.label);
        return;
      }
      // An age pill on its own opens its first shelf; a menu entry opens that shelf.
      const target = item.shelf ? item : (item.menu && item.menu[0]);
      if(target) openShelf(target.group, target.shelf, target.href);
    }
  });
}

function markCategory(what){
  // `what` is an href like "#kids/mystery", the home button, or null (results).
  const href = typeof what === 'string' ? what : (what && what.id === 'catHome' ? '#all' : null);
  PILL_NAV?.setActive(href);
}

async function openShelf(group, shelf, href){
  HOME_GEN++; // abandon any home-view loading still in flight
  resetReveal();
  BROWSING = { group, shelf };
  markCategory(href || `#${group}/${shelf}`);
  resultCount.textContent = t('shelf.loading');
  grid.innerHTML = `<div class="shelf-empty">${esc(t('shelf.pulling'))}</div>`;

  let data;
  try{
    const r = await fetch(`/api/browse?group=${encodeURIComponent(group)}&shelf=${encodeURIComponent(shelf)}&lang=${encodeURIComponent(catalogLang())}`, { signal: AbortSignal.timeout(45000) });
    if(!r.ok) throw new Error('shelf unavailable');
    data = await r.json();
  }catch(e){
    grid.innerHTML = `<div class="shelf-empty">Couldn't load that shelf (${esc(e.message)}).</div>`;
    resultCount.textContent = 'Shelf unavailable';
    return;
  }
  if(BROWSING?.group !== group || BROWSING?.shelf !== shelf) return; // they clicked on

  document.getElementById('shelfTitle').textContent = `${group === 'lang' ? t('nav.lang', { lang: (I18N[LANG] || I18N.en).name }) : t(`nav.${group}`)} · ${t(`shelf.${shelf}`)}`;
  BROWSE_POOL = data.books;
  BROWSING = { group, shelf, gen: 0 };
  document.getElementById('shuffleBtn').hidden = BROWSE_POOL.length <= SHELF_SIZE;
  // Branch detail isn't known yet for these, so they render with system-wide
  // wording first, then each card is upgraded as its per-copy data arrives.
  const items = BROWSE_POOL.slice(0, SHELF_SIZE).map(b => ({ band: t(`shelf.${shelf}`), book: b, branches: null }));
  renderGrid(items);
  document.querySelector('.main').scrollTop = 0;
  resultCount.textContent = t(group === 'new' ? 'shelf.statusNew' : 'shelf.status', { n: items.length, pool: BROWSE_POOL.length }) + (HOME_BRANCH ? ' · ' + t('shelf.checking', { branch: HOME_BRANCH.label }) : '');
  hydrateBranches(items, group, shelf, 0);
}

/* Fetches per-copy branch data for browse results four at a time and redraws
   each card in place, so counts become branch-scoped without making the
   patron wait for eighteen requests before seeing anything. */
async function hydrateBranches(items, group, shelf, gen){
  const live = () => BROWSING && BROWSING.group === group && BROWSING.shelf === shelf && (BROWSING.gen || 0) === gen;
  for(let i = 0; i < items.length; i += 4){
    if(!live()) return;
    await Promise.all(items.slice(i, i + 4).map(async item => {
      try{
        const r = await fetch(`/api/availability?id=${encodeURIComponent(item.book.id)}`, { signal: AbortSignal.timeout(20000) });
        if(r.ok) item.branches = (await r.json()).branches || [];
      }catch(e){ item.branches = []; }
      const card = grid.querySelector(`.book[data-id="${CSS.escape(item.book.id)}"]`);
      if(card){ card.outerHTML = shelfCard(item, HOME_BRANCH); wireShelfCard(grid.querySelector(`.book[data-id="${CSS.escape(item.book.id)}"]`)); }
    }));
  }
  if(live()){
    resultCount.textContent = t('shelf.statusDone', { n: items.length, pool: BROWSE_POOL.length }) + (HOME_BRANCH ? ' · ' + t('shelf.at', { branch: HOME_BRANCH.label }) : '');
  }
}

/* ---------------- EVENTS TAB ----------------
   The calendar as a shelf: every upcoming event (or those for one audience),
   next occurrence first, at the patron's library when one is chosen. */
async function openEvents(audience, href, label, mode){
  HOME_GEN++;
  const gen = HOME_GEN;
  resetReveal();
  mode = mode || EVENTS_MODE;
  EVENTS_MODE = mode;
  BROWSING = { results: true, events: true, audience, label };
  BROWSE_POOL = [];
  document.getElementById('shuffleBtn').hidden = true;
  markCategory(href || '#events/all');
  const branch = HOME_BRANCH;
  document.getElementById('shelfTitle').textContent = label && audience ? `${t('nav.events')} · ${label}` : t('nav.events');
  resultCount.textContent = t('ev.loading');
  grid.innerHTML = '';
  grid.insertAdjacentHTML('beforeend', eventsModeBar(mode));

  if(mode === 'calendar'){ await renderCalendar(audience, branch, gen); return; }

  const sk = startSection(t('res.events'), '');
  for(let i = 0; i < 4; i++) addCard(sk, skeletonCard());

  const params = new URLSearchParams({ limit: '40' });
  if(audience) params.set('audience', audience);
  if(branch && branch.code !== '_online_') params.set('branch', branch.code);
  let data = null;
  try{ data = await (await fetch(`/api/events?${params}`, { signal: AbortSignal.timeout(30000) })).json(); }catch(e){}
  if(gen !== HOME_GEN) return;

  const events = (data && data.events) || [];
  grid.innerHTML = eventsModeBar(mode);
  if(!events.length){
    resultCount.textContent = t('ev.none', { aud: audience ? t('ev.for', { aud: label || audience }) : '', where: branch ? t('st.at', { branch: branch.label }) : '' });
    grid.insertAdjacentHTML('beforeend', `<div class="shelf-empty">${esc(t('ev.empty'))}</div>`);
    return;
  }
  resultCount.textContent = t('ev.count', { n: events.length, where: branch ? t('st.at', { branch: branch.label }) : '' });
  const matched = (data.matched && data.matched.audience) || '';
  grid.insertAdjacentHTML('beforeend', `<div class="grid-section"><h3>${esc(t('res.events'))}${matched ? `<span class="sec-sub">${esc(matched)}</span>` : ''}</h3><button class="back-home">${esc(t('res.back'))}</button></div>` +
    events.map(eventGridCard).join(''));
  grid.querySelectorAll('.book').forEach(wireShelfCard);
  grid.querySelector('.back-home')?.addEventListener('click', () => loadHome());
  document.querySelector('.main').scrollTop = 0;
}

/* ---- calendar mode ---- */
let EVENTS_MODE = 'list';
let CAL_MONTH = null;   // 'YYYY-MM' currently shown

function eventsModeBar(mode){
  return `<div class="ev-modes" role="tablist">
    <button role="tab" class="ev-mode${mode === 'list' ? ' is-on' : ''}" data-mode="list" aria-selected="${mode === 'list'}">${esc(t('ev.list'))}</button>
    <button role="tab" class="ev-mode${mode === 'calendar' ? ' is-on' : ''}" data-mode="calendar" aria-selected="${mode === 'calendar'}">${esc(t('ev.calendar'))}</button>
  </div>`;
}
document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('.ev-mode');
  if(b && BROWSING && BROWSING.events) openEvents(BROWSING.audience || '', null, BROWSING.label || null, b.dataset.mode);
});

function ymOf(d){ return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }

async function renderCalendar(audience, branch, gen){
  const today = new Date();
  if(!CAL_MONTH) CAL_MONTH = ymOf(today);
  const [y, m] = CAL_MONTH.split('-').map(Number);
  const monthName = new Date(y, m - 1, 1).toLocaleDateString(locale(), { month: 'long', year: 'numeric' });

  const params = new URLSearchParams({ month: CAL_MONTH });
  if(audience) params.set('audience', audience);
  if(branch && branch.code !== '_online_') params.set('branch', branch.code);

  grid.insertAdjacentHTML('beforeend', `<div class="cal-wrap" id="calWrap">
    <div class="cal-head">
      <button class="cal-nav" data-dir="-1" aria-label="${esc(t('ev.prevMonth'))}">‹</button>
      <h3 class="cal-title">${esc(monthName)}</h3>
      <button class="cal-nav" data-dir="1" aria-label="${esc(t('ev.nextMonth'))}">›</button>
      <button class="cal-today">${esc(t('ev.today'))}</button>
    </div>
    <div class="cal-grid" id="calGrid"><div class="cal-loading">${esc(t('ev.loading'))}</div></div>
    <div class="cal-day-list" id="calDay"></div>
  </div>`);
  const wrap = document.getElementById('calWrap');
  wrap.querySelectorAll('.cal-nav').forEach(b => b.addEventListener('click', () => {
    const d = new Date(y, m - 1 + Number(b.dataset.dir), 1); CAL_MONTH = ymOf(d);
    openEvents(audience, null, BROWSING.label || null, 'calendar');
  }));
  wrap.querySelector('.cal-today').addEventListener('click', () => { CAL_MONTH = ymOf(today); openEvents(audience, null, BROWSING.label || null, 'calendar'); });

  let data = null;
  try{ data = await (await fetch(`/api/events/month?${params}`, { signal: AbortSignal.timeout(45000) })).json(); }catch(e){}
  if(gen !== HOME_GEN) return;
  const events = (data && data.events) || [];

  // Group by day.
  const byDay = new Map();
  for(const ev of events){
    const day = String(ev.start || '').slice(0, 10);
    if(!byDay.has(day)) byDay.set(day, []);
    byDay.get(day).push(ev);
  }
  resultCount.textContent = t('ev.monthCount', { n: events.length, month: monthName, where: branch ? t('st.at', { branch: branch.label }) : '' })
    + (data && data.truncated ? ` · ${t('ev.truncated')}` : '');

  // Build the month: week starts on Sunday, as the library's own calendar does.
  const first = new Date(y, m - 1, 1), daysIn = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const dow = Array.from({ length: 7 }, (_, i) => new Date(2023, 0, 1 + i).toLocaleDateString(locale(), { weekday: 'short' }));
  let html = dow.map(d => `<div class="cal-dow">${esc(d)}</div>`).join('');
  for(let i = 0; i < lead; i++) html += `<div class="cal-cell empty"></div>`;
  const todayKey = ymOf(today) + '-' + String(today.getDate()).padStart(2, '0');
  for(let d = 1; d <= daysIn; d++){
    const key = `${CAL_MONTH}-${String(d).padStart(2, '0')}`;
    const list = byDay.get(key) || [];
    const past = key < todayKey;
    html += `<div class="cal-cell${list.length ? ' has' : ''}${key === todayKey ? ' today' : ''}${past ? ' past' : ''}" data-day="${key}" role="button" tabindex="0">
      <div class="cal-num">${d}</div>
      ${list.slice(0, 3).map(ev => `<div class="cal-ev" title="${esc(ev.title)}"><span class="cal-time">${esc(String(ev.start).slice(11, 16))}</span> ${esc(ev.title)}</div>`).join('')}
      ${list.length > 3 ? `<div class="cal-more">+${list.length - 3}</div>` : ''}
    </div>`;
  }
  const calGrid = document.getElementById('calGrid');
  calGrid.innerHTML = html;

  // Clicking a day lists that day's events as cards underneath.
  const showDay = (key) => {
    calGrid.querySelectorAll('.cal-cell.sel').forEach(c => c.classList.remove('sel'));
    calGrid.querySelector(`.cal-cell[data-day="${key}"]`)?.classList.add('sel');
    const list = byDay.get(key) || [];
    const dayName = new Date(key + 'T00:00:00').toLocaleDateString(locale(), { weekday: 'long', month: 'long', day: 'numeric' });
    const box = document.getElementById('calDay');
    box.innerHTML = `<div class="grid-section"><h3>${esc(dayName)}<span class="sec-sub">${esc(t('ev.dayCount', { n: list.length }))}</span></h3></div>` +
      (list.length ? `<div class="grid cal-day-grid">${list.map(eventGridCard).join('')}</div>` : `<div class="shelf-empty">${esc(t('ev.empty'))}</div>`);
    box.querySelectorAll('.book').forEach(wireShelfCard);
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  calGrid.querySelectorAll('.cal-cell[data-day]').forEach(c => {
    c.addEventListener('click', () => showDay(c.dataset.day));
    c.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); showDay(c.dataset.day); } });
  });
  // Open on today if it's in view, else the first day with anything on.
  const firstWith = [...byDay.keys()].sort()[0];
  if(byDay.has(todayKey)) showDay(todayKey); else if(firstWith) showDay(firstWith);
  document.querySelector('.main').scrollTop = 0;
}

/* ---------------- SCROLL REVEAL ----------------
   Every card or header added to the grid is watched; the first time it
   scrolls into view it gets `.in` and fades up. Redraws (hydration replaces
   a card's HTML) must not replay the animation, so revealed ids are
   remembered and re-applied instantly. A new view clears that memory. */
const REVEALED = new Set();
const revealIO = new IntersectionObserver((entries) => {
  let n = 0;
  for(const e of entries){
    if(!e.isIntersecting) continue;
    const el = e.target;
    el.style.setProperty('--reveal-delay', `${Math.min(n++ * 45, 360)}ms`);
    el.classList.add('in');
    if(el.dataset.id) REVEALED.add(el.dataset.id);
    revealIO.unobserve(el);
  }
}, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });

function watchReveal(el){
  if(!(el instanceof Element)) return;
  if(el.classList.contains('skeleton')) return;
  if(el.dataset.id && REVEALED.has(el.dataset.id)){ el.classList.add('in'); return; }
  revealIO.observe(el);
}
function resetReveal(){ REVEALED.clear(); }

new MutationObserver((muts) => {
  for(const m of muts) for(const node of m.addedNodes){
    if(!(node instanceof Element)) continue;
    if(node.matches('.book, .grid-section')) watchReveal(node);
    node.querySelectorAll?.('.book, .grid-section').forEach(watchReveal);
  }
}).observe(document.getElementById('grid'), { childList: true, subtree: true });

/* ---------------- ALL BOOKS (the startup view) ----------------
   Every shelf from the top bar, stacked: Toddlers, Kids & Teens, Adults —
   each showing its most-borrowed titles with a "See all" that opens the tab —
   and the featured picks last. Sections render as their data arrives, so the
   page is usable in seconds rather than after eighty catalog requests. */
const HOME_PER_SHELF = 6;
let HOME_GEN = 0;         // bumped whenever the home view is (re)built or left
let HOME_RENDER_GEN = -1; // the HOME_GEN of the last home render, for late fills
let HOME_ITEMS = [];      // everything on the home grid, for branch redraws

function sectionHeader(id, title, sub, seeAll){
  return `<div class="grid-section" data-section="${esc(id)}">
    <h3>${esc(title)}${sub ? `<span class="sec-sub">${esc(sub)}</span>` : ''}</h3>
    ${seeAll ? `<button data-group="${esc(seeAll.group)}" data-shelf="${esc(seeAll.shelf)}">${esc(t('home.seeAll'))}</button>`
             : `<span class="sec-loading">${esc(t('home.loading'))}</span>`}
  </div>`;
}

async function loadHome(){
  const gen = ++HOME_GEN;
  HOME_RENDER_GEN = gen;
  resetReveal();
  BROWSING = null; BROWSE_POOL = [];
  document.getElementById('shuffleBtn').hidden = true;
  document.getElementById('shelfTitle').textContent = t('home.title');
  markCategory('#all');
  resultCount.textContent = t('home.sub');
  HOME_ITEMS = [];
  grid.innerHTML = '';

  let cats = [];
  try{ cats = (await (await fetch(`/api/browse?categories=1&lang=${encodeURIComponent(catalogLang())}`)).json()).categories || []; }catch(e){}
  if(gen !== HOME_GEN) return;

  // Lay every section down first so the order is fixed and each fills in.
  const plan = [];
  // What just arrived leads the page; the age shelves follow.
  const rank = (g) => g.id === 'lang' ? 0 : g.id === 'new' ? 1 : 2;
  const ordered = [...cats].sort((a, b) => rank(a) - rank(b));
  const groupTitle = (g) => g.id === 'lang' ? t('nav.lang', { lang: (I18N[LANG] || I18N.en).name }) : t(`nav.${g.id}`);
  for(const g of ordered) for(const sh of g.shelves) plan.push({ id:`${g.id}-${sh.id}`, group:g.id, shelf:sh.id, title:`${groupTitle(g)} · ${t(`shelf.${sh.id}`)}` });
  for(const sec of plan) grid.insertAdjacentHTML('beforeend', sectionHeader(sec.id, sec.title, '', null));
  // The featured picks are English titles; in another language the shelves speak for themselves.
  grid.insertAdjacentHTML('beforeend', sectionHeader('featured', t('home.featured'), t('home.featuredSub'), null));

  // Shelves two at a time — enough to feel quick, polite to the catalog.
  const all = [];
  for(let i = 0; i < plan.length; i += 2){
    await Promise.all(plan.slice(i, i + 2).map(async sec => {
      let data = null;
      try{ data = await (await fetch(`/api/browse?group=${sec.group}&shelf=${sec.shelf}&lang=${encodeURIComponent(catalogLang())}`, { signal: AbortSignal.timeout(60000) })).json(); }catch(e){}
      if(gen !== HOME_GEN) return;
      const items = ((data && data.books) || []).slice(0, HOME_PER_SHELF).map(b => ({ band: sec.title, book: b, branches: null, section: sec.id }));
      fillSection(sec.id, items, { group: sec.group, shelf: sec.shelf });
      all.push(...items);
    }));
  }

  if(gen !== HOME_GEN) return;
  // Featured last. If the curated set has already arrived, place it now;
  // otherwise loadShelf() fills the section when it does.
  if(SHELF.length){
    const featured = SHELF.map(i => ({ ...i, section: 'featured' }));
    fillSection('featured', featured, null);
    all.push(...featured);
  }
  HOME_ITEMS = all;
  CURRENT_ITEMS = all;
  hydrateHome(all, gen);
}

function fillSection(id, items, seeAll){
  const header = grid.querySelector(`.grid-section[data-section="${CSS.escape(id)}"]`);
  if(!header) return;
  const right = seeAll
    ? `<button data-group="${esc(seeAll.group)}" data-shelf="${esc(seeAll.shelf)}">${esc(t('home.seeAll'))}</button>`
    : '';
  header.querySelector('.sec-loading, button')?.remove();
  if(right) header.insertAdjacentHTML('beforeend', right);
  header.querySelector('button')?.addEventListener('click', e => openShelf(e.currentTarget.dataset.group, e.currentTarget.dataset.shelf));
  // Cards go right after their header, before the next section header.
  let anchor = header;
  for(const item of items){
    anchor.insertAdjacentHTML('afterend', shelfCard(item, HOME_BRANCH));
    anchor = anchor.nextElementSibling;
    wireShelfCard(anchor);
  }
  if(!items.length) header.insertAdjacentHTML('afterend', `<div class="shelf-empty">${esc(t('home.empty'))}</div>`);
}

async function hydrateHome(items, gen){
  const todo = items.filter(i => i.branches === null);
  for(let i = 0; i < todo.length; i += 4){
    if(gen !== HOME_GEN) return;
    await Promise.all(todo.slice(i, i + 4).map(async item => {
      try{
        const r = await fetch(`/api/availability?id=${encodeURIComponent(item.book.id)}`, { signal: AbortSignal.timeout(20000) });
        if(r.ok) item.branches = (await r.json()).branches || [];
      }catch(e){ item.branches = []; }
      if(item.result) item.result.branches = item.branches;
      if(gen !== HOME_GEN) return;
      const card = grid.querySelector(`.book[data-id="${CSS.escape(item.book.id)}"]`);
      if(card){ card.outerHTML = shelfCard(item, HOME_BRANCH); wireShelfCard(grid.querySelector(`.book[data-id="${CSS.escape(item.book.id)}"]`)); }
    }));
  }
}

/* Redraw the home grid in place (branch change) without refetching. */
function rerenderHome(){
  for(const item of HOME_ITEMS){
    const card = grid.querySelector(`.book[data-id="${CSS.escape(item.book.id)}"]`);
    if(card){ card.outerHTML = shelfCard(item, HOME_BRANCH); wireShelfCard(grid.querySelector(`.book[data-id="${CSS.escape(item.book.id)}"]`)); }
  }
}

/* ---------------- CATALOG SHELF ----------------
   A browsable handful of real SCCLD books across every age, fetched from the
   proxy. Not the whole catalog — a shelf to look through, with the same live
   availability the assistant reports, so the two can never disagree. */
let SHELF = [];
let CURRENT_ITEMS = []; // whatever the grid is showing right now

const grid = document.getElementById('grid');
const resultCount = document.getElementById('resultCount');

// Covers come from the catalog when it has one; otherwise a tinted spine keeps
// the grid even rather than leaving a hole.
const BAND_COLORS = {
  'Picture books':'#3d6b3f', 'Early readers':'#a05a2c', 'Middle grade':'#a9803f',
  'Teen':'#2b5d78', 'Adult fiction':'#5c451d', 'Non-fiction':'#33472f', 'New & popular':'#7a3b3b'
};

function shelfCard(item, branch, extra){
  const b = item.book;
  KNOWN_BOOKS.set(b.id, b);
  const shown = b.nativeTitle || b.title;
  const a = b.availability;
  const line = availabilityLine({ found:true, book:b, branches:item.branches }, branch);
  const shelf = shelfLine({ found:true, book:b, branches:item.branches }, branch);
  const color = BAND_COLORS[item.band] || '#33472f';
  const cover = b.jacket
    ? `<img class="cover-bg" src="${esc(b.jacket)}" alt="" aria-hidden="true" loading="lazy" onerror="this.remove()">` +
      `<img class="cover-img" src="${esc(b.jacket)}" alt="" loading="lazy" onerror="this.remove()">`
    : '';

  const inList = LIST.some(x => x.id === b.id);
  return `
    <div class="book" data-id="${esc(b.id)}" data-url="${esc(b.recordUrl)}">
      <div class="cover" style="background:${color};"><div class="spine"></div>${cover}<span class="cover-text">${esc(shown)}</span>
        <button class="add-btn${inList ? ' in' : ''}" data-add="${esc(b.id)}" aria-pressed="${inList}" title="${esc(inList ? t('list.added') : t('list.add'))}" aria-label="${esc(inList ? t('list.added') : t('list.add'))}">${inList ? '✓' : '+'}</button>
      </div>
      <div class="book-body">
        <span class="band">${esc(item.band)}</span>
        <h3>${esc(shown)}</h3>
        ${b.nativeTitle ? `<p class="author roman">${esc(b.title)}</p>` : ''}
        <p class="author">${esc((b.authors && b.authors[0]) || '')}</p>
        <div class="shelf-avail ${line.cls}"><span class="dot"></span>${esc(line.text)}</div>
        ${shelf}
        ${extra || ''}
      </div>
    </div>`;
}

/* A search result as a grid card. Found books are ordinary shelf cards; a
   title the library lacks gets a plain card saying so — never a stand-in. */
function resultCard(entry, branch, band, sink){
  const r = entry.result;
  if(r && r.found){
    // `branches: null` means not fetched yet; the item shares the entry's
    // result object so hydration updates both the card and the follow-up data.
    const item = { band, book: r.book, branches: Array.isArray(r.branches) ? r.branches : null, result: r };
    if(sink) sink.push(item);
    return shelfCard(item, branch);
  }
  return `
    <div class="book notfound" data-url="${esc(sccldSearchUrl(entry.title, branch))}">
      <div class="cover"><div class="spine"></div><span class="cover-text">${esc(entry.title)}</span></div>
      <div class="book-body">
        <span class="band">${esc(band)}</span>
        <h3>${esc(entry.title)}</h3>
        <p class="author">${esc(entry.author || '')}</p>
        <div class="shelf-avail missing"><span class="dot"></span>${esc(t('av.notIn'))}</div>
      </div>
    </div>`;
}

function eventGridCard(ev){
  const where = [ev.branchName, ev.room].filter(Boolean).join(' · ');
  const who = (ev.audiences || []).map(a => a.replace(/^Kids:\s*/, '')).slice(0, 2);
  // The library's own image for the event sits where a book's cover would;
  // events without one keep the teal block with the date and title.
  const art = ev.image
    ? `<img class="cover-bg" src="${esc(ev.image)}" alt="" aria-hidden="true" loading="lazy" onerror="this.remove()">` +
      `<img class="cover-img" src="${esc(ev.image)}" alt="" loading="lazy" onerror="this.remove()">`
    : '';
  return `
    <div class="book event${ev.image ? ' has-art' : ''}" data-url="${esc(ev.url)}">
      <div class="cover" style="background:var(--moss);"><div class="spine"></div>${art}
        <div class="ev-head"><div class="ev-when">${esc(eventWhen(ev))}</div><div class="ev-title">${esc(ev.title)}</div></div>
      </div>
      <div class="book-body">
        ${ev.image ? `<div class="ev-when dark">${esc(eventWhen(ev))}</div><h3>${esc(ev.title)}</h3>` : ''}
        ${where ? `<div class="ev-where">${esc(where)}</div>` : ''}
        ${ev.description ? `<div class="ev-desc">${esc(ev.description.slice(0, 120))}${ev.description.length > 120 ? '…' : ''}</div>` : ''}
        <div class="ev-tags">${who.map(a => `<span class="ev-tag">${esc(a)}</span>`).join('')}${ev.isFull ? `<span class="ev-tag full">${esc(t('ev.full'))}</span>` : ''}</div>
      </div>
    </div>`;
}

/* The catalog's own results for the raw query. A library search must show
   the library's books — every one it found, in the order it ranks them — not
   a handful the model chose. Cards arrive with summary counts and are
   hydrated with branch data afterwards, the same as a browse shelf. */
async function catalogSearch(query){
  if(!CATALOG_LIVE) return null;
  try{
    const r = await fetch(`/api/search?q=${encodeURIComponent(query)}&limit=24`, { signal: AbortSignal.timeout(25000) });
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

/* Do the catalog's results actually answer what was typed? "Cooking Thai"
   yes — its top hits carry those words in their titles. "Something funny for
   a 6 year old" no — the catalog returns noise for a sentence like that, and
   the model's picks should lead instead. */
function searchLooksRelevant(query, books){
  const words = normTitle(query).split(' ').filter(w => w.length > 2);
  if(!words.length || !books.length) return false;
  const hits = books.slice(0, 5).filter(b => {
    const t = normTitle(b.title + ' ' + (b.subtitle || '') + ' ' + (b.nativeTitle || ''));
    return words.filter(w => t.includes(w)).length >= Math.ceil(words.length / 2);
  });
  return hits.length >= 1;
}

/* Lays sections into the grid: [{title, sub, cards:[html]}]. Used for every
   search answer, so results look like any other shelf. */
function showResults(title, sections, hydrate){
  const gen = ++HOME_GEN;          // abandon any home/shelf work in flight
  resetReveal();
  BROWSING = { results: true };
  BROWSE_POOL = [];
  document.getElementById('shuffleBtn').hidden = true;
  document.getElementById('shelfTitle').textContent = title;
  grid.innerHTML = sections.map(sec =>
    `<div class="grid-section"><h3>${esc(sec.title)}${sec.sub ? `<span class="sec-sub">${esc(sec.sub)}</span>` : ''}</h3>
       <button class="back-home">${esc(t('res.back'))}</button></div>` + sec.cards.join('')
  ).join('');
  grid.querySelectorAll('.book').forEach(wireShelfCard);
  grid.querySelectorAll('.back-home').forEach(b => b.addEventListener('click', () => loadHome()));
  document.querySelector('.main').scrollTop = 0;
  markCategory(null);
  // Catalog-search cards come without branch data; fill it in behind.
  if(hydrate && hydrate.length) hydrateHome(hydrate, gen);
}

function skeletonCard(){
  return `<div class="book skeleton" aria-hidden="true"><div class="cover"></div><div class="book-body"><div class="sk w40"></div><div class="sk w80"></div><div class="sk w60"></div></div></div>`;
}

/* A section header appended to the results view, returned so cards can be
   streamed into it one at a time as they resolve. */
function startSection(title, sub){
  grid.insertAdjacentHTML('beforeend',
    `<div class="grid-section"><h3>${esc(title)}<span class="sec-sub">${esc(sub || '')}</span></h3></div>`);
  return grid.lastElementChild;
}
function setSectionSub(header, sub){ const el = header.querySelector('.sec-sub'); if(el) el.textContent = sub || ''; }

/* Inserts one card at the end of its section (before the next header). */
function addCard(header, html){
  let next = header.nextElementSibling;
  while(next && !next.classList.contains('grid-section')) next = next.nextElementSibling;
  if(next) next.insertAdjacentHTML('beforebegin', html); else grid.insertAdjacentHTML('beforeend', html);
  const card = next ? next.previousElementSibling : grid.lastElementChild;
  wireShelfCard(card);
  return card;
}

/* Adds a section to the results already on screen — how the model's picks
   join the catalog's results without a redraw. */
function appendResultSection(sec, hydrate){
  if(!BROWSING || !BROWSING.results) return;
  const gen = HOME_GEN;
  grid.insertAdjacentHTML('beforeend',
    `<div class="grid-section"><h3>${esc(sec.title)}${sec.sub ? `<span class="sec-sub">${esc(sec.sub)}</span>` : ''}</h3></div>` + sec.cards.join(''));
  const fresh = [...grid.querySelectorAll('.book')].slice(-sec.cards.length);
  fresh.forEach(wireShelfCard);
  if(hydrate && hydrate.length) hydrateHome(hydrate, gen);
}

function wireShelfCard(card){
  if(!card) return;
  card.addEventListener('click', e => {
    if(e.target.closest('.add-btn')) return;       // the + has its own job
    if(e.target.closest('.remove-btn')) return;
    window.open(card.dataset.url, '_blank', 'noopener');
  });
  card.querySelector('.add-btn')?.addEventListener('click', e => {
    e.stopPropagation();
    toggleInList(card.dataset.id, card);
  });
}

function renderGrid(list){
  const branch = HOME_BRANCH;
  CURRENT_ITEMS = list;
  grid.innerHTML = list.map(item => shelfCard(item, branch)).join('');
  grid.querySelectorAll('.book').forEach(wireShelfCard);
  if(BROWSING) return; // browse mode writes its own status line
  resultCount.textContent = t('res.titles', { n: list.length }) + (branch ? ' · ' + t('shelf.at', { branch: branch.label }) : '');
}

async function loadShelf(){
  if(!CATALOG_LIVE) return;
  // On a cold start this competes with every shelf for the catalog and can
  // take a while; a failed attempt is retried after the cache has warmed
  // rather than rendering an empty "nothing on this shelf".
  for(let attempt = 0; attempt < 3 && !SHELF.length; attempt++){
    try{
      const r = await fetch('/api/showcase', { signal: AbortSignal.timeout(90000) });
      if(!r.ok) throw new Error('showcase unavailable');
      SHELF = (await r.json()).books || [];
    }catch(e){ SHELF = []; await new Promise(res => setTimeout(res, 4000 * (attempt + 1))); }
  }
  if(!SHELF.length){
    const h = grid.querySelector('.grid-section[data-section="featured"] .sec-loading');
    if(h) h.textContent = t('shelf.unavailable');
    return;
  }
  // Slot the featured picks into the home view only if it's still the view
  // on screen; a patron who has moved to a tab keeps their tab.
  if(HOME_RENDER_GEN === HOME_GEN){
    const featured = SHELF.map(i => ({ ...i, section: 'featured' }));
    fillSection('featured', featured, null);
    HOME_ITEMS.push(...featured);
    CURRENT_ITEMS = HOME_ITEMS;
    hydrateHome(featured, HOME_GEN);
  }
}

/* ---------------- LogoLoop (React Bits) — vanilla port ----------------
   Same behaviour as the React component: the sequence is copied enough
   times to cover the container plus headroom, a requestAnimationFrame loop
   moves the track by a velocity that eases toward its target (so hovering
   to pause decelerates rather than stops dead), and the offset wraps at one
   sequence length so the loop is seamless. Sizes are re-measured on resize
   and once every image has loaded. */
function createLogoLoop(container, opts){
  const {
    logos = [], speed = 120, direction = 'left', width = '100%', logoHeight = 28, gap = 32,
    hoverSpeed = 0, fadeOut = false, fadeOutColor, scaleOnHover = false, ariaLabel = 'Partner logos', className = ''
  } = opts;
  const SMOOTH_TAU = 0.25, MIN_COPIES = 2, COPY_HEADROOM = 2;
  const isVertical = direction === 'up' || direction === 'down';
  const targetVelocity = Math.abs(speed) * (isVertical ? (direction === 'up' ? 1 : -1) : (direction === 'left' ? 1 : -1)) * (speed < 0 ? -1 : 1);

  container.className = ['logoloop', isVertical ? 'logoloop--vertical' : 'logoloop--horizontal', fadeOut && 'logoloop--fade', scaleOnHover && 'logoloop--scale-hover', className].filter(Boolean).join(' ');
  container.setAttribute('role', 'region'); container.setAttribute('aria-label', ariaLabel);
  container.style.setProperty('--logoloop-gap', `${gap}px`);
  container.style.setProperty('--logoloop-logoHeight', `${logoHeight}px`);
  if(fadeOutColor) container.style.setProperty('--logoloop-fadeColor', fadeOutColor);
  if(!isVertical) container.style.width = typeof width === 'number' ? `${width}px` : width;

  const item = (it) => {
    const img = `<img src="${esc(it.src)}" alt="${esc(it.alt || '')}" ${it.title ? `title="${esc(it.title)}"` : ''} loading="lazy" decoding="async" draggable="false">`;
    const name = it.name ? `<span class="logo-name">${esc(it.name)}</span>` : '';
    const inner = it.href
      ? `<a class="logoloop__link" href="${esc(it.href)}" aria-label="${esc(it.alt || it.title || 'logo link')}" target="_blank" rel="noreferrer noopener">${img}</a>`
      : img;
    return `<li class="logoloop__item">${inner}${name}</li>`;
  };
  const list = (hidden) => `<ul class="logoloop__list" role="list"${hidden ? ' aria-hidden="true"' : ''}>${logos.map(item).join('')}</ul>`;

  const track = document.createElement('div');
  track.className = 'logoloop__track';
  container.appendChild(track);

  let copies = MIN_COPIES, seqSize = 0, offset = 0, velocity = 0, hovered = false, last = null, raf = null;

  function render(){ track.innerHTML = Array.from({ length: copies }, (_, i) => list(i > 0)).join(''); }
  function measure(){
    const seq = track.querySelector('.logoloop__list');
    if(!seq) return;
    const rect = seq.getBoundingClientRect();
    if(isVertical){
      const parentH = container.parentElement?.clientHeight || 0;
      if(parentH > 0) container.style.height = `${Math.ceil(parentH)}px`;
      if(rect.height > 0){
        seqSize = Math.ceil(rect.height);
        const need = Math.ceil((container.clientHeight || parentH || rect.height) / rect.height) + COPY_HEADROOM;
        setCopies(Math.max(MIN_COPIES, need));
      }
    } else if(rect.width > 0){
      seqSize = Math.ceil(rect.width);
      setCopies(Math.max(MIN_COPIES, Math.ceil(container.clientWidth / rect.width) + COPY_HEADROOM));
    }
  }
  function setCopies(n){ if(n !== copies){ copies = n; render(); } }

  render();
  // Re-measure once every image is in — a lazy logo can change the sequence width.
  const imgs = [...track.querySelectorAll('img')];
  let pending = imgs.length;
  const done = () => { if(--pending <= 0) measure(); };
  if(!pending) measure();
  imgs.forEach(im => im.complete ? done() : (im.addEventListener('load', done, { once: true }), im.addEventListener('error', done, { once: true })));
  if(window.ResizeObserver){ const ro = new ResizeObserver(measure); ro.observe(container); }
  else window.addEventListener('resize', measure);
  measure();

  track.addEventListener('mouseenter', () => { hovered = true; });
  track.addEventListener('mouseleave', () => { hovered = false; });

  function animate(ts){
    if(last === null) last = ts;
    const dt = Math.max(0, ts - last) / 1000; last = ts;
    const target = hovered && hoverSpeed !== undefined ? hoverSpeed : targetVelocity;
    velocity += (target - velocity) * (1 - Math.exp(-dt / SMOOTH_TAU));
    if(seqSize > 0){
      offset = (((offset + velocity * dt) % seqSize) + seqSize) % seqSize;
      track.style.transform = isVertical ? `translate3d(0, ${-offset}px, 0)` : `translate3d(${-offset}px, 0, 0)`;
    }
    raf = requestAnimationFrame(animate);
  }
  raf = requestAnimationFrame(animate);

  return { destroy(){ if(raf) cancelAnimationFrame(raf); } };
}

function buildPartners(){
  const box = document.getElementById('logoLoop');
  if(!box || box.dataset.built) return;
  box.dataset.built = '1';
  createLogoLoop(box, {
    logos: [
      { src: 'assets/hummy.png',         alt: 'Hummy AI',                            name: 'Hummy AI' },
      { src: 'assets/sccld.png',         alt: 'Santa Clara County Library District', name: 'Santa Clara County Library', href: 'https://sccld.org' },
      { src: 'assets/bibliocommons.svg', alt: 'BiblioCommons',                       name: 'BiblioCommons', href: 'https://www.bibliocommons.com' }
    ],
    speed: 60, direction: 'left', logoHeight: 36, gap: 72,
    hoverSpeed: 0, fadeOut: true, fadeOutColor: '#ffffff', scaleOnHover: true,
    ariaLabel: 'Partners'
  });
}

/* ---------------- I'M FEELING LUCKY ----------------
   One random book, popped out. Drawn from a random shelf's pool, but not
   blindly: a handful of candidates with copies in stock are checked against
   the chosen library, and one that is on that library's shelf right now is
   preferred — a lucky pick you can't take home isn't lucky. */
const luckyPanel = document.getElementById('luckyPanel');
const luckyScrim = document.getElementById('luckyScrim');

function openLucky(){ luckyPanel.hidden = false; luckyScrim.hidden = false; rollLucky(); }
function closeLucky(){ luckyPanel.hidden = true; luckyScrim.hidden = true; }
document.getElementById('luckyOpen').addEventListener('click', openLucky);
document.getElementById('luckyClose').addEventListener('click', closeLucky);
luckyScrim.addEventListener('click', closeLucky);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !luckyPanel.hidden) closeLucky(); });

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

async function rollLucky(){
  const body = document.getElementById('luckyBody');
  body.innerHTML = `<div class="lucky-loading"><span class="die">🎲</span>${esc(t('lucky.loading'))}</div>`;
  const branch = HOME_BRANCH;

  let cats = [];
  try{ cats = (await (await fetch(`/api/browse?categories=1&lang=${encodeURIComponent(catalogLang())}`)).json()).categories || []; }catch(e){}
  cats = cats.filter(g => g.id !== 'lang' || catalogLang());
  if(!cats.length){ body.innerHTML = `<div class="lucky-loading">${esc(t('lucky.none'))}</div>`; return; }
  const g = pick(cats), sh = pick(g.shelves);
  let pool = [];
  try{ pool = (await (await fetch(`/api/browse?group=${g.id}&shelf=${sh.id}&lang=${encodeURIComponent(catalogLang())}`, { signal: AbortSignal.timeout(45000) })).json()).books || []; }catch(e){}
  const stocked = pool.filter(b => b.availability.availableCopies > 0);
  if(!stocked.length){ body.innerHTML = `<div class="lucky-loading">${esc(t('lucky.none'))}</div>`; return; }

  // Up to five candidates, checked in parallel; the first on the chosen
  // library's shelf wins, else the first with a copy anywhere.
  const cands = [...stocked].sort(() => Math.random() - 0.5).slice(0, 5);
  const checked = await Promise.all(cands.map(async b => {
    try{ const r = await fetch(`/api/availability?id=${encodeURIComponent(b.id)}`, { signal: AbortSignal.timeout(20000) }); return { book: b, branches: r.ok ? (await r.json()).branches || [] : [] }; }
    catch(e){ return { book: b, branches: [] }; }
  }));
  const here = (it) => branch && branch.code !== '_online_' ? (it.branches.find(r => r.code === branch.code)?.available || 0) > 0 : true;
  const chosen = checked.find(here) || checked[0];
  KNOWN_BOOKS.set(chosen.book.id, chosen.book);
  const band = `${g.id === 'lang' ? t('nav.lang', { lang: (I18N[LANG] || I18N.en).name }) : t(`nav.${g.id}`)} · ${t(`shelf.${sh.id}`)}`;
  renderLucky(chosen, band, branch);
}

function renderLucky(it, band, branch){
  const b = it.book, shown = b.nativeTitle || b.title;
  const line = availabilityLine({ found: true, book: b, branches: it.branches }, branch);
  const shelf = shelfLine({ found: true, book: b, branches: it.branches }, branch);
  const inList = LIST.some(x => x.id === b.id);
  document.getElementById('luckyBody').innerHTML = `
    <div class="lucky-cover">${b.jacket ? `<img class="bg" src="${esc(b.jacket)}" alt="" aria-hidden="true"><img class="fg" src="${esc(b.jacket)}" alt="">` : `<span class="cover-text">${esc(shown)}</span>`}</div>
    <div class="lucky-info">
      <span class="band">${esc(band)}</span>
      <h3>${esc(shown)}</h3>
      ${b.nativeTitle ? `<p class="author roman">${esc(b.title)}</p>` : ''}
      <p class="author">${esc((b.authors && b.authors[0]) || '')}</p>
      <div class="shelf-avail ${line.cls}"><span class="dot"></span>${esc(line.text)}</div>
      ${shelf}
      <div class="lucky-actions">
        <button class="primary" id="luckyAdd">${inList ? '✓ ' + esc(t('list.added')) : '+ ' + esc(t('list.add'))}</button>
        <a href="${esc(b.recordUrl)}" target="_blank" rel="noopener">${esc(t('lucky.open'))} ↗</a>
        <button id="luckyAgain">🎲 ${esc(t('lucky.again'))}</button>
      </div>
    </div>`;
  document.getElementById('luckyAdd').addEventListener('click', () => { toggleInList(b.id); renderLucky(it, band, branch); });
  document.getElementById('luckyAgain').addEventListener('click', rollLucky);
}

/* ---------------- ADD ALL AVAILABLE HERE ----------------
   Every book on the current view that is on the chosen library's shelf right
   now goes onto the list in one click. Books whose branch data hasn't
   arrived yet are checked first, so nothing is added on a guess. */
async function addAllAvailableHere(){
  const btn = document.getElementById('addAllBtn');
  const branch = HOME_BRANCH;
  const items = [...new Map((CURRENT_ITEMS.length ? CURRENT_ITEMS : HOME_ITEMS).filter(i => i && i.book).map(i => [i.book.id, i])).values()];
  if(!items.length) return;
  btn.classList.add('busy');
  const label = document.getElementById('addAllLabel'); const was = label.textContent;
  label.textContent = t('list.checking');
  const missing = items.filter(i => !Array.isArray(i.branches));
  for(let i = 0; i < missing.length; i += 4){
    await Promise.all(missing.slice(i, i + 4).map(async it => {
      try{ const r = await fetch(`/api/availability?id=${encodeURIComponent(it.book.id)}`, { signal: AbortSignal.timeout(20000) }); it.branches = r.ok ? (await r.json()).branches || [] : []; }
      catch(e){ it.branches = []; }
    }));
  }
  let added = 0;
  for(const it of items){
    const ok = branch && branch.code !== '_online_'
      ? (it.branches.find(r => r.code === branch.code)?.available || 0) > 0
      : it.branches.reduce((n, r) => n + r.available, 0) > 0 || it.book.availability.availableCopies > 0;
    if(ok && !LIST.some(x => x.id === it.book.id)){
      KNOWN_BOOKS.set(it.book.id, it.book);
      toggleInList(it.book.id); added++;
    }
  }
  btn.classList.remove('busy');
  label.textContent = t('list.addedN', { n: added });
  setTimeout(() => { label.textContent = was; }, 2200);
}
document.getElementById('addAllBtn').addEventListener('click', addAllAvailableHere);

/* The button is meaningful wherever there are books on screen. */
function refreshAddAll(){
  const has = grid.querySelector('.book:not(.skeleton):not(.event)');
  document.getElementById('addAllBtn').hidden = !has || !!(BROWSING && (BROWSING.list || BROWSING.events));
}
new MutationObserver(refreshAddAll).observe(document.getElementById('grid'), { childList: true, subtree: false });

/* ---------------- MY LIST ----------------
   A + on every card. The list itself is arranged by where the books are in
   the chosen library — every book in the Children's New Book Section
   together, every one in the Fiction Section together — so it reads as the
   route to walk, not the order they were added. Grouping is computed when
   the list opens, from live per-copy data, so it follows the library picker. */
const LIST_KEY = 'stacks.list';
let LIST = [];
try{ LIST = JSON.parse(localStorage.getItem(LIST_KEY) || '[]'); if(!Array.isArray(LIST)) LIST = []; }catch(e){ LIST = []; }

function saveList(){
  try{ localStorage.setItem(LIST_KEY, JSON.stringify(LIST)); }catch(e){}
  const n = LIST.length;
  const badge = document.getElementById('listCount');
  badge.textContent = String(n); badge.hidden = n === 0;
}

/* Every card on screen for a book carries the same +; a change flips all. */
function paintAddButtons(id){
  const inList = LIST.some(x => x.id === id);
  document.querySelectorAll(`.add-btn[data-add="${CSS.escape(id)}"]`).forEach(b => {
    b.classList.toggle('in', inList);
    b.textContent = inList ? '✓' : '+';
    b.setAttribute('aria-pressed', String(inList));
    b.title = inList ? t('list.added') : t('list.add');
    b.setAttribute('aria-label', b.title);
  });
}

/* Every book that has ever been drawn as a card, by id — so the + works on a
   search result or a pick just as it does on a shelf. */
const KNOWN_BOOKS = new Map();
function bookFromCard(id){ return KNOWN_BOOKS.get(id) || null; }

function toggleInList(id, card){
  const idx = LIST.findIndex(x => x.id === id);
  if(idx >= 0) LIST.splice(idx, 1);
  else {
    const b = bookFromCard(id);
    if(!b) return;
    LIST.push({ id: b.id, title: b.nativeTitle || b.title, author: (b.authors && b.authors[0]) || '', jacket: b.jacket || null,
                recordUrl: b.recordUrl, formatFamily: b.formatFamily, addedAt: Date.now() });
  }
  saveList();
  paintAddButtons(id);
  if(BROWSING && BROWSING.list) openList();   // the list view redraws itself
}

/* Which section of `branch` a book sits in, from its per-copy records:
   the shelf with copies in wins; otherwise the shelf with most copies. */
function sectionAt(branches, branch){
  const rows = Array.isArray(branches) ? branches : [];
  if(branch && branch.code !== '_online_'){
    const row = rows.find(r => r.code === branch.code);
    if(!row) return null;
    const sh = (row.shelves || [])[0];
    return sh ? { name: sh.collection || t('list.unknown'), call: sh.callNumber || '' } : { name: t('list.unknown'), call: '' };
  }
  // No branch chosen: the most common shelving system-wide.
  const tally = new Map();
  for(const r of rows) for(const sh of r.shelves || []){
    const k = sh.collection || t('list.unknown');
    tally.set(k, (tally.get(k) || 0) + sh.total);
  }
  const top = [...tally.entries()].sort((a, b) => b[1] - a[1])[0];
  return top ? { name: top[0], call: '' } : null;
}

async function openList(){
  HOME_GEN++;
  const gen = HOME_GEN;
  resetReveal();
  BROWSING = { results: true, list: true };
  BROWSE_POOL = [];
  document.getElementById('shuffleBtn').hidden = true;
  markCategory(null);
  const branch = HOME_BRANCH;
  document.getElementById('shelfTitle').textContent = t('list.title');
  grid.innerHTML = '';

  if(!LIST.length){
    resultCount.textContent = t('list.emptySub');
    grid.innerHTML = `<div class="shelf-empty">${esc(t('list.empty'))}</div>`;
    return;
  }
  resultCount.textContent = t('list.loading');

  // Live per-copy data for every book, four at a time (the proxy caches).
  const items = LIST.map(x => ({ book: { id: x.id, title: x.title, authors: [x.author], jacket: x.jacket, recordUrl: x.recordUrl, formatFamily: x.formatFamily,
                                          availability: { availableCopies: 0, totalCopies: 0, heldCopies: 0, isDigital: x.formatFamily === 'ebook' || x.formatFamily === 'audiobook' } },
                                 branches: null, band: '' }));
  for(let i = 0; i < items.length; i += 4){
    await Promise.all(items.slice(i, i + 4).map(async it => {
      try{
        const r = await fetch(`/api/availability?id=${encodeURIComponent(it.book.id)}`, { signal: AbortSignal.timeout(20000) });
        if(r.ok){
          const d = await r.json();
          it.branches = d.branches || [];
          // The system-wide counts, so the availability line has something to say.
          let avail = 0, total = 0;
          for(const b of it.branches){ avail += b.available; total += b.available + b.out; }
          it.book.availability = { ...it.book.availability, availableCopies: avail, totalCopies: total };
        } else it.branches = [];
      }catch(e){ it.branches = []; }
    }));
    if(gen !== HOME_GEN) return;
  }

  // Group by section at the chosen library.
  const groups = new Map();
  const key = (it) => {
    if(it.book.availability.isDigital) return { k: '\u0001online', name: t('list.online'), call: '' };
    const sec = sectionAt(it.branches, branch);
    if(!sec) return { k: '\u0002elsewhere', name: branch ? t('list.notAt', { branch: branch.label }) : t('list.unknown'), call: '' };
    return { k: sec.name, name: sec.name, call: sec.call };
  };
  for(const it of items){
    const g = key(it);
    if(!groups.has(g.k)) groups.set(g.k, { name: g.name, items: [] });
    groups.get(g.k).items.push(it);
  }
  // Real sections first, alphabetically (the order you'd walk them); online
  // and not-here last.
  const ordered = [...groups.entries()].sort((a, b) => {
    const sa = a[0].charCodeAt(0) < 32, sb = b[0].charCodeAt(0) < 32;
    if(sa !== sb) return sa - sb;
    return a[1].name.localeCompare(b[1].name, locale());
  });

  resultCount.textContent = t('list.count', { n: LIST.length, sections: ordered.filter(([k]) => k.charCodeAt(0) >= 32).length }) + (branch ? ' · ' + t('list.at', { branch: branch.label }) : '');

  // What "unavailable" means for each book, from the same per-copy data.
  const availHere = (it) => it.book.availability.isDigital ? true : (branch && branch.code !== '_online_' ? (it.branches.find(r => r.code === branch.code)?.available || 0) > 0 : it.branches.reduce((n, r) => n + r.available, 0) > 0);
  const availAny  = (it) => it.book.availability.isDigital ? true : it.branches.reduce((n, r) => n + r.available, 0) > 0;
  const outHere = items.filter(it => !availHere(it)).length, outAny = items.filter(it => !availAny(it)).length;

  grid.innerHTML = `<div class="grid-section"><h3>${esc(t('list.route'))}</h3>
    <div class="list-actions">
      ${branch && outHere ? `<button id="listDropHere">${esc(t('list.removeUnavailHere', { n: outHere, branch: branch.label }))}</button>` : ''}
      ${outAny ? `<button id="listDropAll">${esc(t('list.removeUnavailAll', { n: outAny }))}</button>` : ''}
      <button id="listClear">${esc(t('list.clear'))}</button><button class="back-home">${esc(t('res.back'))}</button></div></div>`;
  const drop = (pred) => { for(const it of items) if(pred(it)) { const i = LIST.findIndex(x => x.id === it.book.id); if(i >= 0) LIST.splice(i, 1); paintAddButtons(it.book.id); } saveList(); openList(); };
  grid.querySelector('#listDropHere')?.addEventListener('click', () => drop(it => !availHere(it)));

      `<div class="grid-section"><h3>${real ? `<span class="sec-no">${++n}</span>` : ''}${esc(g.name)}<span class="sec-sub">${esc(t('list.inSection', { n: g.items.length }))}</span></h3></div>` +

  document.querySelector('.main').scrollTop = 0;
}

/* ---------------- LIVE CATALOG (via local proxy) ----------------
   BiblioCommons blocks cross-origin reads, so real availability is only
   reachable when this page is served by server.js. We probe once on load;
   if the proxy isn't there the page still works, it just deep-links into
   the catalog instead of answering availability inline. */
let CATALOG_LIVE = false;

/* The books from the most recent answer. "Where is it?" is a follow-up about
   something already on screen, so it is answered from the records we already
   fetched rather than by asking the model to guess. */
let LAST_ANSWER = { asked: [], recs: [], branch: null };
let LAST_QUERY = '';   // what was last typed, so a library change can re-run it

/* The library the patron cares about. Most questions don't name one ("is this
   available?"), but an unscoped answer is what made the counts look wrong, so
   a chosen home branch fills that gap. A branch named in the query still wins. */
const REC_COUNT = 4;      // suggestions offered when the patron didn't name books
const MAX_LIST = 25;      // ceiling on a pasted reading list, to stay polite to the catalog
const LOOKUP_BATCH = 7;   // catalog lookups in flight at once (light lookups are one request each)

const HOME_KEY = 'stacks.homeBranch';
let HOME_BRANCH = null;

function initBranchPicker(){
  const sel = document.getElementById('homeBranch');
  if(!sel) return;
  sel.innerHTML = `<option value="">${t('top.allBranches')}</option>` +
    SCCLD_BRANCHES.map(b => `<option value="${b.code}">${b.label}</option>`).join('');

  const saved = localStorage.getItem(HOME_KEY) || '';
  sel.value = saved;
  HOME_BRANCH = SCCLD_BRANCHES.find(b => b.code === saved) || null;

  sel.addEventListener('change', () => {
    localStorage.setItem(HOME_KEY, sel.value);
    HOME_BRANCH = SCCLD_BRANCHES.find(b => b.code === sel.value) || null;
    if(BROWSING && BROWSING.events){ openEvents(BROWSING.audience || '', null, null); }
    else if(BROWSING && BROWSING.list){ openList(); }
    else if(BROWSING && BROWSING.results && LAST_QUERY){
      // A search is about a library as much as a title: switching libraries
      // re-runs it, so every count on screen is for the library now chosen.
      promptInput.value = LAST_QUERY;
      handleAsk();
    }
    else if(BROWSING){ if(CURRENT_ITEMS.length) renderGrid(CURRENT_ITEMS); } else rerenderHome(); // counts are branch-scoped, so redraw
  });
}

/* A branch named in the question beats the saved home branch — asking about
   Gilroy while your home library is Cupertino should answer about Gilroy. */
function effectiveBranch(query){
  return detectBranch(query) || HOME_BRANCH;
}

async function lookupBook(title, author, opts){

  const o = opts || {};
