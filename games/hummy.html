<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hummy AI — Library Search</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* SCCLD's own palette: #006075 is their primary (buttons, header, links),
       #003642 the deep header tone, #0092b2 the light accent. */
    --ink:#1a2a2f;
    --paper:#f4f7f8;
    --paper-dim:#e8eef0;
    --moss:#006075;
    --moss-deep:#003642;
    --brass:#006075;
    --brass-light:#7cc4d6;
    --card:#ffffff;
    --line:#d5dfe3;
    --available:#2e7d32;
    --waitlist:#b3541e;
    --teal:#006075;
    --teal-dark:#004b5c;
    --tint:#e3f1f7;
  }

  *{box-sizing:border-box;}
  /* The page itself never scrolls. Each column is its own scroll region, so
     the assistant and the shelf move independently and neither can push the
     other off screen — the panel used to stretch to the catalog's full height,
     which meant the chat thread grew instead of scrolling. */
  html,body{height:100%;overflow:hidden;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}

  .shell{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  .app{flex:1;min-height:0;display:flex;}
  .app .main{flex:1;min-width:0;}

  /* ---- TOP BAR ---- */
  .topbar{
    display:flex;align-items:center;gap:16px;flex-shrink:0;
    padding:0 20px;height:58px;background:var(--moss-deep);color:#fff;
    border-bottom:3px solid var(--moss);
  }
  .brand-sccld{height:30px;width:auto;background:#fff;padding:3px 6px;border-radius:4px;flex-shrink:0;}

  /* ---- PillNav (React Bits) — the component's stylesheet, with the
     container made inline instead of absolutely positioned, and a submenu
     added under each pill for the shelves. ---- */
  .pill-nav-container{position:relative;z-index:99;flex-shrink:0;}
  .pill-nav{
    --nav-h:42px;--logo:36px;--pill-pad-x:16px;--pill-gap:3px;
    width:max-content;display:flex;align-items:center;box-sizing:border-box;gap:10px;
  }
  .pill-nav-items{position:relative;display:flex;align-items:center;height:var(--nav-h);background:var(--base,#000);border-radius:9999px;}
  .pill-logo{
    width:var(--nav-h);height:var(--nav-h);border-radius:50%;background:var(--base,#000);padding:6px;
    display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
  }
  .pill-logo img{width:100%;height:100%;object-fit:contain;display:block;}
  .pill-wordmark{font-family:'Fraunces',serif;font-size:20px;font-weight:500;color:#fff;white-space:nowrap;margin-right:4px;}
  .pill-list{list-style:none;display:flex;align-items:stretch;gap:var(--pill-gap);margin:0;padding:3px;height:100%;}
  .pill-list > li{display:flex;height:100%;position:relative;}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;height:100%;padding:0 var(--pill-pad-x);
    background:var(--pill-bg,#fff);color:var(--pill-text,var(--base,#000));text-decoration:none;border-radius:9999px;
    box-sizing:border-box;font-weight:600;font-size:13px;line-height:0;text-transform:uppercase;letter-spacing:.2px;
    white-space:nowrap;cursor:pointer;position:relative;overflow:hidden;font-family:'Inter',sans-serif;
  }
  .pill .hover-circle{position:absolute;left:50%;bottom:0;border-radius:50%;background:var(--base,#000);z-index:1;display:block;pointer-events:none;will-change:transform;}
  .pill .label-stack{position:relative;display:inline-block;line-height:1;z-index:2;}
  .pill .pill-label{position:relative;z-index:2;display:inline-block;line-height:1;will-change:transform;}
  .pill .pill-label-hover{position:absolute;left:0;top:0;color:var(--hover-text,#fff);z-index:3;display:inline-block;will-change:transform,opacity;}
  .pill.is-active::after{
    content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    width:12px;height:12px;background:var(--base,#000);border-radius:50px;z-index:4;
  }
  /* Our addition: a pill can carry a shelf menu, shown while the pointer is
     over the pill or the menu, or while either has keyboard focus. */
  .menu{
    position:absolute;min-width:190px;z-index:60;display:none;
    background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,54,66,0.18);padding:6px 0;
  }
  .menu button{
    display:block;width:100%;text-align:left;background:transparent;border:none;
    font-family:inherit;font-size:13.5px;color:var(--ink);padding:9px 16px;cursor:pointer;
  }
  .menu button:hover,.menu button.is-on{background:var(--tint);color:var(--moss);}
  .pill-list > li > .menu{top:calc(100% + 6px);left:50%;transform:translateX(-50%);border-radius:14px;border-top:3px solid var(--base);}
  .pill-list > li:hover > .menu,.pill-list > li:focus-within > .menu,.pill-list > li.open > .menu{display:block;}
  .pill-list > li > .menu::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;} /* bridge the gap */

  .desktop-only{display:block;}
  .mobile-only{display:none;}
  .mobile-menu-button{
    width:var(--nav-h);height:var(--nav-h);border-radius:50%;background:var(--base,#000);border:none;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0;position:relative;
  }
  .hamburger-line{width:16px;height:2px;background:var(--pill-bg,#fff);border-radius:1px;transition:all .01s ease;transform-origin:center;}
  .mobile-menu-popover{
    position:absolute;top:calc(100% + 8px);left:0;right:auto;min-width:240px;background:var(--base,#f0f0f0);border-radius:27px;
    box-shadow:0 8px 32px rgba(0,0,0,0.12);z-index:998;opacity:0;transform-origin:top center;visibility:hidden;
  }
  .mobile-menu-list{list-style:none;margin:0;padding:3px;display:flex;flex-direction:column;gap:3px;}
  .mobile-menu-popover .mobile-menu-link{
    display:block;padding:12px 16px;color:var(--pill-text,#fff);background-color:var(--pill-bg,#fff);text-decoration:none;
    font-size:15px;font-weight:500;border-radius:50px;transition:all .2s ease;font-family:'Inter',sans-serif;
  }
  .mobile-menu-popover .mobile-menu-link:hover{cursor:pointer;background-color:var(--base);color:var(--hover-text,#fff);}
  .mobile-menu-popover .mobile-menu-sub{padding:8px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#a9cbd4;}
  @media (max-width:820px){
    .desktop-only{display:none;}
    .mobile-only{display:block;}
    .mobile-menu-button{display:flex;}
    .pill-nav{width:100%;justify-content:space-between;}
  }

  /* the bar's search button — compact, never squeezed */
  .search-trigger{
    display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;flex-shrink:0;
    background:var(--moss);color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:9999px;
    font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:background .15s ease,border-color .15s ease;
  }
  .search-trigger:hover{background:var(--teal-dark);border-color:var(--brass-light);}
  .search-trigger svg{width:18px;height:18px;flex-shrink:0;}
  .search-trigger kbd{
    font-family:inherit;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;
    background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.25);color:#d6e6ea;
  }
  /* Laptop widths: the bar carries a lot. Captions go first (the pills read
     as a library and a language on their own), then pill padding, then the
     wordmark — the hummingbird is the brand by itself. */
  @media (max-width:1500px){
    .topbar .pick-label{display:none;}
    .pill{--pill-pad-x:12px;font-size:12.5px;}
    .topbar{gap:12px;}
  }
  @media (max-width:1300px){ .pill-wordmark{display:none;} }
  @media (max-width:1100px){ .search-trigger span,.search-trigger kbd{display:none;} .search-trigger{padding:0 11px;} }

  /* the panel */
  .search-scrim{position:fixed;inset:0;background:rgba(0,54,66,0.35);backdrop-filter:blur(2px);z-index:900;}
  .search-scrim[hidden]{display:none;}
  .search-panel{
    position:fixed;top:72px;left:50%;transform:translateX(-50%);width:min(760px,94vw);z-index:901;
    background:var(--card);border:1px solid var(--line);border-top:4px solid var(--moss);border-radius:14px;
    box-shadow:0 24px 60px rgba(0,54,66,0.28);padding:18px 20px 20px;
    animation:panel-in .22s cubic-bezier(.2,.7,.2,1);
  }
  .search-panel[hidden]{display:none;}
  @keyframes panel-in{from{opacity:0;transform:translate(-50%,-8px);}to{opacity:1;transform:translate(-50%,0);}}
  @media (prefers-reduced-motion:reduce){ .search-panel{animation:none;} }
  .search-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .search-panel-head h2{font-size:20px;margin:0;font-weight:500;}
  .search-close{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:#5b6b71;
    font-size:20px;line-height:1;cursor:pointer;font-family:inherit;
  }
  .search-close:hover{border-color:var(--moss);color:var(--moss);}
  .search-panel .sbar{height:54px;}
  .search-panel .sbar input{font-size:16px;}
  .search-try{margin-top:16px;}
  .search-try-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a8672;margin-bottom:8px;}
  .search-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .search-chip{
    background:var(--tint);border:1px solid #bfdde6;color:var(--moss);font-family:inherit;
    font-size:13px;font-weight:600;padding:8px 13px;border-radius:100px;cursor:pointer;
    transition:background .15s ease,transform .15s ease;
  }
  .search-chip:hover{background:#d3eaf2;transform:translateY(-1px);}
  .search-chip .kind{font-weight:400;color:#5b6b71;margin-left:6px;font-size:11.5px;}
  @media (max-width:820px){ .search-panel{top:8px;width:calc(100vw - 16px);} }

  /* Both pickers share one row: same height, captions on one baseline, the
     two pills the same size so they read as a pair. */
  .pickers{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .topbar .branch-pick{flex-shrink:0;display:flex;align-items:center;gap:8px;height:40px;cursor:pointer;}
  .topbar .pill-select{height:34px;min-width:150px;padding-top:0;padding-bottom:0;line-height:32px;}
  .topbar .pick-label{color:#a9cbd4;}
  .topbar .pill-select{
    background-color:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.35);color:#fff;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237cc4d6' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  }
  .topbar .pill-select:hover{background-color:rgba(255,255,255,0.14);}
  .topbar .pill-select option{background:#003642;color:#fff;}

  .main{position:relative;}

  /* ---- SEARCH BAR (shared by the assistant and the catalog) ----
     A plain white field with a hairline border and a solid teal square on
     the right carrying the magnifier — the reference exactly. */
  .sbar{display:flex;width:100%;height:50px;flex-shrink:0;}
  .sbar input{
    flex:1;min-width:0;height:100%;background:#fff;border:1px solid #cfcfcf;border-right:none;
    border-radius:3px 0 0 3px;padding:0 16px;font-size:15px;font-family:inherit;color:#222;outline:none;
  }
  .sbar input::placeholder{color:#9a9a9a;}
  .sbar input:focus{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);}
  .sbar-btn{
    width:64px;height:100%;flex-shrink:0;border:none;border-radius:0 3px 3px 0;
    background:var(--teal);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .sbar-btn:hover{background:var(--teal-dark);}
  .sbar-btn:disabled{opacity:.6;cursor:default;}
  .sbar-btn svg{width:22px;height:22px;}

  /* ---- RIGHT: SEARCH ---- */
  /* No max-width: the shelf uses the whole window and re-flows as it resizes. */
  .main{padding:36px 48px 60px;height:100%;overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;}
  .main-top{display:flex;flex-direction:column;align-items:stretch;margin-bottom:26px;gap:16px;}
  .title-row{display:flex;align-items:flex-end;gap:14px;}
  .shuffle{
    display:inline-flex;align-items:center;gap:6px;margin-bottom:4px;
    background:var(--card);border:1px solid var(--line);color:var(--ink);font-family:inherit;
    font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:100px;cursor:pointer;
    transition:border-color .15s ease,transform .15s ease;
  }
  .shuffle svg{width:14px;height:14px;color:var(--brass);}
  .shuffle:hover{border-color:var(--brass);transform:rotate(-3deg);}
  .shuffle:active{transform:rotate(-8deg) scale(.97);}
  .shuffle[hidden]{display:none;}
  .main-top h2{font-size:28px;margin:0 0 6px;font-weight:500;}
  .main-top p{margin:0;color:#5b5a4c;font-size:14px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
  .book{
    background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;transition:box-shadow .15s ease, transform .15s ease;
  }
  .book.in:hover{box-shadow:0 8px 20px rgba(0,54,66,0.12);transform:translateY(-2px);}
  .cover{
    height:230px;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-size:15px;text-align:center;padding:14px;color:#fff;line-height:1.3;
    position:relative;
  }
  .cover .spine{position:absolute;left:0;top:0;bottom:0;width:8px;background:rgba(0,0,0,0.18);}
  .book-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .book-body h3{font-size:15.5px;margin:0;font-weight:600;line-height:1.3;}
  .book-body .author{font-size:12.5px;color:#736f5c;margin:0;}
  .book-body .author.roman{color:#9aa0a6;font-size:11.5px;margin-top:-4px;}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .badge{font-size:10.5px;padding:3px 8px;border-radius:100px;font-weight:600;letter-spacing:.02em;}
  .badge.available{background:#e2ecdf;color:var(--available);}
  .badge.waitlist{background:#f3e3d3;color:var(--waitlist);}
  .badge.ebook{background:#dce7ee;color:#2b5d78;display:flex;align-items:center;gap:4px;}
  .band{
    font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8a8672;font-weight:600;
  }
  .cover{position:relative;overflow:hidden;}
  /* A book cover is taller than the card is wide, so cropping it to fill
     the box lost the title on most of them. The whole jacket is shown
     instead, with a blurred copy of itself filling the space around it. */
  .cover-bg{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:blur(14px) saturate(1.2);opacity:.55;}
  .cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box;z-index:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.25));}
  .cover-text{position:relative;z-index:1;}
  .cover:has(.cover-img) .cover-text{display:none;}
  .shelf-avail{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-top:2px;}
  .shelf-avail .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .shelf-avail.ok{color:var(--available);} .shelf-avail.ok .dot{background:var(--available);}
  .shelf-avail.out{color:var(--waitlist);} .shelf-avail.out .dot{background:var(--waitlist);}
  .shelf-avail.elsewhere{color:#8a6d3b;} .shelf-avail.elsewhere .dot{background:#8a6d3b;}
  .shelf-avail.missing{color:#8a8672;} .shelf-avail.missing .dot{background:#8a8672;}
  .book .shelf{color:#6b6754;border:none;padding:0;margin-top:4px;}
  .book .shelf-pin{color:var(--brass);}
  .book.skeleton{pointer-events:none;}
  .book.skeleton .cover{background:linear-gradient(90deg,var(--paper-dim) 25%,#eef3f5 50%,var(--paper-dim) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;}
  .book.skeleton .sk{height:12px;border-radius:6px;background:var(--paper-dim);margin:6px 0;}
  .book.skeleton .sk.w60{width:60%;} .book.skeleton .sk.w40{width:40%;} .book.skeleton .sk.w80{width:80%;}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
  .book.notfound .cover{background:var(--paper-dim);}
  .book.notfound .cover-text{color:#6b7c82;}
  .book.event .cover{height:auto;min-height:120px;padding:16px 15px 12px;align-items:flex-start;justify-content:flex-start;text-align:left;}
  .book.event.has-art .cover{height:190px;padding:0;}
  .book.event.has-art .ev-head{display:none;}   /* with a picture, the date and title move below it */
  .book.event .ev-head{position:relative;z-index:1;}
  .book.event .ev-when{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:#fff;opacity:.9;margin-bottom:6px;font-family:'Inter',sans-serif;}
  .book.event .ev-when.dark{color:var(--moss);opacity:1;margin-bottom:2px;}
  .book.event .ev-title{font-size:16px;line-height:1.3;color:#fff;font-weight:500;}
  .book.event h3{font-size:15.5px;margin:0;}
  .ev-where{font-size:12.5px;color:#4d5f66;}
  .ev-desc{font-size:12px;color:#6b7c82;line-height:1.45;}
  .ev-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:6px;}
  .ev-tag{font-size:10.5px;padding:2px 8px;border-radius:100px;background:var(--tint);color:var(--moss);border:1px solid #bfdde6;}
  .ev-tag.full{background:#f6e3d6;color:var(--waitlist);border-color:#e6c4ae;}
  .back-home{
    background:transparent;border:1px solid var(--line);color:var(--ink);font-family:inherit;
    font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:100px;cursor:pointer;margin-bottom:4px;
  }
  .back-home:hover{border-color:var(--moss);color:var(--moss);}
  .back-home[hidden]{display:none;}

  /* ---- scroll reveal ----
     Cards and section headers start faded and slightly low, and settle into
     place as they enter the viewport. Each one that arrives in the same
     frame is delayed a touch more than the last, so a row ripples in rather
     than popping. A card that has already been revealed keeps its place when
     hydration redraws it (see REVEALED). */
  .book,.grid-section{opacity:0;transform:translateY(14px);}
  .book.in,.grid-section.in{
    opacity:1;transform:none;
    transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1);
    transition-delay:var(--reveal-delay,0ms);
  }
  .book.skeleton{opacity:1;transform:none;}   /* placeholders are already "there" */
  .book.in:hover{transition-delay:0ms;}        /* the lift on hover must not lag */
  @media (prefers-reduced-motion:reduce){
    .book,.grid-section{opacity:1;transform:none;transition:none;}
  }

  /* A soft fade where content slides under the header, so cards dissolve
     out at the top instead of being cut off by a hard edge. */
  .main{
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34px,#000 100%);
    mask-image:linear-gradient(to bottom,transparent 0,#000 34px,#000 100%);
  }
  @media (max-width:820px){ .main{-webkit-mask-image:none;mask-image:none;} }

  /* ---- partner band ---- */
  .partners{
    margin:40px -48px -60px;padding:22px 48px 26px;border-top:1px solid var(--line);
    background:var(--card);display:flex;align-items:center;gap:22px;
  }
  .partners-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8a8672;white-space:nowrap;flex-shrink:0;}
  .partners-loop{flex:1;min-width:0;}

  /* ---- LogoLoop (React Bits) — the component's stylesheet ---- */
  .logoloop{position:relative;--logoloop-gap:32px;--logoloop-logoHeight:28px;--logoloop-fadeColorAuto:#ffffff;overflow:hidden;}
  .logoloop--vertical{height:100%;display:inline-block;}
  .logoloop--scale-hover{padding-top:calc(var(--logoloop-logoHeight) * .1);padding-bottom:calc(var(--logoloop-logoHeight) * .1);}
  .logoloop__track{display:flex;width:max-content;will-change:transform;user-select:none;position:relative;z-index:0;}
  .logoloop--vertical .logoloop__track{flex-direction:column;height:max-content;width:100%;}
  .logoloop__list{display:flex;align-items:center;list-style:none;margin:0;padding:0;}
  .logoloop--vertical .logoloop__list{flex-direction:column;}
  .logoloop__item{flex:0 0 auto;margin-right:var(--logoloop-gap);font-size:var(--logoloop-logoHeight);line-height:1;}
  .logoloop--vertical .logoloop__item{margin-right:0;margin-bottom:var(--logoloop-gap);}
  .logoloop__node{display:inline-flex;align-items:center;}
  .logoloop__item img{
    height:var(--logoloop-logoHeight);width:auto;display:block;object-fit:contain;
    -webkit-user-drag:none;pointer-events:none;transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .logoloop--scale-hover .logoloop__item{overflow:visible;}
  .logoloop--scale-hover .logoloop__item:hover img,.logoloop--scale-hover .logoloop__item:hover .logoloop__node{transform:scale(1.2);transform-origin:center center;}
  .logoloop__link{display:inline-flex;align-items:center;text-decoration:none;border-radius:4px;transition:opacity .2s ease;}
  .logoloop__link:hover{opacity:.8;}
  .logoloop__link:focus-visible{outline:2px solid currentColor;outline-offset:2px;}
  .logoloop--fade::before,.logoloop--fade::after{content:'';position:absolute;top:0;bottom:0;width:clamp(24px,8%,120px);pointer-events:none;z-index:10;}
  .logoloop--fade::before{left:0;background:linear-gradient(to right,var(--logoloop-fadeColor,var(--logoloop-fadeColorAuto)) 0%,rgba(0,0,0,0) 100%);}
  .logoloop--fade::after{right:0;background:linear-gradient(to left,var(--logoloop-fadeColor,var(--logoloop-fadeColorAuto)) 0%,rgba(0,0,0,0) 100%);}
  .logoloop--vertical.logoloop--fade::before,.logoloop--vertical.logoloop--fade::after{left:0;right:0;width:100%;height:clamp(24px,8%,120px);}
  .logoloop--vertical.logoloop--fade::before{top:0;bottom:auto;background:linear-gradient(to bottom,var(--logoloop-fadeColor,var(--logoloop-fadeColorAuto)) 0%,rgba(0,0,0,0) 100%);}
  .logoloop--vertical.logoloop--fade::after{bottom:0;top:auto;background:linear-gradient(to top,var(--logoloop-fadeColor,var(--logoloop-fadeColorAuto)) 0%,rgba(0,0,0,0) 100%);}
  /* The item's own name sits under each logo, so a mark reads as a partner
     rather than a stray picture. */
  .logoloop__item .logo-name{display:block;text-align:center;font-size:10.5px;color:#8a8672;margin-top:6px;letter-spacing:.02em;}
  @media (prefers-reduced-motion:reduce){
    .logoloop__track{transform:translate3d(0,0,0) !important;}
    .logoloop__item img,.logoloop__node{transition:none !important;}
  }
  @media (max-width:820px){ .partners{margin:32px -16px 0;padding:18px 16px;} }

  /* ---- events: list / calendar switch and the month grid ---- */
  .ev-modes{grid-column:1/-1;display:inline-flex;gap:4px;background:var(--paper-dim);padding:4px;border-radius:100px;width:max-content;margin-bottom:6px;}
  .ev-mode{background:transparent;border:none;font-family:inherit;font-size:13px;font-weight:600;padding:7px 16px;border-radius:100px;cursor:pointer;color:#5b6b71;}
  .ev-mode.is-on{background:var(--card);color:var(--moss);box-shadow:0 1px 3px rgba(0,54,66,0.12);}
  .cal-wrap{grid-column:1/-1;}
  .cal-head{display:flex;align-items:center;gap:10px;margin:6px 0 12px;}
  .cal-title{font-size:22px;margin:0 6px;font-weight:500;min-width:220px;}
  .cal-nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1;cursor:pointer;color:var(--ink);}
  .cal-nav:hover,.cal-today:hover{border-color:var(--moss);color:var(--moss);}
  .cal-today{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:6px 14px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-loading{grid-column:1/-1;padding:30px;text-align:center;color:#8a8672;}
  .cal-dow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a8672;text-align:center;padding:4px 0 6px;}
  .cal-cell{
    min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;
    display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;overflow:hidden;
  }
  .cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.past{opacity:.6;}
  .cal-cell.has:hover{border-color:var(--moss);box-shadow:0 4px 12px rgba(0,54,66,0.1);}
  .cal-cell.sel{border-color:var(--moss);box-shadow:inset 0 0 0 1px var(--moss);}
  .cal-cell.today .cal-num{background:var(--moss);color:#fff;}
  .cal-num{font-size:12.5px;font-weight:700;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#5b6b71;}
  .cal-ev{font-size:11px;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--tint);border-radius:5px;padding:2px 6px;}
  .cal-time{color:var(--moss);font-weight:700;font-variant-numeric:tabular-nums;}
  .cal-more{font-size:11px;color:#8a8672;padding-left:2px;}
  .cal-day-list{margin-top:26px;}
  .cal-day-grid{margin-top:14px;}
  @media (max-width:820px){ .cal-cell{min-height:56px;padding:5px;} .cal-ev{display:none;} .cal-cell.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--moss);} .cal-title{min-width:0;font-size:18px;} }

  /* ---- I'm feeling lucky ---- */
  .lucky-trigger{
    display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;flex-shrink:0;
    background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.35);border-radius:9999px;
    font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .lucky-trigger:hover{background:rgba(255,255,255,0.1);border-color:var(--brass-light);}
  .lucky-trigger:active svg{transform:rotate(90deg);}
  .lucky-trigger svg{width:18px;height:18px;flex-shrink:0;transition:transform .3s ease;}
  @media (max-width:1300px){ .lucky-trigger span{display:none;} .lucky-trigger{padding:0 11px;} }

  .lucky-panel{width:min(640px,94vw);}
  .lucky-body{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start;min-height:280px;}
  .lucky-cover{
    position:relative;height:280px;border-radius:10px;overflow:hidden;background:var(--paper-dim);
    display:flex;align-items:center;justify-content:center;
  }
  .lucky-cover img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(1.2);opacity:.55;transform:scale(1.15);}
  .lucky-cover img.fg{position:relative;max-height:100%;max-width:100%;object-fit:contain;box-shadow:0 8px 24px rgba(0,54,66,0.25);}
  .lucky-info h3{font-size:22px;margin:0 0 4px;font-weight:500;line-height:1.25;}
  .lucky-info .author{margin:0 0 12px;color:#5b6b71;}
  .lucky-info .band{display:inline-block;margin-bottom:10px;}
  .lucky-info .shelf-avail{margin:8px 0 4px;}
  .lucky-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .lucky-actions button,.lucky-actions a{
    display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:600;
    padding:9px 15px;border-radius:100px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  }
  .lucky-actions .primary{background:var(--moss);color:#fff;border-color:var(--moss);}
  .lucky-actions .primary:hover{background:var(--teal-dark);}
  .lucky-actions button:hover,.lucky-actions a:hover{border-color:var(--moss);}
  .lucky-loading{grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:240px;color:#8a8672;font-size:15px;}
  .lucky-loading .die{font-size:44px;animation:roll 1s linear infinite;margin-right:14px;}
  @keyframes roll{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .lucky-loading .die{animation:none;} }
  @media (max-width:640px){ .lucky-body{grid-template-columns:1fr;} .lucky-cover{height:220px;} }

  .shuffle.addall{margin-right:8px;}
  .shuffle.addall span:first-child{font-size:16px;line-height:1;color:var(--moss);}
  .shuffle.addall.busy{opacity:.6;pointer-events:none;}

  /* ---- My list ---- */
  .list-trigger{
    display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;flex-shrink:0;
    background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.35);border-radius:9999px;
    font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;position:relative;
    transition:background .15s ease,border-color .15s ease;
  }
  .list-trigger:hover{background:rgba(255,255,255,0.1);border-color:var(--brass-light);}
  .list-trigger svg{width:18px;height:18px;flex-shrink:0;}
  .list-count{
    min-width:20px;height:20px;padding:0 6px;border-radius:100px;background:var(--brass-light);color:var(--moss-deep);
    font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
  }
  .list-count[hidden]{display:none;}
  @media (max-width:1100px){ .list-trigger span#listOpenLabel{display:none;} .list-trigger{padding:0 11px;} }

  .add-btn{
    position:absolute;top:8px;right:8px;z-index:3;width:30px;height:30px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.7);background:rgba(0,54,66,0.72);color:#fff;
    font-size:20px;line-height:1;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(3px);transition:background .15s ease,transform .15s ease;opacity:0;
  }
  .book:hover .add-btn,.add-btn.in,.add-btn:focus-visible{opacity:1;}
  .add-btn:hover{background:var(--moss);transform:scale(1.08);}
  .add-btn.in{background:var(--available);border-color:#fff;font-size:15px;}
  @media (hover:none){ .add-btn{opacity:1;} }

  .book .remove-btn{
    margin-top:auto;align-self:flex-start;background:transparent;border:1px solid var(--line);color:#5b6b71;
    font-family:inherit;font-size:12px;padding:5px 10px;border-radius:100px;cursor:pointer;
  }
  .book .remove-btn:hover{border-color:var(--waitlist);color:var(--waitlist);}
  .list-route{font-size:13px;color:#5b6b71;margin:-14px 0 18px;}
  .list-actions{display:flex;gap:10px;align-items:center;}
  .list-actions button{
    background:transparent;border:1px solid var(--line);color:var(--ink);font-family:inherit;
    font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:100px;cursor:pointer;
  }
  .list-actions button:hover{border-color:var(--moss);color:var(--moss);}
  .sec-no{
    display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
    background:var(--moss);color:#fff;font-size:12px;font-weight:700;margin-right:10px;vertical-align:middle;font-family:'Inter',sans-serif;
  }

  .grid-section{
    grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin-top:18px;padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .grid-section:first-child{margin-top:0;}
  .grid-section h3{font-size:19px;margin:0;font-weight:500;}
  .grid-section .sec-sub{font-size:12px;color:#8a8672;margin-left:8px;font-weight:400;font-family:'Inter',sans-serif;}
  .grid-section button{
    background:transparent;border:1px solid var(--line);color:var(--ink);font-family:inherit;
    font-size:12px;padding:5px 11px;border-radius:100px;cursor:pointer;white-space:nowrap;
  }
  .grid-section button:hover{border-color:var(--brass);}
  .grid-section .sec-loading{font-size:12px;color:#8a8672;}

  .shelf-empty{
    grid-column:1/-1;padding:28px;text-align:center;color:#6b6754;font-size:14px;
    border:1px dashed var(--line);border-radius:12px;background:var(--card);
  }
  .shelf-empty code{background:#e7dfc9;padding:2px 6px;border-radius:4px;}

  .branches{font-size:12px;color:#5b5a4c;margin-top:auto;padding-top:6px;border-top:1px solid var(--line);}
  .branches b{color:var(--ink);}
  .ebook-link{
    margin-top:2px;font-size:12.5px;color:#2b5d78;font-weight:600;text-decoration:none;
    display:inline-flex;align-items:center;gap:4px;
  }
  .ebook-link:hover{text-decoration:underline;}

  .branch-pick{
    display:flex;align-items:center;gap:9px;margin-top:12px;position:relative;
  }
  .ask-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%;}
  .ask-row .sbar{flex:1 1 360px;width:auto;}
  .branch-pick{display:flex;align-items:center;gap:9px;flex-shrink:0;}
  .pick-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a8672;flex-shrink:0;}
  .pill-select{
    appearance:none;-webkit-appearance:none;
    background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a9803f' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 10px center/14px;
    border:1px solid var(--brass);color:var(--ink);border-radius:100px;
    padding:7px 32px 7px 14px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;font-weight:600;
  }
  .pill-select:hover{background-color:#f3ecd8;}
  .pill-select:focus{box-shadow:0 0 0 2px rgba(169,128,63,0.3);}

  /* ---- availability cards in the AI panel ---- */
  .section-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--brass-light);
    margin:14px 0 7px;opacity:.9;
  }
  .bookcard{
    display:flex;align-items:flex-start;gap:10px;
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
    border-radius:9px;padding:11px 12px;margin-bottom:8px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .bookcard:hover{background:rgba(207,169,104,0.13);border-color:rgba(207,169,104,0.4);transform:translateX(2px);}
  .bookcard.primary{
    background:rgba(207,169,104,0.11);border-color:rgba(207,169,104,0.45);
  }
  .bc-main{flex:1;min-width:0;}
  .bc-title{font-size:14px;font-weight:600;color:#fff;line-height:1.3;}
  .bookcard.primary .bc-title{font-size:15.5px;font-family:'Fraunces',serif;font-weight:500;}
  .bsub{font-size:11.5px;color:#a8b2a2;line-height:1.3;margin-top:1px;}
  .bc-author{font-size:12px;color:#b9c2b2;margin-top:2px;}
  .bwhy{font-size:11.5px;color:#9dab97;font-style:italic;margin-top:4px;line-height:1.4;}
  .bc-go{color:var(--brass-light);font-size:14px;flex-shrink:0;opacity:.75;}

  .avail{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-top:7px;font-weight:500;}
  .avail .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .avail.ok{color:#8fd18c;}      .avail.ok .dot{background:#8fd18c;box-shadow:0 0 6px rgba(143,209,140,.6);}
  .avail.out{color:#e0a86b;}     .avail.out .dot{background:#e0a86b;}
  .avail.missing{color:#9aa596;} .avail.missing .dot{background:#9aa596;}
  .avail.elsewhere{color:#c9b998;} .avail.elsewhere .dot{background:#c9b998;}
  .avail.unknown{color:var(--brass-light);} .avail.unknown .dot{background:var(--brass-light);}

  .eventcard .bc-title{font-size:14.5px;margin-top:2px;}
  .event-when{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--brass-light);font-weight:600;
  }
  .event-where{font-size:12px;color:#b9c2b2;margin-top:3px;}
  .event-desc{font-size:11.5px;color:#9aa596;margin-top:5px;line-height:1.45;}
  .event-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
  .etag{
    font-size:10px;padding:2px 7px;border-radius:100px;
    background:rgba(255,255,255,0.08);color:#cbbf9d;border:1px solid rgba(255,255,255,0.1);
  }
  .etag.full{background:rgba(224,168,107,0.16);color:#e0a86b;border-color:rgba(224,168,107,0.4);}
  .event-facets{margin-top:6px;font-size:11.5px;color:#9aa596;}

  .fmt-offer{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;
    padding-top:8px;border-top:1px solid rgba(255,255,255,0.1);
  }
  .fmt-lead{font-size:11px;color:#9aa596;}
  .fmt-chip{
    font-size:11px;padding:3px 9px;border-radius:100px;cursor:pointer;font-family:inherit;
    background:rgba(255,255,255,0.06);color:#b9c2b2;border:1px solid rgba(255,255,255,0.14);
  }
  .fmt-chip:hover{border-color:var(--brass-light);color:#fff;}
  .fmt-chip.has{color:#8fd18c;border-color:rgba(143,209,140,0.4);}

  .missing-note{
    margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,0.12);
    font-size:12px;color:#c3b394;line-height:1.5;
  }

  .shelf{
    display:flex;align-items:baseline;gap:6px;margin-top:5px;
    font-size:11.5px;color:#cbbf9d;line-height:1.4;
  }
  .shelf-pin{color:var(--brass-light);font-size:8px;flex-shrink:0;}
  .shelf-alt{color:#9aa596;}

  .branch-rows{margin-top:8px;border-top:1px solid rgba(255,255,255,0.1);padding-top:7px;display:flex;flex-direction:column;gap:4px;}
  .branch-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:#b9c2b2;}
  .branch-row.focus{color:#fff;font-weight:600;}
  .branch-row .bstat.ok{color:#8fd18c;}
  .branch-row .bstat.out{color:#c6a482;}

  .offline-note{
    margin-top:10px;padding:9px 12px;border-radius:8px;font-size:12px;line-height:1.5;
    background:rgba(224,168,107,0.14);border:1px solid rgba(224,168,107,0.4);color:#e8c9a0;position:relative;
  }
  .offline-note[hidden]{display:none;}
  .offline-note code{background:rgba(255,255,255,0.1);padding:1px 5px;border-radius:4px;color:#fff;}

  @media (max-width:820px){
    html,body{height:auto;overflow:auto;}
    .shell{height:auto;}
    .topbar{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px;}
    .pill-nav-container{order:3;width:100%;}
    .topbar .branch-pick{order:4;}
    .menu{position:fixed;left:8px;right:8px;top:auto;}
    .app{height:auto;min-height:100vh;}
    .main{height:auto;overflow:visible;}
  }
</style>
</head>
<body>
<div class="shell">

<!-- TOP BAR: the shelves, and the switches for the two panels -->
<header class="topbar">
  <!-- PillNav (React Bits), ported to vanilla JS + GSAP: logo + wordmark + pills -->
  <div class="pill-nav-container" id="pillNav"></div>

  <button class="lucky-trigger" id="luckyOpen" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
    <span id="luckyOpenLabel">I'm feeling lucky</span>
  </button>
  <button class="list-trigger" id="listOpen" aria-label="My list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/><path d="m17 17 2 2 4-4"/></svg>
    <span id="listOpenLabel">My list</span>
    <span class="list-count" id="listCount" hidden>0</span>
  </button>
  <button class="search-trigger" id="searchOpen" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <span id="searchOpenLabel">Search</span>
    <kbd aria-hidden="true">/</kbd>
  </button>

  <div class="pickers">
    <label class="branch-pick" for="homeBranch">
      <span class="pick-label" id="lblLibrary">My library</span>
      <select id="homeBranch" class="pill-select"></select>
    </label>
    <label class="branch-pick" for="langPick">
      <span class="pick-label" id="lblLanguage">Language</span>
      <select id="langPick" class="pill-select" aria-label="Select language"></select>
    </label>
  </div>
  <img class="brand-sccld" src="assets/sccld.png" alt="Santa Clara County Library District" height="30">
</header>

<!-- SEARCH PANEL: opens from the bar's Search button. A full-width bar and
     clickable example searches, so the box is never squeezed by the nav. -->
<div class="search-scrim" id="searchScrim" hidden></div>
