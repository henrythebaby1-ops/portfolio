/* Turns the catalog's copy counts into the sentence a patron actually wants:
   can I get this today, and if not, when?

   Scope is the whole point here. The search endpoint's summary counts every
   copy in the entire 9-branch system, so a book that is "8 of 15 in"
   system-wide can be 3 of 3 at Milpitas and 0 of 12 at Cupertino. Reporting
   the system number against a branch question is what made availability look
   wrong. When a branch is in play we count only that branch's copies, taken
   from the per-copy records rather than the summary. */
function availabilityLine(result, branch){
  if(!CATALOG_LIVE) return { cls:'unknown', text:t('av.check') };
  if(!result || !result.found) return { cls:'missing', text:t('av.notIn') };

  const a = result.book.availability;

  // A download sits on no shelf, so branch scoping is meaningless for it —
  // saying "not held at Cupertino" about an e-book is just wrong.
  const fam = result.book.formatFamily;
  if(a.isDigital || fam === 'ebook' || fam === 'audiobook'){
    const kind = fam === 'audiobook' ? t('av.audiobook') : t('av.ebook');
    // Hoopla-style titles report no copies at all: they're borrowed online
    // without a copy count, so "0 of 0" would read as broken.
    if(a.totalCopies === 0) return { cls:'ok', text:t('av.onlineFree', { kind }) };
    if(a.availableCopies > 0) return { cls:'ok', text:t('av.online', { n: a.availableCopies, total: a.totalCopies, count: a.totalCopies }) };
    return { cls:'out', text:t('av.onlineOut', { total: a.totalCopies, kind }) };
  }

  const rows = Array.isArray(result.branches) ? result.branches : null;
  const sysAvail = a.availableCopies, sysTotal = a.totalCopies;

  // Per-copy data not fetched yet (browse results arrive with the summary
  // only). Saying "not held at Cupertino" here would be a lie about missing
  // data, so fall through to the honest system-wide wording instead.
  if(branch && branch.code !== '_online_' && rows){
    const row = rows.find(r => r.code === branch.code);
    if(!row){
      const dueElse = rows.map(r => r.nextDue).filter(Boolean).sort()[0];
      return {
        cls: sysAvail > 0 ? 'elsewhere' : 'out',
        text: sysAvail > 0
          ? t('av.notHeldOther', { branch: branch.label, n: sysAvail })
          : sysTotal > 0
            ? t('av.notHeldOut', { branch: branch.label, total: sysTotal }) + (dueElse ? t('av.nextDue', { date: fmtDate(dueElse) }) : '')
            : t('av.notHeld', { branch: branch.label })
      };
    }
    const total = row.available + row.out;
    if(row.available > 0) return { cls:'ok', text:t('av.inAt', { n: row.available, total, count: total, branch: branch.label }) };
    return {
      cls:'out',
      text: t('av.outAt', { n: total, total, branch: branch.label })
        + (row.nextDue ? t('av.nextDue', { date: fmtDate(row.nextDue) }) : '')
        + (sysAvail > 0 ? t('av.elsewhere', { n: sysAvail }) : '')
    };
  }

  // No branch in play: say plainly that this spans the whole system, so the
  // number is never mistaken for one library's shelf.
  const k = rows ? rows.length : 0;
  if(sysAvail > 0){
    const best = (rows || []).filter(r => r.available > 0)[0];
    const lead = best ? t('av.mostAt', { branch: best.branch.replace(/ Library$/,'') }) : '';
    return { cls:'ok', text:(k ? t('av.across', { n: sysAvail, total: sysTotal, count: sysTotal, k }) : t('av.acrossAll', { n: sysAvail, total: sysTotal, count: sysTotal })) + lead };
  }
  const due = (rows || []).map(r => r.nextDue).filter(Boolean).sort()[0];
  if(sysTotal > 0){
    const held = a.heldCopies ? t('av.onHold', { n: a.heldCopies }) : '';
    return {
      cls:'out',
      text: (k ? t('av.allOut', { total: sysTotal, k }) : t('av.allOutAll', { total: sysTotal })) + held + (due ? t('av.nextDue', { date: fmtDate(due) }) : '')
    };
  }
  return { cls:'missing', text:t('av.notIn') };
}

function plural(n, one, many){ return `${n} ${n === 1 ? one : many}`; }

function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(locale(), { month:'short', day:'numeric' });
}

/* "Where do I actually find it?" — the collection is the area a patron walks
   to ("Mystery Section") and the call number is the label on the spine. Scoped
   to the branch in play; otherwise the shelving used by most of the system,
   since branches overwhelmingly shelve a given title the same way. */
function shelfLine(result, branch){
  if(!CATALOG_LIVE || !result || !result.found) return '';
  const fam = result.book.formatFamily;
  if(result.book.availability.isDigital || fam === 'ebook' || fam === 'audiobook') return '';

  const rows = Array.isArray(result.branches) ? result.branches : [];
  let shelves = null;

  // Nothing per-branch yet, but the record itself carries a call number.
  if(!rows.length && result.book.callNumber){
    return `<div class="shelf"><span class="shelf-pin">&#9670;</span><span>${esc(result.book.callNumber)}</span></div>`;
  }

  if(branch && branch.code !== '_online_'){
    const row = rows.find(r => r.code === branch.code);
    if(!row || !(row.shelves || []).length) return '';
    shelves = row.shelves;
  } else {
    // Pool every branch's shelving and take the most common arrangement.
    const tally = new Map();
    for(const r of rows) for(const sh of r.shelves || []){
      const key = sh.collection + ' ' + sh.callNumber;
      const cur = tally.get(key) || { ...sh, total: 0, available: 0 };
      cur.total += sh.total; cur.available += sh.available;
      tally.set(key, cur);
    }
    shelves = [...tally.values()].sort((x,y) => y.total - x.total);
  }
  if(!shelves || !shelves.length) return '';

  const top = shelves[0];
  const where = [top.collection, top.callNumber].filter(Boolean).join(' · ');
  if(!where) return '';

  // A second shelving only matters when it is the one holding the copies.
  const alt = shelves[1] && shelves[1].available > 0 && top.available === 0 ? shelves[1] : null;
  const altText = alt
    ? ` <span class="shelf-alt">also ${esc([alt.collection, alt.callNumber].filter(Boolean).join(' · '))}</span>`
    : '';

  return `<div class="shelf"><span class="shelf-pin">&#9670;</span><span>${esc(where)}</span>${altText}</div>`;
}

askBtn.addEventListener('click', handleAsk);
promptInput.addEventListener('keydown', e => { if(e.key === 'Enter') handleAsk(); });

/* Recognises "where is it?", "what section is it in?", "where do I find X" —
   the question a patron asks once they know the library has the book.

   The hard part is NOT catching book titles. "Where the Wild Things Are" and
   "Where the Crawdads Sing" are searches, not questions, so "where" must be
   followed by a question verb ("where is/can/do") or be the contraction
   ("where's"). "Where the ..." never qualifies. */
function isWhereQuestion(q){
  const t = String(q || '');

  // "What books are like Wonder?" is a recommendation, never a location question.
  if(/\b(books?\s+(like|similar|such as)|recommend|suggest)\b/i.test(t)) return false;

  const locationWord = /\b(section|shelf|shelves|shelved|aisle|call ?number|located|locate)\b/i.test(t);
  if(/\b(what|which)\b/i.test(t) && locationWord) return true;
  if(/\bwhere'?s\b/i.test(t)) return true;
  if(/\bwhere\s+(is|are|can|do|does|did|would|should|might|exactly|in)\b/i.test(t)) return true;
  return false;
}

/* Picks which remembered books the follow-up is about. "Where is it?" means
   the book they asked about — not the suggestions that happened to come with
   it — so the asked-for titles win unless the question names something else. */
function booksForFollowUp(query){
  const q = normTitle(query);
  const all = [...LAST_ANSWER.asked, ...LAST_ANSWER.recs];
  const named = all.filter(e => {
    const t = normTitle(e.result && e.result.found ? e.result.book.title : e.title);
    return t && t.length > 2 && q.includes(t);
  });
  if(named.length) return named;
  return LAST_ANSWER.asked.length ? LAST_ANSWER.asked : LAST_ANSWER.recs;
}

async function answerWhere(query){
  const branch = effectiveBranch(query) || LAST_ANSWER.branch;
  const entries = booksForFollowUp(query);
  // Light lookups leave branches for later; a "where" question needs them now.
  await Promise.all(entries.map(async e => {
    if(!e.result || !e.result.found || Array.isArray(e.result.branches)) return;
    try{ const r = await fetch(`/api/availability?id=${encodeURIComponent(e.result.book.id)}`); if(r.ok) e.result.branches = (await r.json()).branches || []; }
    catch(err){ e.result.branches = []; }
  }));
  const shelvable = entries.filter(e => e.result && e.result.found && shelfLine(e.result, branch));
  const where = branch ? t('st.at', { branch: branch.label }) : '';
  resultCount.textContent = shelvable.length ? t('st.whereShown', { where }) : t('st.whereNone', { where });
  showResults(t('res.where'), [{ title: t('res.where'), sub: where.trim(), cards: (shelvable.length ? shelvable : entries).map(e => resultCard(e, branch, t('band.where'))) }]);
}

/* ---------------- FORMAT ----------------
   SCCLD holds the same title as a book, an e-book, an audiobook and sometimes
   a DVD. Say nothing and you get the book; name a format and you get that. */
const FORMAT_WORDS = [
  ['ebook',     /\b(e-?\s?books?|ebooks?|kindle|libby|overdrive|digital cop(y|ies)|digital version)\b/i],
  ['audiobook', /\b(audio-?\s?books?|audiobooks?|playaway|listening cop(y|ies))\b/i],
  ['dvd',       /\b(dvds?|blu-?ray|movies?|films?)\b/i],
  // Only unambiguous print words here. A bare "book" cannot appear: "The Book
  // Thief" and "The Book with No Pictures" are titles, and treating them as a
  // format request would hijack the search.
  ['print',     /\b(printed|physical|paper-?back|hard-?(cover|back)|large print|paper cop(y|ies))\b/i]
];

function detectFormat(query){
  for(const [name, re] of FORMAT_WORDS){ if(re.test(query)) return name; }
  return '';
}

/* A reply to "there's also an e-book" may just say "the book". That reading is
   only safe as a follow-up, and only when the whole message is that reply —
   anchored end to end, so "I want the book" is a format choice while "I want
   The Book Thief" keeps its leftover words and stays a search. */
const PRINT_REPLY = /^\s*(no[,.\s]*)?(i\s*)?(just\s+|only\s+)?((would\s+)?like|want|prefer|will take|'?ll take|d like)?\s*(the\s+|a\s+|an\s+)?(regular\s+|normal\s+|ordinary\s+|physical\s+|printed\s+|paper\s+)?(books?|print|copy)\s*(please|instead|version|itself|like this|thanks)?\s*[.!?]*\s*$/i;

function detectFormatReply(query){
  const explicit = detectFormat(query);
  if(explicit) return explicit;
  return PRINT_REPLY.test(query) ? 'print' : '';
}

const FORMAT_LABELS = { print:'print book', ebook:'e-book', audiobook:'audiobook', dvd:'DVD', largeprint:'large print' };

/* "yes, the ebook" / "I want the audiobook" / "no, the book" — a short reply
   naming a format, right after an answer, means swap the format rather than
   start a new search. A long sentence or a new title is a fresh question. */
function isFormatSwitch(query){
  if(!LAST_ANSWER.asked.length) return false;
  if(!detectFormatReply(query)) return false;
  const words = query.trim().split(/\s+/).length;
  if(words > 9) return false;
  // "do you have the ebook of Holes" names a book — treat as a new search.
  if(/\b(do you have|looking for|find me|search for)\b/i.test(query)) return false;
  return true;
}

async function switchFormat(format, spoken){
  const branch = LAST_ANSWER.branch;
  const asked = LAST_ANSWER.asked.map(e => ({ title: e.title, author: e.author }));
  const label = t(`fmt.${format}`);
  resultCount.textContent = t('st.looking', { format: label });
  const entries = await resolveAll(asked, format);
  const found = entries.filter(e => e.result && e.result.found);
  resultCount.textContent = found.length
    ? (branch ? t('st.countsAt', { branch: branch.label }) : t('st.countsAll'))
    : t('st.noFormat', { titles: asked.map(a => a.title).join(', '), format: label });
  LAST_ANSWER = { asked: entries, recs: [], branch, format };
  showResults(t('st.asFormat', { format: label }), [{ title: t('st.asFormat', { format: label }), sub: '', cards: entries.map(e => resultCard(e, branch, label)) }]);
}

/* ---------------- EVENTS ----------------
   The library's calendar lives on the same BiblioCommons tenant as the
   catalog, so events are fetched through the proxy exactly like availability. */
async function fetchEvents(eq, branch){
  if(!CATALOG_LIVE) return null;
  const params = new URLSearchParams();
  if(eq.keywords) params.set('q', eq.keywords);
  if(eq.audience) params.set('audience', eq.audience);
  if(eq.type) params.set('type', eq.type);
  if(branch && branch.code !== '_online_') params.set('branch', branch.code);
  params.set('limit', '6');
  try{
    const r = await fetch(`/api/events?${params}`, { signal: AbortSignal.timeout(20000) });
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

/* "Tue, Sep 15 - 10:30 AM". Event times arrive as local wall-clock strings
   ("2026-09-15T10:30") with no zone, which is what the library means: the
   programme starts at half past ten in the room, whatever the viewer's zone. */
function eventWhen(ev){
  if(!ev.start) return '';
  const [date, time] = String(ev.start).split('T');
  const [y, m, d] = date.split('-').map(Number);
  const local = new Date(y, m - 1, d, ...(time ? time.split(':').map(Number) : [0, 0]));
  if(isNaN(local)) return String(ev.start);
  const day = local.toLocaleDateString(locale(), { weekday:'short', month:'short', day:'numeric' });
  if(!time) return day;
  return `${day} · ${local.toLocaleTimeString(locale(), { hour:'numeric', minute:'2-digit' })}`;
}

function renderEvents(plan, data, branch){
  const events = (data && data.events) || [];
  const matched = (data && data.matched) || {};
  const facets = [matched.audience, matched.type].filter(Boolean).join(' · ');
  const where = branch ? t('st.at', { branch: branch.label }) : '';
  if(!CATALOG_LIVE){
    resultCount.textContent = t('ev.needServer');
    showResults(t('nav.events'), [{ title: t('res.events'), sub: '', cards: [] }]);
    return;
  }
  if(!events.length){
    const bits = [plan.eventQuery.keywords, plan.eventQuery.audience, plan.eventQuery.type].filter(Boolean).join(', ');
    resultCount.textContent = t('ev.noneMatching', { what: bits || t('ev.that'), where });
    showResults(t('nav.events'), [{ title: t('res.events'), sub: t('ev.noneFound'), cards: [] }]);
    return;
  }
  resultCount.textContent = data.broadened
    ? t('ev.dropped', { what: data.broadened, facets: facets ? t('ev.showing', { facets }) : '' })
    : (facets ? t('ev.filtered', { facets, where }) : t('ev.count', { n: events.length, where }));
  showResults(t('nav.events'), [{ title: t('res.events'), sub: branch ? branch.label : '', cards: events.map(eventGridCard) }]);
}

async function handleAsk(){
  const query = promptInput.value.trim();
  if(!query) return;
  closeSearch();
  askBtn.disabled = true;

  if(isWhereQuestion(query) && (LAST_ANSWER.asked.length || LAST_ANSWER.recs.length)){
    await answerWhere(query);
    askBtn.disabled = false;
    return;
  }
  if(isFormatSwitch(query)){
    await switchFormat(detectFormatReply(query));
    askBtn.disabled = false;
    return;
  }

  const branch = effectiveBranch(query);
  LAST_QUERY = query;
  const scope = branch ? t('st.countsAt', { branch: branch.label }) : t('st.countsAll');

  /* The page responds the instant the search is submitted: placeholder cards
     go up at once. Then two things run side by side — the catalog's own
     search and the model — and each puts its part on screen the moment it's
     ready, the catalog's results at the top, the model's picks beneath, one
     card at a time. Nothing waits for anything slower than itself. */
  showResults(`“${query}”`, [], []);
  const gen = HOME_GEN;
  const live = () => gen === HOME_GEN;
  let skeleton = startSection(t('res.finding'), '');
  for(let i = 0; i < 4; i++) addCard(skeleton, skeletonCard());
  const clearSkeleton = () => {
    if(!skeleton) return;
    let n = skeleton.nextElementSibling;
    while(n && n.classList.contains('skeleton')){ const x = n; n = n.nextElementSibling; x.remove(); }
    skeleton.remove(); skeleton = null;
  };
  resultCount.textContent = t('st.searching');

  let catalogShown = false;
  const foundPromise = catalogSearch(query).then(found => {
    if(!live() || !found || !found.books || !found.books.length || !searchLooksRelevant(query, found.books)) return found;
    // The catalog's answer belongs first, whether it lands before or after
    // the model's picks.
    clearSkeleton();
    const items = found.books.map(b => ({ band: t('band.result'), book: b, branches: null }));
    const more = found.count > found.books.length ? ` · ${t('res.showing', { n: found.books.length })}` : '';
    grid.insertAdjacentHTML('afterbegin',
      `<div class="grid-section"><h3>${esc(t('res.catalog', { q: query }))}<span class="sec-sub">${esc(t('res.found', { n: found.count }))}${esc(more)}</span></h3><button class="back-home">${esc(t('res.back'))}</button></div>` +
      items.map(i => shelfCard(i, branch)).join(''));
    [...grid.querySelectorAll('.book')].slice(0, items.length).forEach(wireShelfCard);
    grid.querySelector('.back-home')?.addEventListener('click', () => loadHome());
    hydrateHome(items, gen);
    catalogShown = true;
    if(resultCount.textContent === t('st.searching')) resultCount.textContent = `${scope} · ${t('st.findingMore')}`;
    return found;
  });

  const planPromise = (async () => {
    try{ return ENTERAPIKEYHERE ? await askOpenRouter(query) : localPlan(query); }
    catch(err){ return localPlan(query); }
  })();

  const plan = await planPromise;
  if(!live()) { askBtn.disabled = false; return; }

  if(plan.intent === 'events'){
    clearSkeleton();
    resultCount.textContent = t('st.calendar');
    const data = await fetchEvents(plan.eventQuery, branch);
    askBtn.disabled = false;
    if(live()) renderEvents(plan, data, branch);
    return;
  }

  const asked = (plan.requested || []).filter(r => r && r.title).slice(0, MAX_LIST)
    .map(r => ({ title: r.title, author: r.author || '' }));
  const isList = asked.length > 1;
  const wantFormat = detectFormat(query) || (branch && branch.code === '_online_' ? 'ebook' : '');

  // A list is a tally over every title, so it renders once, whole.
  if(isList){
    clearSkeleton();
    resultCount.textContent = t('st.checkingList', { n: asked.length });
    const askedEntries = await resolveAll(asked, wantFormat);
    askBtn.disabled = false;
    if(!live()) return;
    LAST_ANSWER = { asked: askedEntries, recs: [], branch };
    renderAnswer(plan, askedEntries, [], branch, true, query, null, false);
    return;
  }

  const hydrateOne = (sink) => { if(sink.length && live()) hydrateHome(sink, gen); };

  // The one book they named, if any, goes up as soon as it resolves.
  let askedEntries = [];
  let missingNote = '';
  if(asked.length === 1){
    if(!catalogShown) resultCount.textContent = t('st.checkingAvail');
    askedEntries = await resolveAll(asked, wantFormat);
    if(!live()) { askBtn.disabled = false; return; }
    const entry = askedEntries[0];
    const ok = entry.result && entry.result.found;
    if(!catalogShown){
      clearSkeleton();
      const sec = startSection(t('res.asked'), '');
      const sink = []; addCard(sec, resultCard(entry, branch, t('band.asked'), sink)); hydrateOne(sink);
    }
    if(!ok) missingNote = t('st.notIn', { title: entry.title });
  }

  // Picks stream in one at a time.
  const picksTitle = askedEntries.length ? t('res.similar') : (catalogShown ? t('res.picksAlso') : t('res.picks'));
  const picksSec = startSection(picksTitle, t('res.findingShort'));
  const seen = new Set(askedEntries.map(e => keyOf(e)));
  const candidates = dedupeBooks(plan.recommendations || [], seen);
  let shown = 0;
  const recEntries = await resolveRecommendations(candidates, askedEntries, wantFormat, entry => {
    if(!live()) return;
    clearSkeleton();
    const sink = []; addCard(picksSec, resultCard(entry, branch, askedEntries.length ? t('band.similar') : t('band.pick'), sink)); hydrateOne(sink);
    shown++; setSectionSub(picksSec, t('res.soFar', { n: shown }));
  });
  await foundPromise; // the catalog may still be finishing; let it place its section
  if(live()){
    clearSkeleton();
    if(recEntries.length) setSectionSub(picksSec, ''); else picksSec.remove();
    resultCount.textContent = missingNote || scope;
  }
  askBtn.disabled = false;
  LAST_ANSWER = { asked: askedEntries, recs: recEntries, branch };
}

/* Resolve titles against the catalog a few at a time. Unbounded Promise.all
   over a 20-title list would fire 40 catalog requests at once; the proxy
   caches, but the catalog still deserves better manners. */
async function resolveAll(books, wantFormat){
  const out = [];
  for(let i = 0; i < books.length; i += LOOKUP_BATCH){
    const batch = books.slice(i, i + LOOKUP_BATCH);
    out.push(...await Promise.all(batch.map(async b => ({
      title: b.title, author: b.author || '', why: b.why || '',
      result: await lookupBook(b.title, b.author, { format: wantFormat })
    }))));
  }
  return out;
}

/* Suggestions are only useful if the patron can actually borrow them, so each
   is checked against the catalog and the misses are replaced rather than
   displayed. Models reach for series names ("Books of Ember series", "Nancy
   Drew Mystery Stories") which no catalogue holds as a title, and those came
   out as dead "Not in this catalog" cards.

   This applies ONLY to suggestions. A title the patron asked for is still
   reported as not found — never quietly dropped. */
async function resolveRecommendations(candidates, askedEntries, wantFormat, onFound){
  /* All candidate lookups start at once, but are consumed in the model's
     order: the first pick goes on screen the moment it resolves, the second
     as soon as it and the first are done, and so on. Waiting for a whole
     batch made four cards appear together after eight seconds; this shows
     the first within two. A few extra candidates are started so dropped
     ones (duplicates, 0-copy downloads) don't leave the shelf short. */
  const pool = candidates.slice(0, REC_COUNT + 4);
  const inflight = pool.map(b => lookupBook(b.title, b.author, { format: wantFormat })
    .then(result => ({ title: b.title, author: b.author || '', why: b.why || '', result }))
    .catch(() => ({ title: b.title, author: b.author || '', why: b.why || '', result: null })));

  const kept = [];
  for(const p of inflight){
    if(kept.length >= REC_COUNT) break;
    const entry = await p;
    if(!dropResolvedDupes([entry], [...askedEntries, ...kept]).length) continue;
    // A record with no copies at all (a 0/0 download) is not a suggestion
    // anyone can act on. With no catalog connection nothing can be checked.
    const ok = entry.result && entry.result.found && entry.result.book.availability.totalCopies > 0;
    if(!CATALOG_LIVE || ok){
      kept.push(entry);
      onFound?.(entry);
    }
  }
  return kept;
}

const normTitle = t => String(t||'').toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim();
const keyOf = e => normTitle((e.result && e.result.found ? (e.result.book.nativeTitle || e.result.book.title) : e.title));
const normAuthor = a => String(a||'').toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(w=>w.length>1).sort().join(' ');

/* "Dog Man" and "Dog Man: Twenty Thousand Fleas Under the Sea" are the same
   series, and offering the second as a readalike for the first is the
   behaviour that made recommendations look like padding. Titles that share a
   whole-word prefix are treated as one series. Compared on word boundaries so
   "Wonder" doesn't swallow "Wonderstruck". */
function sameSeries(a, b){
  const x = normTitle(a), y = normTitle(b);
  if(!x || !y) return false;
  if(x === y) return true;
  const [short, long] = x.length <= y.length ? [x, y] : [y, x];
  return long.startsWith(short + ' ');
}

/* The model is told not to repeat a series or lean on one author, and
   sometimes does anyway, so the rule is enforced here rather than hoped for.
   `seen` holds the normalised titles already spoken for. */
function dedupeBooks(books, seen){
  const out = [];
  const authorCount = new Map();
  for(const b of books){
    if(!b || !b.title) continue;
    const k = normTitle(b.title);
    if(!k || seen.has(k)) continue;
    if([...seen].some(s => sameSeries(s, k))) continue;
    if(out.some(o => sameSeries(o.title, b.title))) continue;

    // At most one book per author, so four picks mean four voices.
    const a = normAuthor(b.author);
    if(a){
      if((authorCount.get(a) || 0) >= 1) continue;
      authorCount.set(a, (authorCount.get(a) || 0) + 1);
    }
    seen.add(k);
    out.push(b);
  }
  return out;
}

function dropResolvedDupes(entries, askedEntries){
  const seenIds = new Set(askedEntries.map(e => e.result && e.result.found && e.result.book.id).filter(Boolean));
  const seenTitles = new Set(askedEntries.map(keyOf));
  const out = [];
  for(const e of entries){
    const id = e.result && e.result.found ? e.result.book.id : null;
    const k = keyOf(e);
    if((id && seenIds.has(id)) || seenTitles.has(k)) continue;
    if(id) seenIds.add(id);
    seenTitles.add(k);
    out.push(e);
  }
  return out;
}

function renderAnswer(plan, askedEntries, recEntries, branch, isList, query, found, catalogShown){
  const tally = (entries) => tallyList(entries, branch).replace(/<div[^>]*>/g, ' — ').replace(/<[^>]+>/g, '');
  const scope = branch ? t('st.countsAt', { branch: branch.label }) : t('st.countsAll');
  const hydrate = [];
  const sections = [];

  let catalogSection = null;
  if(!catalogShown && found && found.books && found.books.length){
    const items = found.books.map(b => ({ band: t('band.result'), book: b, branches: null }));
    hydrate.push(...items);
    const more = found.count > found.books.length ? ` · ${t('res.showing', { n: found.books.length })}` : '';
    catalogSection = { title: t('res.catalog', { q: query }), sub: t('res.found', { n: found.count }) + more, cards: items.map(i => shelfCard(i, branch)) };
  }
  const catalogLeads = catalogShown || (catalogSection && searchLooksRelevant(query, found.books));

  if(isList){
    resultCount.textContent = tally(askedEntries);
    sections.push({ title: t('res.list'), sub: t('res.titles', { n: askedEntries.length }), cards: askedEntries.map(e => resultCard(e, branch, t('band.list'), hydrate)) });
  } else if(askedEntries.length === 1){
    const entry = askedEntries[0];
    const ok = entry.result && entry.result.found;
    resultCount.textContent = ok ? scope : t('st.notIn', { title: entry.title });
    if(catalogSection && catalogLeads) sections.push(catalogSection);
    if(!catalogLeads) sections.push({ title: t('res.asked'), sub: '', cards: [resultCard(entry, branch, t('band.asked'), hydrate)] });
    if(recEntries.length) sections.push({ title: t('res.similar'), sub: '', cards: recEntries.map(e => resultCard(e, branch, t('band.similar'), hydrate)) });
    if(catalogSection && !catalogLeads) sections.push(catalogSection);
  } else {
    resultCount.textContent = scope;
    if(catalogSection && catalogLeads) sections.push(catalogSection);
    if(recEntries.length) sections.push({ title: catalogLeads ? t('res.picksAlso') : t('res.picks'), sub: '', cards: recEntries.map(e => resultCard(e, branch, t('band.pick'), hydrate)) });
    if(catalogSection && !catalogLeads) sections.push(catalogSection);
  }

  if(catalogShown){
    // The catalog's results are already on screen; add the rest beneath them.
    for(const sec of sections) appendResultSection(sec, []);
    if(hydrate.length) hydrateHome(hydrate, HOME_GEN);
  } else {
    showResults(`“${query}”`, sections, hydrate);
  }
}

/* "5 available now · 2 checked out · 1 not in the catalog" — scoped to the
   branch in play, so it agrees with the per-book lines underneath it. */
function tallyList(entries, branch){
  if(!CATALOG_LIVE) return t('res.titles', { n: entries.length });
  let ready = 0, out = 0;
  const missing = [];
  for(const e of entries){
    const cls = availabilityLine(e.result, branch).cls;
    if(cls === 'ok') ready++;
    else if(cls === 'missing') missing.push(e.title);
    else out++;
  }
  const parts = [];
  if(ready) parts.push(`<b>${esc(t('tally.avail', { n: ready }))}</b>${branch ? esc(t('st.at', { branch: branch.label })) : ''}`);
  if(out) parts.push(esc(t('tally.out', { n: out })));
  if(missing.length) parts.push(esc(t('tally.missing', { n: missing.length })));
  let line = esc(t('tally.checked', { n: entries.length })) + (parts.join(' · ') || esc(t('tally.none')));
  if(missing.length) line += `<div class="missing-note">${esc(t('tally.missingList', { titles: missing.join(', ') }))}</div>`;
  return line;
}

/* Local fallback when no OpenRouter key is set. Returns the same
   {intent, requested[], recommendations[]} shape so rendering is identical. */
function localPlan(query){
  const q = query.toLowerCase();

  // Recognise event questions without a model, so the fallback answers the
  // question that was asked rather than defaulting to book picks.
  if(/\b(event|events|program|programme|programs|class|classes|club|clubs|storytime|story time|workshop|activity|activities|happening|going on)\b/.test(q)){
    const audience = ['babies','toddlers','preschoolers','tweens','teens','adults','older adults','kids','family']
      .find(a => q.includes(a.replace(/s$/, ''))) || '';
    const type = ['crafts','stem','arts','health','jobs','money','history','home','parenting','entertainment']
      .find(t => q.includes(t.replace(/s$/, ''))) || '';
    const stop = new Set(['any','are','there','the','for','with','what','which','have','does','you','got','this','week','near','me','at','in','of','a','an','is','it','do','i','want','like','and','some','event','events']);
    const keywords = q.replace(/[^a-z0-9 ]/g, ' ').split(/\s+/)
      .filter(w => w.length > 3 && !stop.has(w)).slice(0, 3).join(' ');
    return { intent:'events', requested:[], recommendations:[], summary:'Here\'s what I found on the calendar.',
             eventQuery:{ keywords, audience, type } };
  }
  const seed = [
    { title:"Pete the Cat: I Love My White Shoes", author:"Eric Litwin", tags:["funny","animals","picture book"] },
    { title:"Llama Llama Red Pajama", author:"Anna Dewdney", tags:["funny","animals","bedtime","picture book"] },
    { title:"Mercy Watson to the Rescue", author:"Kate DiCamillo", tags:["funny","animals","early reader"] },
    { title:"Dog Man", author:"Dav Pilkey", tags:["funny","animals","graphic novel","middle school"] },
    { title:"The One and Only Ivan", author:"Katherine Applegate", tags:["animals","gentle","middle school"] },
    { title:"Good Night, Gorilla", author:"Peggy Rathmann", tags:["animals","bedtime","picture book"] },
    { title:"The Thursday Murder Club", author:"Richard Osman", tags:["mystery","cozy","adult"] },
    { title:"New Kid", author:"Jerry Craft", tags:["graphic novel","middle school"] }
  ];

  // Every known title mentioned counts as a named book, so a pasted list is
  // still answered as a list without a model.
  const named = seed.filter(b => q.includes(b.title.toLowerCase()));
  if(named.length){
    const rest = seed.filter(b => !named.includes(b));
    return {
      intent: named.length > 1 ? 'list' : 'lookup',
      requested: named.map(b => ({ title:b.title, author:b.author })),
      summary: named.length > 1 ? `Checked all ${named.length} titles.` : `Here's ${named[0].title}.`,
      recommendations: named.length > 1 ? []
        : rest.slice(0, REC_COUNT).map(b => ({ title:b.title, author:b.author, why:'' }))
    };
  }

  const scored = seed
    .map(b => ({ b, n: b.tags.filter(t => q.includes(t)).length }))
    .filter(x => x.n > 0).sort((x,y) => y.n - x.n).map(x => x.b);
  const picks = (scored.length ? scored : seed).slice(0, REC_COUNT);

  return {
    intent: 'recommend',
    requested: [],
    summary: `Some picks based on "${query}" — add an OpenRouter key for smarter matches.`,
    recommendations: picks.map(b => ({ title:b.title, author:b.author, why:'' }))
  };
}

/* Live call to OpenRouter. The model's only job is to understand the request
   and name books — it is explicitly told NOT to speak about availability,
   because it has no way to know. Availability is attached afterwards from the
   real catalog, which is why the assistant no longer says "I can't check that". */
async function askOpenRouter(query){
  const systemPrompt = [
    'You help patrons of a public library find books. Classify the request, then answer in JSON.',
    '',
    'intent "list" — the patron named SEVERAL specific books (a reading list, a series, books copied from somewhere). Put EVERY book they named in "requested", in their order. Leave "recommendations" EMPTY. Do not add books they did not name.',
    'intent "lookup" — the patron named exactly ONE specific book. Put it in "requested" and put 8 genuinely similar books in "recommendations" (extras are filtered out later).',
    'intent "recommend" — the patron described a mood, genre, age or vibe and named no book. Leave "requested" EMPTY and give 8 books in "recommendations" (extras are filtered out later).',
    'intent "events" — the patron is asking about library events, programmes, activities, story times, classes or clubs rather than books. Leave "requested" and "recommendations" EMPTY and fill "eventQuery" instead.',
    '',
    'For "events", fill eventQuery with:',
    '  keywords: the distinctive words to search event titles for ("storytime", "lego", "snacks", "crochet"). Keep it to 1-3 words, no filler. Empty string if they only named an audience or a topic.',
    '  audience: one of babies, toddlers, preschoolers, kids, tweens, teens, adults, older adults, family - or "" if unstated. "bedtime stories for my 2 year old" is toddlers; "a lot of babies" is babies.',
    '  type: one of crafts, arts, stem, health, jobs, money, history, home, parenting, entertainment - or "" if unstated. "crafts" and "making things" are crafts; "experiments" is stem.',
    '',
    'Rules:',
    '- "requested" is always an array. Copy the titles the patron actually named; do not substitute, expand or invent entries.',
    '- Recommendations must be DIFFERENT BOOKS, never other volumes, editions or entries in the same series as each other or as a requested book. "Books like Dog Man" must not return more Dog Man.',
    '- Vary the authors: do not return several books by the author of the requested book.',
    '- Only real, existing, published books, with the exact title as published and no subtitle padding.',
    '- Recommend an INDIVIDUAL BOOK, never a series name. A library catalogue holds "The City of Ember", not "Books of Ember series"; "The Absolute Value of Mike", not "A to Z Mysteries". If you mean a series, name its first book.',
    '- NEVER say you cannot check availability, and never mention holds, copies, branches, or whether a book is in stock. A separate system attaches live availability to your answer.',
    '- "why" is at most 12 words saying why this patron would like it. "summary" is one friendly sentence.',
    '- Reply with ONLY raw JSON, no markdown fences and no commentary.',
    '',
    'Format: {"intent":"list"|"lookup"|"recommend"|"events","requested":[{"title":"...","author":"..."}],"summary":"...","recommendations":[{"title":"...","author":"...","why":"..."}],"eventQuery":{"keywords":"...","audience":"...","type":"..."}}'
  ].join('\n');

  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${ENTERAPIKEYHERE}`,
      "HTTP-Referer": window.location.href,
      "X-Title": "Hummy AI Library Search Prototype"
    },
    body: JSON.stringify({
      model: OPENROUTER_MODEL,
      messages: [
        { role: "system", content: systemPrompt + (LANG !== 'en' ? `\nThe patron's interface language is ${I18N[LANG].name}. Prefer real books published in that language when they exist; keep "why" in that language.` : '') },
        { role: "user", content: query }
      ],
      max_tokens: 1024,
      temperature: 0.4
    })
  });
  if(!res.ok){
    const errBody = await res.text().catch(() => "");
    throw new Error(`OpenRouter ${res.status} ${errBody.slice(0,100)}`);
  }
  const data = await res.json();
  const parsed = extractJson(data.choices?.[0]?.message?.content || "{}");
  // Models still sometimes send a bare object (or null) for "requested",
  // so accept either shape rather than losing the patron's titles.
  const req = parsed.requested;
  const requested = Array.isArray(req) ? req : (req && req.title ? [req] : []);
  const eq = parsed.eventQuery || {};
  return {
    intent: parsed.intent || 'recommend',
    requested,
    summary: parsed.summary || '',
    recommendations: Array.isArray(parsed.recommendations) ? parsed.recommendations : [],
    eventQuery: {
      keywords: eq.keywords || '',
      audience: eq.audience || '',
      type: eq.type || ''
    }
  };
}

/* Pulls the first {...} JSON object out of a response, even if the model
   wrapped it in commentary, an intro sentence, or markdown fences — and
   repairs the malformations this model actually produces. Observed in the
   wild: {"type:"} where {"type":""} was meant, which threw and silently
   dropped the answer back to the keyless fallback. */
function repairJson(text){
  return text
    // A key that swallowed its own value: "type:"  ->  "type":""
    .replace(/"([A-Za-z_][\w]*):"\s*([,}])/g, '"$1":""$2')
    // A key with a colon but nothing after it: "type": ,  ->  "type":"",
    .replace(/"([A-Za-z_][\w]*)"\s*:\s*([,}])/g, '"$1":""$2')
    // Trailing commas before a close.
    .replace(/,\s*([}\]])/g, '$1');
}

function extractJson(text){
  const clean = text.replace(/```json|```/g, "").trim();
  const candidates = [clean, (clean.match(/\{[\s\S]*\}/) || [])[0]].filter(Boolean);

  for(const c of candidates){
    try{ return JSON.parse(c); } catch(e){ /* try the repaired form */ }
    try{ return JSON.parse(repairJson(c)); } catch(e){ /* fall through */ }
  }
  throw new Error(`Model didn't return parseable JSON — raw reply: "${clean.slice(0,120)}"`);
}

initBranchPicker();
probeProxy();
buildPartners();
</script>
