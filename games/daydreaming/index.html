<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DayDreaming</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Courier New', monospace;
      }
      canvas { display: block; }

      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        pointer-events: none;
        z-index: 10;
      }

      #prompt {
        position: fixed;
        bottom: 14%;
        left: 50%;
        transform: translateX(-50%);
        color: #e8e0b0;
        font-size: 18px;
        letter-spacing: 1px;
        text-shadow: 0 0 6px rgba(0,0,0,0.9);
        opacity: 0;
        transition: opacity 0.15s ease;
        pointer-events: none;
        z-index: 10;
      }
      #prompt.visible { opacity: 1; }

      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(5, 5, 0, 0.85);
        color: #d8cf8a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 20;
        cursor: pointer;
      }
      #overlay h1 {
        font-size: 2.4em;
        letter-spacing: 4px;
        margin-bottom: 0.2em;
        filter: blur(0.3px);
      }
      #overlay p {
        max-width: 480px;
        line-height: 1.5;
        opacity: 0.8;
      }
      #overlay.hidden { display: none; }

      #start-btn {
        margin-top: 1.6em;
        padding: 0.7em 2.2em;
        font-family: 'Courier New', monospace;
        font-size: 1.1em;
        letter-spacing: 2px;
        color: #1a1707;
        background: #d8cf8a;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(216, 207, 138, 0.4);
        transition: transform 0.1s ease, box-shadow 0.15s ease;
      }
      #start-btn:hover {
        transform: scale(1.04);
        box-shadow: 0 0 20px rgba(216, 207, 138, 0.7);
      }
      #start-btn:active {
        transform: scale(0.98);
      }

      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        box-shadow: inset 0 0 180px 60px rgba(0,0,0,0.65);
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>DAYDREAMING</h1>
      <p>
        The hum never stops. The lights never quite reach the corners.<br />
        WASD to move, mouse to look, E to interact, Esc to release the cursor.
      </p>
      <button id="start-btn">START</button>
    </div>
    <div id="vignette"></div>
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
