    <style>
:root {
    --primary: #27ae60;
    --dark: #2c3e50;
    --bg: #f8f9fa;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background-color: var(--bg);
    margin: 0;
    padding: 20px;
}

.container { max-width: 1200px; margin: 0 auto; }

header { text-align: center; margin-bottom: 30px; }

.controls {
    display: flex;
    gap: 15px;
    margin-bottom: 40px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    position: sticky;
    top: 20px;
    z-index: 10;
}

input, select {
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
}

input { flex: 2; }
input:focus { border-color: var(--primary); }

.results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 25px;
}

.animal-card {
    background: white;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: 0.3s;
}

.animal-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

.card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}

.tag {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.7rem;
    background: #eee;
    padding: 4px 10px;
    border-radius: 10px;
    text-transform: uppercase;
}

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
}

.modal-content {
    background: white;
    max-width: 500px;
    margin: 50px auto;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
}

.modal-img { width: 100%; height: 300px; object-fit: cover; }
.modal-text { padding: 30px; text-align: center; }

.close-btn {
    position: absolute;
    top: 10px; right: 20px;
    font-size: 30px;
    color: white;
    cursor: pointer;
    z-index: 10;
}
</style>
</head>

const imageCache = {};
const FALLBACK = "https://placehold.co/500x350/1a1a2e/ffffff?text=Loading...";

// Fetch image from Wikipedia REST summary API (CORS-enabled, no API key needed)
async function getAnimalImage(wikiSlug) {
    if (imageCache[wikiSlug]) return imageCache[wikiSlug];

    try {
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiSlug)}`;
        const res = await fetch(url, {
            headers: { 'Api-User-Agent': 'AnimalExplorer/1.0' }
        });
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        const img = data?.thumbnail?.source || data?.originalimage?.source || null;
        imageCache[wikiSlug] = img;
        return img;
    } catch {
        imageCache[wikiSlug] = null;
        return null;
    }
}

// Lazy-load images as cards become visible
const observer = new IntersectionObserver((entries) => {
    entries.forEach(async (entry) => {
        if (entry.isIntersecting) {
            const card = entry.target;
            const slug = card.dataset.slug;
            const imgEl = card.querySelector('.card-img');
            if (imgEl && imgEl.dataset.loaded !== 'true') {
                imgEl.dataset.loaded = 'true';
                const src = await getAnimalImage(slug);
                if (src) {
                    imgEl.src = src;
                } else {
                    imgEl.src = `https://placehold.co/500x350/2c3e50/ecf0f1?text=${encodeURIComponent(card.dataset.name)}`;
                }
                observer.unobserve(card);
            }
        }
    });
}, { rootMargin: '200px' });

function displayAnimals(list) {
    resultsGrid.innerHTML = '';

    if (list.length === 0) {
        resultsGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#666;padding:40px 0;">No animals found. Try a different search.</p>';
        return;
    }

    list.forEach(animal => {
        const card = document.createElement('div');
        card.className = 'animal-card';
        card.dataset.slug = animal.wikiSlug;
        card.dataset.name = animal.name;

        card.innerHTML = `
            <img
                src="https://placehold.co/500x350/ecf0f1/95a5a6?text=..."
                alt="${animal.name}"
                class="card-img"
                data-loaded="false"
            >
            <h3>${animal.name}</h3>
            <span class="tag">${animal.type}</span>
        `;

        card.onclick = async () => {
            const imgSrc = imageCache[animal.wikiSlug] ||
                `https://placehold.co/500x350/2c3e50/ecf0f1?text=${encodeURIComponent(animal.name)}`;

            modalBody.innerHTML = `
                <img src="${imgSrc}" alt="${animal.name}" class="modal-img"
                     onerror="this.src='https://placehold.co/500x350/2c3e50/ecf0f1?text=${encodeURIComponent(animal.name)}'">
                <div class="modal-text">
                    <h2>${animal.name}</h2>
                    <span class="scientific">${animal.species}</span>
                    <p class="info-p">${animal.info}</p>
                    <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(animal.wikiSlug)}" target="_blank" class="wiki-link">Read on Wikipedia →</a>
                </div>
            `;
            modal.style.display = 'block';

            // Fetch full-res image for modal if not yet loaded
            if (!imageCache[animal.wikiSlug]) {
                const src = await getAnimalImage(animal.wikiSlug);
                if (src) {
                    const modalImg = modalBody.querySelector('.modal-img');
                    if (modalImg) modalImg.src = src;
                }
            }
        };

        resultsGrid.appendChild(card);
        observer.observe(card);
    });
}

function updateDisplay() {
    const search = searchInput.value.toLowerCase().trim();
    const type = filterType.value;

    const filtered = animals.filter(animal => {
        const matchesSearch =
            animal.name.toLowerCase().includes(search) ||
            animal.species.toLowerCase().includes(search);
        const matchesType = type === 'all' || animal.type === type;
        return matchesSearch && matchesType;
    });

    displayAnimals(filtered);
}

closeBtn.onclick = () => { modal.style.display = 'none'; };
window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
searchInput.addEventListener('input', updateDisplay);
filterType.addEventListener('change', updateDisplay);

displayAnimals(animals);
</script>
