<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos Sandbox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    background: #1a1a2e;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #gameCanvas {
    display: block;
    cursor: crosshair;
  }

  /* TOOLBAR */
  #toolbar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 70px;
    background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 100%);
    border-right: 2px solid #ff4444;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 4px;
    z-index: 100;
    overflow-y: auto;
  }

  #toolbar::-webkit-scrollbar { width: 3px; }
  #toolbar::-webkit-scrollbar-track { background: #0f0f23; }
  #toolbar::-webkit-scrollbar-thumb { background: #ff4444; }

  .tool-section-label {
    font-size: 7px;
    color: #ff6666;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 6px 0 2px;
    font-family: 'Share Tech Mono', monospace;
    text-align: center;
    padding: 0 4px;
  }

  .tool-btn {
    width: 52px;
    height: 52px;
    border: 1.5px solid #333355;
    background: #16162a;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    position: relative;
    gap: 2px;
  }

  .tool-btn:hover {
    border-color: #ff4444;
    background: #2a1a2e;
    transform: scale(1.05);
  }

  .tool-btn.active {
    border-color: #ff4444;
    background: #3a1a2e;
    box-shadow: 0 0 12px #ff444455;
  }

  .tool-btn .icon { font-size: 20px; line-height: 1; }
  .tool-btn .label {
    font-size: 6.5px;
    color: #aaa;
    text-align: center;
    line-height: 1.1;
    font-family: 'Share Tech Mono', monospace;
  }
  .tool-btn.active .label { color: #ff9999; }

  .divider {
    width: 45px;
    height: 1px;
    background: #333355;
    margin: 3px 0;
  }

  /* TOP HUD */
  #topbar {
    position: fixed;
    top: 0; left: 70px; right: 0;
    height: 44px;
    background: linear-gradient(90deg, #0f0f23dd, #1a1a3edd);
    border-bottom: 1.5px solid #ff4444;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  #gameTitle {
    font-family: 'Bangers', cursive;
    font-size: 22px;
    color: #ff4444;
    letter-spacing: 2px;
    text-shadow: 0 0 20px #ff4444aa;
    margin-right: 8px;
  }

  .hud-btn {
    background: #1a1a3e;
    border: 1.5px solid #444466;
    color: #ccc;
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    transition: all 0.15s;
  }
  .hud-btn:hover { border-color: #ff4444; color: #ff9999; }
  .hud-btn.active { border-color: #ff4444; color: #ff4444; background: #2a1a2e; }

  #gravBtn { color: #44aaff; border-color: #44aaff55; }
  #gravBtn.active { color: #ff8800; border-color: #ff880055; background: #2a1a0e; }

  .hud-sep { width: 1px; height: 24px; background: #333355; margin: 0 4px; }

  #bodyCount {
    font-size: 11px;
    color: #aaaacc;
    margin-left: auto;
  }
  #bodyCount span { color: #ff6666; }

  /* BRUSH SIZE */
  #brushPanel {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f0f23dd;
    border: 1.5px solid #333355;
    border-radius: 10px;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  #brushPanel label { font-size: 10px; color: #aaa; }

  #brushSize {
    -webkit-appearance: none;
    width: 100px; height: 4px;
    background: #333355;
    border-radius: 2px;
    outline: none;
  }
  #brushSize::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff4444;
    cursor: pointer;
    box-shadow: 0 0 6px #ff4444aa;
  }

  #brushVal { font-size: 10px; color: #ff9999; width: 22px; text-align: right; }

  /* TOOLTIP */
  #tooltip {
    position: fixed;
    background: #0f0f23ee;
    border: 1px solid #ff444488;
    color: #ffcccc;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 5px;
    pointer-events: none;
    z-index: 200;
    display: none;
    font-family: 'Share Tech Mono', monospace;
    white-space: nowrap;
  }

  /* SPAWN MENU for humanoids */
  #spawnMenu {
    position: fixed;
    left: 76px;
    top: 50px;
    background: #0f0f23ee;
    border: 1.5px solid #ff4444;
    border-radius: 10px;
    padding: 8px;
    z-index: 150;
    display: none;
    flex-direction: column;
    gap: 4px;
    backdrop-filter: blur(6px);
    min-width: 130px;
  }

  .spawn-opt {
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    color: #ccc;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .spawn-opt:hover { background: #2a1a2e; color: #ff9999; }

  /* EXPLOSION FLASH */
  #flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 300;
    transition: opacity 0.05s;
  }

  /* Stats panel */
  #statsPanel {
    position: fixed;
    right: 12px;
    top: 52px;
    background: #0f0f23cc;
    border: 1px solid #333355;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 10px;
    color: #7777aa;
    z-index: 100;
    line-height: 1.8;
    display: none;
  }
  #statsPanel.show { display: block; }
  #statsPanel span { color: #ff9999; }
</style>
</head>
<body>

<div id="flash"></div>
<div id="tooltip"></div>

<!-- TOOLBAR -->
<div id="toolbar">
  <div style="font-family:'Bangers',cursive;font-size:14px;color:#ff4444;letter-spacing:1px;margin-bottom:4px;">CS</div>

  <div class="tool-section-label">Spawn</div>
  <button class="tool-btn active" data-tool="human" data-tip="Human - ragdoll body">
    <div class="icon">🧍</div><div class="label">Human</div>
  </button>
  <button class="tool-btn" data-tool="zombie" data-tip="Zombie - walks toward humans">
    <div class="icon">🧟</div><div class="label">Zombie</div>
  </button>
  <button class="tool-btn" data-tool="melon" data-tip="Melon - bouncy squishy head">
    <div class="icon">🍉</div><div class="label">Melon</div>
  </button>
  <button class="tool-btn" data-tool="box" data-tip="Wooden Crate">
    <div class="icon">📦</div><div class="label">Crate</div>
  </button>
  <button class="tool-btn" data-tool="ball" data-tip="Rubber Ball">
    <div class="icon">🔴</div><div class="label">Ball</div>
  </button>
  <button class="tool-btn" data-tool="barrel" data-tip="Explosive Barrel - ignite it!">
    <div class="icon">🛢️</div><div class="label">Barrel</div>
  </button>

  <div class="divider"></div>
  <div class="tool-section-label">Weapons</div>

  <button class="tool-btn" data-tool="gun" data-tip="Pistol - shoot projectiles">
    <div class="icon">🔫</div><div class="label">Pistol</div>
  </button>
  <button class="tool-btn" data-tool="bomb" data-tip="Bomb - big explosion">
    <div class="icon">💣</div><div class="label">Bomb</div>
  </button>
  <button class="tool-btn" data-tool="rocket" data-tip="Rocket - flies then explodes">
    <div class="icon">🚀</div><div class="label">Rocket</div>
  </button>
  <button class="tool-btn" data-tool="laser" data-tip="Laser Beam - instant kill ray">
    <div class="icon">⚡</div><div class="label">Laser</div>
  </button>
  <button class="tool-btn" data-tool="nuke" data-tip="NUKE - massive explosion">
    <div class="icon">☢️</div><div class="label">Nuke</div>
  </button>
  <button class="tool-btn" data-tool="blackhole" data-tip="Black Hole - sucks everything in">
    <div class="icon">🌀</div><div class="label">B.Hole</div>
  </button>
  <button class="tool-btn" data-tool="freeze" data-tip="Freeze Ray - freeze objects">
    <div class="icon">❄️</div><div class="label">Freeze</div>
  </button>
  <button class="tool-btn" data-tool="flamethrower" data-tip="Flamethrower - spread fire">
    <div class="icon">🔥</div><div class="label">Flame</div>
  </button>
  <button class="tool-btn" data-tool="lightning" data-tip="Lightning Strike">
    <div class="icon">🌩️</div><div class="label">Storm</div>
  </button>

  <div class="divider"></div>
  <div class="tool-section-label">Forces</div>

  <button class="tool-btn" data-tool="push" data-tip="Push Force - repel objects">
    <div class="icon">💨</div><div class="label">Push</div>
  </button>
  <button class="tool-btn" data-tool="pull" data-tip="Pull Force - attract objects">
    <div class="icon">🧲</div><div class="label">Pull</div>
  </button>
  <button class="tool-btn" data-tool="spike" data-tip="Spike - impale objects">
    <div class="icon">📌</div><div class="label">Spike</div>
  </button>
  <button class="tool-btn" data-tool="shuriken" data-tip="Shuriken - flies and cuts">
    <div class="icon">⭐</div><div class="label">Shuriken</div>
  </button>
  <button class="tool-btn" data-tool="acid" data-tip="Acid - melts objects slowly">
    <div class="icon">🧪</div><div class="label">Acid</div>
  </button>

  <div class="divider"></div>
  <div class="tool-section-label">Build</div>

  <button class="tool-btn" data-tool="platform" data-tip="Draw platforms">
    <div class="icon">🟫</div><div class="label">Platform</div>
  </button>
  <button class="tool-btn" data-tool="eraser" data-tip="Erase platforms & objects">
    <div class="icon">🧹</div><div class="label">Erase</div>
  </button>
  <button class="tool-btn" data-tool="grab" data-tip="Grab & drag objects">
    <div class="icon">✋</div><div class="label">Grab</div>
  </button>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <div id="gameTitle">CHAOS SANDBOX</div>
  <div class="hud-sep"></div>
  <button class="hud-btn" id="gravBtn" onclick="toggleGravity()">🌍 Gravity: ON</button>
  <button class="hud-btn" onclick="togglePause()" id="pauseBtn">⏸ Pause</button>
  <button class="hud-btn" onclick="clearAll()">🗑 Clear</button>
  <button class="hud-btn" onclick="slowMo()" id="slowBtn">🐢 SlowMo</button>
  <button class="hud-btn" onclick="toggleStats()" id="statsBtn">📊 Stats</button>
  <div class="hud-sep"></div>
  <button class="hud-btn" onclick="spawnPreset('tower')" title="Spawn a tower of crates">🏗 Tower</button>
  <button class="hud-btn" onclick="spawnPreset('army')" title="Spawn an army of humans">⚔️ Army</button>
  <button class="hud-btn" onclick="spawnPreset('melons')" title="Raining melons!">🍉 Melon Rain</button>
  <div id="bodyCount" style="margin-left:auto">Bodies: <span id="bCount">0</span> | Objects: <span id="oCount">0</span></div>
</div>

<!-- BRUSH SIZE -->
<div id="brushPanel">
  <label>SIZE</label>
  <input type="range" id="brushSize" min="1" max="8" value="1" oninput="updateBrush(this.value)">
  <div id="brushVal">1</div>
</div>

<!-- SPAWN MENU -->
<div id="spawnMenu">
  <div style="font-size:9px;color:#666;padding:2px 4px;">SPAWN OPTIONS</div>
</div>

<!-- STATS -->
<div id="statsPanel" id="statsPanel">
  FPS: <span id="sFps">0</span><br>
  Bodies: <span id="sBodies">0</span><br>
  Particles: <span id="sParts">0</span><br>
  Platforms: <span id="sPlatforms">0</span><br>
  Frame: <span id="sFrame">0</span>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// ═══════════════════════════════════════════════
//  CHAOS SANDBOX - Full Physics Sandbox Engine
// ═══════════════════════════════════════════════

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Resize canvas
function resize() {
  canvas.width = window.innerWidth - 70;
  canvas.height = window.innerHeight;
  canvas.style.marginLeft = '70px';
  // Recreate ground
  ground.y = canvas.height - 30;
}
window.addEventListener('resize', () => { resize(); });
resize();

// ── PHYSICS STATE ──────────────────────────────
let gravity = 0.5;
let gravityOn = true;
let paused = false;
let slowMoOn = false;
let frameCount = 0;
let lastFps = 0;
let fps = 0;
let brushSize = 1;
let activeTool = 'human';
let dragging = null;
let dragOffX = 0, dragOffY = 0;
let mouseX = 0, mouseY = 0;
let isMouseDown = false;
let platformStart = null;
let laserActive = false;
let flameCooldown = 0;
let lightningCooldown = 0;

const ground = { y: canvas.height - 30, thickness: 30 };
const platforms = [];
const bodies = []; // ragdoll bodies
const objects = []; // boxes, balls, barrels
const particles = [];
const projectiles = [];
const effects = []; // visual only
const blackholes = [];
const acidPools = [];
const frozenSet = new WeakSet();

// ── COLORS ─────────────────────────────────────
const SKIN_TONES = ['#F5C5A3','#D4956A','#C68642','#8D5524','#FFDBAC'];
const HAIR_COLORS = ['#1a0800','#4a2c0c','#8B4513','#D4A017','#808080','#cc0000'];
const SHIRT_COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#ecf0f1'];
const BLOOD_COLOR = '#cc0000';

// ── RAGDOLL BODY ────────────────────────────────
class Ragdoll {
  constructor(x, y, type = 'human') {
    this.type = type; // human, zombie
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*2; this.vy = 0;
    this.dead = false;
    this.health = type === 'zombie' ? 200 : 100;
    this.onGround = false;
    this.frozen = false;
    this.burning = false;
    this.burnTimer = 0;
    this.acidTimer = 0;
    this.bleeding = false;
    this.bleedTimer = 0;
    this.ragdoll = false; // true = floppy
    this.skinTone = SKIN_TONES[Math.floor(Math.random()*SKIN_TONES.length)];
    this.hairColor = HAIR_COLORS[Math.floor(Math.random()*HAIR_COLORS.length)];
    this.shirtColor = SHIRT_COLORS[Math.floor(Math.random()*SHIRT_COLORS.length)];
    this.pantsColor = Math.random() > 0.5 ? '#2c3e50' : '#1a1a1a';
    // Limb angles for ragdoll
    this.headAngle = 0;
    this.torsoAngle = 0;
    this.lArmAngle = 0; this.rArmAngle = 0;
    this.lLegAngle = 0; this.rLegAngle = 0;
    this.lForeAngle = 0; this.rForeAngle = 0;
    this.walkCycle = Math.random()*Math.PI*2;
    this.zombieTarget = null;
    this.size = 1;
    this.id = Math.random();
    // Detached limbs
    this.limbs = { head: true, lArm: true, rArm: true, lLeg: true, rLeg: true };
    // Blood pools
    this.bloodPool = 0;
  }

  get radius() { return 10 * this.size; }

  update(dt) {
    if (this.frozen) return;
    if (paused) return;

    // Burning
    if (this.burning) {
      this.burnTimer -= dt;
      if (this.burnTimer <= 0) { this.burning = false; }
      else {
        this.health -= 0.3 * dt;
        if (Math.random() < 0.3) {
          spawnParticle(this.x + (Math.random()-0.5)*14, this.y - 10 + (Math.random()-0.5)*8, (Math.random()-0.5)*1.5, -2 - Math.random()*2, '#ff6600', 20 + Math.random()*20, 3 + Math.random()*3, 'fire');
        }
      }
    }

    // Acid
    if (this.acidTimer > 0) {
      this.acidTimer -= dt;
      this.health -= 0.5 * dt;
      this.size = Math.max(0.2, this.size - 0.0005 * dt);
      if (Math.random() < 0.2) {
        spawnParticle(this.x + (Math.random()-0.5)*20, this.y + (Math.random()-0.5)*20, (Math.random()-0.5)*0.5, -0.5, '#00ff44', 15, 2, 'smoke');
      }
    }

    // Bleeding
    if (this.bleeding && this.bleedTimer > 0) {
      this.bleedTimer -= dt;
      if (Math.random() < 0.4) {
        spawnParticle(this.x + (Math.random()-0.5)*10, this.y, (Math.random()-0.5)*1, 1+Math.random(), BLOOD_COLOR, 12, 2 + Math.random()*2, 'blood');
      }
    }

    if (this.health <= 0 && !this.dead) this.die();

    if (this.dead) {
      this.ragdoll = true;
      this.bloodPool = Math.min(this.bloodPool + 0.05 * dt, 20);
    }

    // Zombie AI
    if (this.type === 'zombie' && !this.dead && !this.ragdoll) {
      let closest = null, closestDist = 300;
      for (let b of bodies) {
        if (b === this || b.type === 'zombie' || b.dead) continue;
        const d = dist(this.x, this.y, b.x, b.y);
        if (d < closestDist) { closestDist = d; closest = b; }
      }
      this.zombieTarget = closest;
      if (closest) {
        const dir = closest.x < this.x ? -1 : 1;
        this.vx = dir * 0.6;
        if (closestDist < 20) {
          closest.health -= 0.5 * dt;
          closest.bleeding = true; closest.bleedTimer = 60;
        }
      } else {
        this.vx *= 0.95;
      }
    }

    // Physics
    if (!this.dead && !this.ragdoll) {
      // Walking animation
      this.walkCycle += 0.15;
    }

    if (gravityOn) this.vy += gravity * dt * 0.3;
    this.x += this.vx * dt * (slowMoOn ? 0.25 : 1);
    this.y += this.vy * dt * (slowMoOn ? 0.25 : 1);

    // Ragdoll wobble
    if (this.ragdoll) {
      this.torsoAngle += (Math.random()-0.5)*0.05;
      this.torsoAngle *= 0.95;
      this.headAngle += (Math.random()-0.5)*0.08;
      this.headAngle *= 0.92;
      this.lArmAngle += (Math.random()-0.5)*0.06; this.lArmAngle *= 0.93;
      this.rArmAngle += (Math.random()-0.5)*0.06; this.rArmAngle *= 0.93;
      this.lLegAngle += (Math.random()-0.5)*0.06; this.lLegAngle *= 0.93;
      this.rLegAngle += (Math.random()-0.5)*0.06; this.rLegAngle *= 0.93;
    }

    // Ground collision
    const groundY = getGroundY(this.x);
    if (this.y + this.radius*1.8 > groundY) {
      this.y = groundY - this.radius*1.8;
      this.vy *= -0.3;
      this.vx *= 0.85;
      this.onGround = true;
    } else { this.onGround = false; }

    // Platform collision
    for (let p of platforms) {
      if (collidePlatform(this, p)) break;
    }

    // Bounds
    if (this.x < 5) { this.x = 5; this.vx = Math.abs(this.vx)*0.5; }
    if (this.x > canvas.width - 5) { this.x = canvas.width-5; this.vx = -Math.abs(this.vx)*0.5; }

    // Blackhole pull
    for (let bh of blackholes) {
      const d = dist(this.x, this.y, bh.x, bh.y);
      if (d < bh.radius * 3 && d > 0.1) {
        const force = bh.strength / (d * d) * 800;
        this.vx += (bh.x - this.x) / d * force * dt;
        this.vy += (bh.y - this.y) / d * force * dt;
        if (d < bh.radius) { this.health = 0; }
      }
    }

    // Acid pool
    for (let a of acidPools) {
      if (dist(this.x, this.y, a.x, a.y) < a.radius) {
        this.acidTimer = Math.max(this.acidTimer, 60);
      }
    }
  }

  die() {
    this.dead = true;
    this.ragdoll = true;
    this.bleeding = true;
    this.bleedTimer = 120;
    // Explosion death - scatter limbs
    for (let i = 0; i < 6; i++) {
      spawnParticle(this.x + (Math.random()-0.5)*15, this.y + (Math.random()-0.5)*20,
        (Math.random()-0.5)*5, -3-Math.random()*3, BLOOD_COLOR, 30+Math.random()*30, 2+Math.random()*3, 'blood');
    }
  }

  draw() {
    const x = this.x, y = this.y;
    const s = this.size;
    const tint = this.frozen ? '#aaddff' : this.burning ? '#ff6600' : null;

    ctx.save();
    ctx.translate(x, y);
    if (this.ragdoll) ctx.rotate(this.torsoAngle);

    // Shadow
    if (!this.dead) {
      ctx.save();
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(0, this.radius*1.8 - (this.onGround ? 0 : 5), 12*s, 4*s, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // Legs
    if (this.limbs.lLeg) this.drawLimb(ctx, 0, 8*s, this.ragdoll ? this.lLegAngle : (this.dead ? 0.4 : Math.sin(this.walkCycle)*0.4), 18*s, 7*s, '#3a3a3a', s);
    if (this.limbs.rLeg) this.drawLimb(ctx, 0, 8*s, this.ragdoll ? this.rLegAngle : (this.dead ? -0.3 : -Math.sin(this.walkCycle)*0.4), 18*s, 7*s, '#3a3a3a', s, true);

    // Torso
    const torsoColor = tint || (this.type === 'zombie' ? '#3a5a2a' : this.shirtColor);
    ctx.fillStyle = torsoColor;
    ctx.beginPath();
    ctx.roundRect(-7*s, -10*s, 14*s, 20*s, 3);
    ctx.fill();

    // Arms
    if (this.limbs.lArm) this.drawLimb(ctx, -7*s, -6*s, this.ragdoll ? this.lArmAngle : (this.dead ? 0.8 : Math.sin(this.walkCycle+Math.PI)*0.3 + 0.2), 16*s, 5.5*s, tint||this.skinTone, s);
    if (this.limbs.rArm) this.drawLimb(ctx, 7*s, -6*s, this.ragdoll ? this.rArmAngle : (this.dead ? -0.6 : -Math.sin(this.walkCycle+Math.PI)*0.3 - 0.2), 16*s, 5.5*s, tint||this.skinTone, s, true);

    // Head
    if (this.limbs.head) {
      ctx.save();
      ctx.translate(0, -14*s);
      ctx.rotate(this.headAngle);
      // Neck
      ctx.fillStyle = tint || this.skinTone;
      ctx.fillRect(-3*s, 0, 6*s, 5*s);
      // Head shape
      ctx.fillStyle = tint || (this.type === 'zombie' ? '#6a8a5a' : this.skinTone);
      ctx.beginPath();
      ctx.ellipse(0, -6*s, 8*s, 9*s, 0, 0, Math.PI*2);
      ctx.fill();
      // Hair
      ctx.fillStyle = this.type === 'zombie' ? '#2a3a1a' : this.hairColor;
      ctx.beginPath();
      ctx.ellipse(0, -10*s, 8.5*s, 5*s, 0, Math.PI, 0);
      ctx.fill();
      // Eyes
      const eyeColor = this.type === 'zombie' ? '#ff3300' : '#1a1a1a';
      ctx.fillStyle = eyeColor;
      if (!this.dead && !this.ragdoll) {
        ctx.beginPath(); ctx.arc(-3*s, -7*s, 1.5*s, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3*s, -7*s, 1.5*s, 0, Math.PI*2); ctx.fill();
        // Whites
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-3*s-0.5, -7*s-0.5, 0.7*s, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3*s-0.5, -7*s-0.5, 0.7*s, 0, Math.PI*2); ctx.fill();
        // Mouth
        ctx.strokeStyle = this.type === 'zombie' ? '#660000' : '#8B4513';
        ctx.lineWidth = 1; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-2*s, -4*s); ctx.quadraticCurveTo(0, -3*s, 2*s, -4*s);
        ctx.stroke();
      } else {
        // X eyes
        ctx.strokeStyle = '#660000'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-4.5*s,-8.5*s); ctx.lineTo(-1.5*s,-5.5*s); ctx.moveTo(-4.5*s,-5.5*s); ctx.lineTo(-1.5*s,-8.5*s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(1.5*s,-8.5*s); ctx.lineTo(4.5*s,-5.5*s); ctx.moveTo(1.5*s,-5.5*s); ctx.lineTo(4.5*s,-8.5*s); ctx.stroke();
      }
      ctx.restore();
    }

    // Blood pool under dead
    if (this.dead && this.bloodPool > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#880000';
      ctx.beginPath();
      ctx.ellipse(0, 22*s, this.bloodPool*s, this.bloodPool*0.4*s, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // Health bar (for zombies)
    if (this.type === 'zombie' && !this.dead) {
      ctx.fillStyle = '#333';
      ctx.fillRect(-15, -30*s, 30, 4);
      ctx.fillStyle = `hsl(${this.health/2},80%,50%)`;
      ctx.fillRect(-15, -30*s, 30*this.health/200, 4);
    }

    ctx.restore();

    // Frozen ice overlay
    if (this.frozen) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#88ccff';
      ctx.beginPath();
      ctx.ellipse(x, y, 16*s, 28*s, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  drawLimb(ctx, ox, oy, angle, length, thickness, color, s, flip=false) {
    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(angle * (flip ? -1 : 1));
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-thickness/2, 0, thickness, length, thickness/2);
    ctx.fill();
    ctx.restore();
  }

  contains(mx, my) {
    const dx = mx - this.x, dy = my - this.y;
    return Math.sqrt(dx*dx + dy*dy) < 20 * this.size;
  }
}

// ── PHYSICAL OBJECT ─────────────────────────────
class PhysObject {
  constructor(x, y, type) {
    this.type = type;
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*1; this.vy = 0;
    this.angle = 0; this.spin = 0;
    this.onGround = false;
    this.burning = false; this.burnTimer = 0;
    this.frozen = false;
    this.acidTimer = 0;
    this.health = 100;
    this.exploded = false;
    this.id = Math.random();
    this.size = 1;

    // per-type
    switch(type) {
      case 'box': this.w=32; this.h=32; this.mass=2; this.bounce=0.3; this.color='#8B6914'; this.health=80; break;
      case 'ball': this.r=14; this.mass=1; this.bounce=0.7; this.color='#e74c3c'; this.health=50; break;
      case 'barrel': this.w=24; this.h=36; this.mass=3; this.bounce=0.2; this.color='#3a3a3a'; this.health=60; this.isExplosive=true; break;
      case 'melon': this.r=18; this.mass=2; this.bounce=0.5; this.color='#2ecc71'; this.stripeColor='#27ae60'; this.health=40; this.isMelon=true; this.squish=1; break;
      case 'rocket': this.w=10; this.h=28; this.mass=0.5; this.bounce=0; this.color='#e74c3c'; this.vx=0; this.vy=0; this.fuel=180; this.targetX=mouseX; this.targetY=mouseY; break;
    }
  }

  update(dt) {
    if (this.frozen) return;
    if (paused) return;

    if (this.burning) {
      this.burnTimer -= dt;
      this.health -= this.isExplosive ? 0.8*dt : 0.15*dt;
      if (Math.random() < 0.4) {
        spawnParticle(this.x+(Math.random()-0.5)*this.w||16, this.y-8, (Math.random()-0.5)*1.5, -1.5-Math.random()*2, '#ff6600', 25, 3+Math.random()*3, 'fire');
        spawnParticle(this.x+(Math.random()-0.5)*this.w||16, this.y-8, (Math.random()-0.5)*0.5, -1-Math.random(), '#333', 20, 4, 'smoke');
      }
      if (this.burnTimer <= 0) this.burning = false;
    }

    if (this.acidTimer > 0) {
      this.acidTimer -= dt;
      this.health -= 0.3*dt;
      this.size = Math.max(0.1, this.size - 0.001*dt);
      if (this.h) this.h = Math.max(2, this.h - 0.05*dt);
      if (this.w) this.w = Math.max(2, this.w - 0.05*dt);
    }

    if (this.health <= 0 && !this.exploded) {
      this.exploded = true;
      if (this.isExplosive) triggerExplosion(this.x, this.y, 80, 8);
      if (this.isMelon) {
        // Melon splat
        for (let i = 0; i < 12; i++) {
          const angle = (i/12)*Math.PI*2;
          spawnParticle(this.x + Math.cos(angle)*10, this.y + Math.sin(angle)*10,
            Math.cos(angle)*4, Math.sin(angle)*4, '#e74c3c', 40, 4+Math.random()*4, 'blood');
          spawnParticle(this.x + Math.cos(angle)*8, this.y + Math.sin(angle)*8,
            Math.cos(angle)*3, Math.sin(angle)*3, '#2ecc71', 30, 5+Math.random()*4, 'blood');
        }
      }
      for (let i = 0; i < 5; i++) {
        spawnParticle(this.x+(Math.random()-0.5)*20, this.y+(Math.random()-0.5)*20,
          (Math.random()-0.5)*3, (Math.random()-0.5)*3, this.color, 30, 3+Math.random()*3, 'debris');
      }
      return;
    }

    // Rocket logic
    if (this.type === 'rocket' && this.fuel > 0) {
      this.fuel -= dt;
      const tdx = this.targetX - this.x, tdy = this.targetY - this.y;
      const td = Math.sqrt(tdx*tdx+tdy*tdy);
      if (td > 5) {
        this.vx += tdx/td * 0.6 * dt;
        this.vy += tdy/td * 0.6 * dt;
      }
      const spd = Math.sqrt(this.vx*this.vx+this.vy*this.vy);
      if (spd > 12) { this.vx = this.vx/spd*12; this.vy = this.vy/spd*12; }
      this.angle = Math.atan2(this.vy, this.vx) + Math.PI/2;
      spawnParticle(this.x, this.y+15, (Math.random()-0.5)*2, 2, '#ff6600', 15, 3, 'fire');
      spawnParticle(this.x, this.y+15, (Math.random()-0.5)*1, 1.5, '#ffcc00', 10, 2, 'fire');
      if (td < 20) { this.health = 0; this.isExplosive = true; }
      return;
    }

    // Melon squish
    if (this.isMelon) {
      this.squish = 1 + Math.sin(frameCount*0.1)*0.05;
    }

    if (gravityOn) this.vy += gravity * dt * 0.3;
    this.x += this.vx * dt * (slowMoOn ? 0.25 : 1);
    this.y += this.vy * dt * (slowMoOn ? 0.25 : 1);
    this.angle += this.spin * dt * (slowMoOn ? 0.25 : 1);
    this.spin *= 0.98;

    // Ground
    const groundY = getGroundY(this.x);
    const h = this.r ? this.r : this.h/2 * this.size;
    if (this.y + h > groundY) {
      this.y = groundY - h;
      if (Math.abs(this.vy) > 2) this.spin += this.vx * 0.03;
      this.vy *= -this.bounce;
      this.vx *= 0.88;
      this.onGround = true;
      if (this.isMelon && Math.abs(this.vy) > 3) {
        // Bounce splat effect
        for (let i = 0; i < 4; i++) spawnParticle(this.x+(Math.random()-0.5)*20, groundY, (Math.random()-0.5)*3, -1-Math.random()*2, '#2ecc71', 20, 2, 'blood');
      }
    } else { this.onGround = false; }

    // Platform
    for (let p of platforms) collidePlatformObj(this, p);

    // Bounds
    if (this.x < 0) { this.x = 0; this.vx = Math.abs(this.vx)*0.5; this.spin *= -0.5; }
    if (this.x > canvas.width) { this.x = canvas.width; this.vx = -Math.abs(this.vx)*0.5; this.spin *= -0.5; }

    // Blackhole
    for (let bh of blackholes) {
      const d = dist(this.x, this.y, bh.x, bh.y);
      if (d < bh.radius * 4 && d > 0.1) {
        const force = bh.strength / (d * d) * 1000;
        this.vx += (bh.x - this.x) / d * force * dt;
        this.vy += (bh.y - this.y) / d * force * dt;
        if (d < bh.radius * 0.8) { this.health = 0; }
      }
    }

    // Acid pool
    for (let a of acidPools) {
      if (dist(this.x, this.y, a.x, a.y) < a.radius) this.acidTimer = Math.max(this.acidTimer, 60);
    }
  }

  draw() {
    if (this.exploded) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    const s = this.size;

    if (this.frozen) { ctx.globalAlpha = 0.8; }

    if (this.type === 'ball') {
      const grad = ctx.createRadialGradient(-4*s,-4*s,1,0,0,this.r*s);
      grad.addColorStop(0,'#ff8888'); grad.addColorStop(1,'#cc0000');
      ctx.fillStyle = this.frozen ? '#aaddff' : grad;
      ctx.beginPath(); ctx.arc(0, 0, this.r*s, 0, Math.PI*2); ctx.fill();
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.ellipse(-4*s, -5*s, 4*s, 3*s, -0.5, 0, Math.PI*2); ctx.fill();
    } else if (this.type === 'melon') {
      // Melon - oval with stripes
      ctx.save();
      ctx.scale(1, this.squish||1);
      const r = this.r*s;
      // Main body
      ctx.fillStyle = this.frozen ? '#aaddff' : '#2ecc71';
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      // Stripes
      ctx.strokeStyle = this.stripeColor; ctx.lineWidth = 2.5;
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2;
        ctx.save(); ctx.rotate(a);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r, 0); ctx.stroke();
        ctx.restore();
      }
      // Inner flesh (if health < 50%)
      if (this.health < 20) {
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.arc(0,0,r*0.7,0,Math.PI*2); ctx.fill();
      }
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.ellipse(-4*s,-5*s,5*s,3*s,-0.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if (this.type === 'box') {
      const hw = this.w/2*s, hh = this.h/2*s;
      // Wood grain
      ctx.fillStyle = this.frozen ? '#aaddff' : this.color;
      ctx.fillRect(-hw, -hh, this.w*s, this.h*s);
      // Grain lines
      if (!this.frozen) {
        ctx.strokeStyle = '#7a5a0e'; ctx.lineWidth = 0.5; ctx.globalAlpha = 0.5;
        for (let i = -hw+4; i < hw; i+=8) { ctx.beginPath(); ctx.moveTo(i,-hh); ctx.lineTo(i,hh); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }
      // Border
      ctx.strokeStyle = '#5a3a08'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-hw,-hh,this.w*s,this.h*s);
      // Cross braces
      ctx.beginPath(); ctx.moveTo(-hw,-hh); ctx.lineTo(hw,hh); ctx.moveTo(hw,-hh); ctx.lineTo(-hw,hh); ctx.stroke();
    } else if (this.type === 'barrel') {
      const hw = this.w/2*s, hh = this.h/2*s;
      // Body
      ctx.fillStyle = this.frozen ? '#aaddff' : '#3a3a3a';
      ctx.beginPath(); ctx.roundRect(-hw,-hh,this.w*s,this.h*s,6); ctx.fill();
      // Stripes
      ctx.fillStyle = '#cc2200'; ctx.fillRect(-hw, -5*s, this.w*s, 10*s);
      ctx.fillStyle = '#555'; ctx.fillRect(-hw, -hh, this.w*s, 4*s);
      ctx.fillRect(-hw, hh-4*s, this.w*s, 4*s);
      // Skull on explosive
      ctx.fillStyle = '#ff4400'; ctx.font = `${12*s}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('☠', 0, 0);
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(-hw,-hh,this.w*s,this.h*s,6); ctx.stroke();
    } else if (this.type === 'rocket') {
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(-5*s,-14*s,10*s,28*s);
      ctx.fillStyle = '#888';
      ctx.beginPath();ctx.moveTo(-5*s,-14*s);ctx.lineTo(0,-22*s);ctx.lineTo(5*s,-14*s);ctx.fill();
      ctx.fillStyle = '#cc2200';
      ctx.beginPath();ctx.moveTo(-5*s,14*s);ctx.lineTo(-10*s,20*s);ctx.lineTo(-5*s,10*s);ctx.fill();
      ctx.beginPath();ctx.moveTo(5*s,14*s);ctx.lineTo(10*s,20*s);ctx.lineTo(5*s,10*s);ctx.fill();
    }

    // Burning glow
    if (this.burning) {
      ctx.globalAlpha = 0.25 + Math.random()*0.1;
      ctx.fillStyle = '#ff6600';
      const r = this.r || Math.max(this.w,this.h)/2;
      ctx.beginPath(); ctx.arc(0,0,r*1.3,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // Ice overlay
    if (this.frozen) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#88ccff';
      ctx.beginPath();
      const r = this.r || Math.max(this.w,this.h)/2;
      ctx.arc(this.x, this.y, r*1.3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  contains(mx, my) {
    const dx = mx-this.x, dy = my-this.y;
    if (this.r) return Math.sqrt(dx*dx+dy*dy) < this.r;
    return Math.abs(dx) < this.w/2 && Math.abs(dy) < this.h/2;
  }
}

// ── PARTICLE ────────────────────────────────────
class Particle {
  constructor(x, y, vx, vy, color, life, size, type='generic') {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.color=color; this.life=life; this.maxLife=life;
    this.size=size; this.type=type;
  }
  update(dt) {
    if (paused) return;
    if (gravityOn && this.type !== 'smoke') this.vy += 0.18*dt;
    this.x += this.vx*(slowMoOn?0.25:1)*dt;
    this.y += this.vy*(slowMoOn?0.25:1)*dt;
    this.vx *= 0.96; this.vy *= 0.97;
    this.life -= dt;
    const groundY = getGroundY(this.x);
    if (this.type === 'blood' && this.y > groundY) { this.y = groundY; this.vy = 0; this.vx *= 0.5; }
  }
  draw() {
    const alpha = Math.max(0, this.life/this.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    if (this.type === 'smoke') {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      const r = this.size * (2 - this.life/this.maxLife);
      ctx.arc(this.x, this.y, r, 0, Math.PI*2);
      ctx.fill();
    } else if (this.type === 'fire') {
      const grad = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size);
      grad.addColorStop(0,'#ffff00'); grad.addColorStop(0.5,this.color); grad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
    } else if (this.type === 'spark') {
      ctx.strokeStyle = this.color; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x-this.vx*3, this.y-this.vy*3); ctx.stroke();
    } else {
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size*alpha, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── BLACKHOLE ───────────────────────────────────
class BlackHole {
  constructor(x, y) {
    this.x=x; this.y=y; this.radius=40; this.strength=12; this.life=600; this.angle=0;
  }
  update(dt) {
    if(paused)return;
    this.angle+=0.04*dt;
    this.life-=dt;
    // Suck particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      const d=dist(p.x,p.y,this.x,this.y);
      if(d<this.radius*3&&d>0.1){
        const force=this.strength/(d*d)*300;
        p.vx+=(this.x-p.x)/d*force*dt;
        p.vy+=(this.y-p.y)/d*force*dt;
        if(d<this.radius*0.6)particles.splice(i,1);
      }
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x,this.y);
    // Accretion disk
    const rings = 5;
    for(let i=rings;i>0;i--){
      ctx.save();
      ctx.rotate(this.angle*(i%2===0?1:-1)*0.5);
      const r=this.radius*(0.5+i*0.15);
      const alpha=0.15-i*0.02;
      ctx.strokeStyle=`rgba(${100+i*30},${50+i*20},${200+i*10},${alpha})`;
      ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    // Core
    const grad=ctx.createRadialGradient(0,0,0,0,0,this.radius);
    grad.addColorStop(0,'rgba(0,0,0,1)');
    grad.addColorStop(0.6,'rgba(20,0,40,0.9)');
    grad.addColorStop(1,'rgba(100,0,200,0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(0,0,this.radius*1.1,0,Math.PI*2); ctx.fill();
    // Glow ring
    ctx.shadowColor='#8800ff'; ctx.shadowBlur=20;
    ctx.strokeStyle='#aa44ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

// ── ACID POOL ────────────────────────────────────
class AcidPool {
  constructor(x, y) {
    this.x=x; this.y=y; this.radius=30; this.life=400; this.phase=Math.random()*Math.PI*2;
  }
  update(dt) {
    if(paused)return;
    this.life-=dt;
    this.phase+=0.05*dt;
    if(Math.random()<0.15){
      spawnParticle(this.x+(Math.random()-0.5)*this.radius*2, this.y-2, (Math.random()-0.5)*0.5, -0.8-Math.random()*0.5, '#00ff44', 20, 2, 'smoke');
    }
  }
  draw() {
    ctx.save();
    ctx.globalAlpha=0.65;
    const grad=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.radius);
    grad.addColorStop(0,'rgba(50,255,100,0.9)');
    grad.addColorStop(1,'rgba(0,200,50,0.2)');
    ctx.fillStyle=grad;
    // Bubbling effect
    const wobble=Math.sin(this.phase)*3;
    ctx.beginPath();
    ctx.ellipse(this.x,this.y,this.radius+wobble,this.radius*0.4,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ── HELPERS ─────────────────────────────────────
function dist(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;return Math.sqrt(dx*dx+dy*dy);}

function getGroundY(x) {
  // Could be wavy in future; flat for now
  return ground.y;
}

function spawnParticle(x,y,vx,vy,color,life,size,type='generic') {
  if(particles.length < 2000)
    particles.push(new Particle(x,y,vx,vy,color,life,size,type));
}

function triggerExplosion(x, y, radius, force) {
  // Flash
  const flashEl = document.getElementById('flash');
  flashEl.style.opacity = '0.6';
  setTimeout(()=>{flashEl.style.opacity='0';}, 50);

  // Shockwave particles
  for(let i=0;i<30;i++){
    const a=(i/30)*Math.PI*2;
    spawnParticle(x+Math.cos(a)*5,y+Math.sin(a)*5,Math.cos(a)*6,Math.sin(a)*6,'#ff6600',40+Math.random()*20,4+Math.random()*4,'fire');
  }
  for(let i=0;i<20;i++){
    const a=(i/20)*Math.PI*2;
    spawnParticle(x,y,Math.cos(a)*8*Math.random(),Math.sin(a)*8*Math.random(),'#ff4400',30,5,'fire');
    spawnParticle(x,y,(Math.random()-0.5)*10,-(Math.random()*8),'#333',50,5,'smoke');
  }
  for(let i=0;i<15;i++){
    spawnParticle(x+(Math.random()-0.5)*20,y+(Math.random()-0.5)*20,(Math.random()-0.5)*12,-(Math.random()*8),'#ffcc00',25,3,'spark');
  }

  // Affect bodies & objects
  for(let b of bodies){
    const d=dist(b.x,b.y,x,y);
    if(d<radius*1.5){
      const f=(1-d/(radius*1.5))*force;
      const angle=Math.atan2(b.y-y,b.x-x);
      b.vx+=Math.cos(angle)*f*3;
      b.vy+=Math.sin(angle)*f*3;
      b.ragdoll=true;
      if(d<radius*0.6){b.health-=80;b.burning=true;b.burnTimer=120;}
      else if(d<radius){b.health-=30;b.bleeding=true;b.bleedTimer=80;}
    }
  }
  for(let o of objects){
    const d=dist(o.x,o.y,x,y);
    if(d<radius*1.5){
      const f=(1-d/(radius*1.5))*force;
      const angle=Math.atan2(o.y-y,o.x-x);
      o.vx+=Math.cos(angle)*f*4;
      o.vy+=Math.sin(angle)*f*4;
      o.spin+=(Math.random()-0.5)*0.5;
      if(d<radius*0.7){o.health-=50;if(o.isExplosive&&!o.exploded)o.health=0;}
      else o.health-=20;
      if(!o.burning){o.burning=true;o.burnTimer=150;}
    }
  }

  // Camera shake
  shake(radius*0.2);
}

let shakeX=0,shakeY=0,shakeDecay=0;
function shake(intensity){shakeX=(Math.random()-0.5)*intensity;shakeY=(Math.random()-0.5)*intensity;shakeDecay=intensity;}

function collidePlatform(body, p) {
  const bx=body.x, by=body.y, br=body.radius||12;
  if(bx > p.x1-br && bx < p.x2+br) {
    const minY=Math.min(p.y1,p.y2), maxY=Math.max(p.y1,p.y2);
    const ty=p.y1+(p.y2-p.y1)*(bx-p.x1)/(p.x2-p.x1+0.001);
    if(by+br > ty-6 && by+br < ty+12 && body.vy >= 0) {
      body.y = ty - br;
      body.vy *= -0.2;
      body.vx *= 0.87;
      return true;
    }
  }
  return false;
}

function collidePlatformObj(obj, p) {
  const r=obj.r||Math.max(obj.w||0,obj.h||0)/2;
  if(obj.x > p.x1-r && obj.x < p.x2+r) {
    const ty=p.y1+(p.y2-p.y1)*(obj.x-p.x1)/(p.x2-p.x1+0.001);
    if(obj.y+r > ty-6 && obj.y+r < ty+12 && obj.vy >= 0) {
      obj.y=ty-r;
      obj.vy*=-obj.bounce;
      obj.vx*=0.85;
    }
  }
}

// ── TOOL ACTIONS ─────────────────────────────────
function useTool(x, y, down=true) {
  switch(activeTool) {
    case 'human':
      for(let i=0;i<brushSize;i++){
        const ox=(Math.random()-0.5)*brushSize*20, oy=(Math.random()-0.5)*brushSize*10;
        bodies.push(new Ragdoll(x+ox, y+oy, 'human'));
      }
      break;
    case 'zombie':
      for(let i=0;i<brushSize;i++){
        const ox=(Math.random()-0.5)*brushSize*20, oy=(Math.random()-0.5)*brushSize*10;
        bodies.push(new Ragdoll(x+ox, y+oy, 'zombie'));
      }
      break;
    case 'melon':
      for(let i=0;i<brushSize;i++){
        const ox=(Math.random()-0.5)*brushSize*25, oy=(Math.random()-0.5)*brushSize*15;
        objects.push(new PhysObject(x+ox, y+oy, 'melon'));
      }
      break;
    case 'box':
      for(let i=0;i<brushSize;i++){
        const ox=(Math.random()-0.5)*brushSize*30, oy=(Math.random()-0.5)*brushSize*15;
        objects.push(new PhysObject(x+ox, y+oy, 'box'));
      }
      break;
    case 'ball':
      for(let i=0;i<brushSize;i++){
        const o=new PhysObject(x+(Math.random()-0.5)*brushSize*25, y+(Math.random()-0.5)*brushSize*15, 'ball');
        o.vx=(Math.random()-0.5)*4; o.vy=-3-Math.random()*4;
        objects.push(o);
      }
      break;
    case 'barrel':
      for(let i=0;i<brushSize;i++){
        objects.push(new PhysObject(x+(Math.random()-0.5)*brushSize*30, y+(Math.random()-0.5)*brushSize*15, 'barrel'));
      }
      break;
    case 'gun':
      shootProjectile(x, y);
      break;
    case 'bomb':
      triggerExplosion(x, y, 100, 12);
      break;
    case 'nuke':
      // Massive explosion
      triggerExplosion(x, y, 300, 25);
      setTimeout(()=>triggerExplosion(x+50,y+30,200,15),80);
      setTimeout(()=>triggerExplosion(x-60,y+20,200,15),130);
      for(let i=0;i<50;i++){
        setTimeout(()=>{
          const ox=(Math.random()-0.5)*350, oy=(Math.random()-0.5)*100;
          spawnParticle(x+ox,y+oy,(Math.random()-0.5)*10,-8-Math.random()*8,'#ff6600',80,6+Math.random()*6,'fire');
          spawnParticle(x+ox,y+oy,(Math.random()-0.5)*5,-5-Math.random()*5,'#888',100,8,'smoke');
        },Math.random()*400);
      }
      break;
    case 'rocket':
      const r = new PhysObject(x, y-20, 'rocket');
      r.targetX = mouseX; r.targetY = mouseY;
      objects.push(r);
      break;
    case 'blackhole':
      blackholes.push(new BlackHole(x, y));
      break;
    case 'freeze':
      freezeArea(x, y, 80 * brushSize);
      break;
    case 'flamethrower':
      flameArea(x, y);
      break;
    case 'lightning':
      lightningStrike(x, y);
      break;
    case 'laser':
      fireLaser(x, y);
      break;
    case 'push':
      pushArea(x, y, -1);
      break;
    case 'pull':
      pushArea(x, y, 1);
      break;
    case 'spike':
      spikeArea(x, y);
      break;
    case 'shuriken':
      throwShuriken(x, y);
      break;
    case 'acid':
      acidPools.push(new AcidPool(x, y));
      break;
    case 'eraser':
      eraseArea(x, y, 30*brushSize);
      break;
  }
}

function shootProjectile(x, y) {
  // Shoot toward mouse
  const dx=mouseX-x, dy=mouseY-y;
  const d=Math.sqrt(dx*dx+dy*dy)||1;
  const speed=20;
  projectiles.push({
    x, y, vx:dx/d*speed, vy:dy/d*speed,
    r:4, color:'#ffdd44', life:60, type:'bullet'
  });
  // Muzzle flash
  for(let i=0;i<5;i++) spawnParticle(x,y,(Math.random()-0.5)*4,(Math.random()-0.5)*4,'#ffcc00',8,2,'spark');
}

function freezeArea(cx, cy, radius) {
  for(let b of bodies){
    if(dist(b.x,b.y,cx,cy)<radius){b.frozen=true;b.vx=0;b.vy=0;}
  }
  for(let o of objects){
    if(dist(o.x,o.y,cx,cy)<radius){o.frozen=true;o.vx=0;o.vy=0;o.spin=0;}
  }
  // Ice particles
  for(let i=0;i<20;i++) spawnParticle(cx+(Math.random()-0.5)*radius*2,cy+(Math.random()-0.5)*radius*2,(Math.random()-0.5)*3,(Math.random()-0.5)*3,'#aaddff',30,3+Math.random()*3,'generic');
}

function flameArea(cx, cy) {
  const radius=40*brushSize;
  for(let i=0;i<8*brushSize;i++){
    const a=Math.random()*Math.PI*2;
    spawnParticle(cx+Math.cos(a)*10,cy+Math.sin(a)*10,Math.cos(a)*3+((Math.random()-0.5)*2),Math.sin(a)*3-2,'#ff6600',30+Math.random()*20,4+Math.random()*3,'fire');
    spawnParticle(cx,cy,(Math.random()-0.5)*2,-1-Math.random(),'#444',25,5,'smoke');
  }
  for(let b of bodies){
    if(dist(b.x,b.y,cx,cy)<radius){b.burning=true;b.burnTimer=Math.max(b.burnTimer,120);}
  }
  for(let o of objects){
    if(dist(o.x,o.y,cx,cy)<radius){o.burning=true;o.burnTimer=Math.max(o.burnTimer,120);}
  }
}

function lightningStrike(cx, cy) {
  // Draw lightning bolt
  effects.push({type:'lightning',x:cx,y:0,tx:cx,ty:cy,life:15});
  // Affect nearby
  const radius=60*brushSize;
  for(let b of bodies){
    if(dist(b.x,b.y,cx,cy)<radius){
      b.health-=60;b.ragdoll=true;
      b.vx+=(Math.random()-0.5)*15;b.vy-=8+Math.random()*5;
      b.bleeding=true;b.bleedTimer=60;
    }
  }
  for(let o of objects){
    if(dist(o.x,o.y,cx,cy)<radius){
      o.health-=40;o.vx+=(Math.random()-0.5)*10;o.vy-=5;
      if(o.isExplosive)o.health=0;
    }
  }
  for(let i=0;i<20;i++) spawnParticle(cx+(Math.random()-0.5)*40,cy+(Math.random()-0.5)*40,(Math.random()-0.5)*8,(Math.random()-0.5)*8,'#ffff00',15,2,'spark');
}

function fireLaser(cx, cy) {
  // Laser beam from left to right at mouse Y
  effects.push({type:'laser',y:cy,life:20,x:0,tx:canvas.width});
  // Destroy everything at that Y
  for(let b of bodies){
    if(Math.abs(b.y-cy)<20){b.health=0;b.ragdoll=true;}
  }
  for(let o of objects){
    if(Math.abs(o.y-cy)<25){o.health=0;}
  }
}

function pushArea(cx, cy, direction) {
  const radius=60*brushSize;
  const force=15;
  for(let b of bodies){
    const d=dist(b.x,b.y,cx,cy);
    if(d<radius&&d>0.1){
      const f=(1-d/radius)*force*direction;
      b.vx+=(b.x-cx)/d*f;
      b.vy+=(b.y-cy)/d*f;
      b.ragdoll=true;
    }
  }
  for(let o of objects){
    const d=dist(o.x,o.y,cx,cy);
    if(d<radius&&d>0.1){
      const f=(1-d/radius)*force*direction;
      o.vx+=(o.x-cx)/d*f;
      o.vy+=(o.y-cy)/d*f;
      o.spin+=(Math.random()-0.5)*0.3;
    }
  }
  // Wind particles
  for(let i=0;i<8;i++) spawnParticle(cx+(Math.random()-0.5)*40,cy+(Math.random()-0.5)*40,(Math.random()-0.5)*5*(direction===1?-1:1),(Math.random()-0.5)*3,'rgba(150,200,255,0.5)',15,3,'smoke');
}

function spikeArea(cx, cy) {
  for(let b of bodies){
    if(dist(b.x,b.y,cx,cy)<30){
      b.health-=80;b.ragdoll=true;b.bleeding=true;b.bleedTimer=100;
      b.vy=-3;
    }
  }
  for(let o of objects){
    if(dist(o.x,o.y,cx,cy)<35){o.health-=60;}
  }
  effects.push({type:'spike',x:cx,y:cy,life:30});
  for(let i=0;i<10;i++) spawnParticle(cx+(Math.random()-0.5)*15,cy,(Math.random()-0.5)*3,-3-Math.random()*3,BLOOD_COLOR,20,2,'blood');
}

function throwShuriken(cx, cy) {
  const dx=mouseX-cx, dy=mouseY-cy;
  const d=Math.sqrt(dx*dx+dy*dy)||1;
  const speed=18;
  projectiles.push({
    x:cx, y:cy, vx:dx/d*speed, vy:dy/d*speed,
    r:8, color:'#aaaaaa', life:120, type:'shuriken', angle:0
  });
}

function eraseArea(cx, cy, radius) {
  for(let i=bodies.length-1;i>=0;i--){
    if(dist(bodies[i].x,bodies[i].y,cx,cy)<radius) bodies.splice(i,1);
  }
  for(let i=objects.length-1;i>=0;i--){
    if(dist(objects[i].x,objects[i].y,cx,cy)<radius) objects.splice(i,1);
  }
  for(let i=platforms.length-1;i>=0;i--){
    const p=platforms[i];
    const mx=(p.x1+p.x2)/2, my=(p.y1+p.y2)/2;
    if(dist(mx,my,cx,cy)<radius) platforms.splice(i,1);
  }
  for(let i=blackholes.length-1;i>=0;i--){
    if(dist(blackholes[i].x,blackholes[i].y,cx,cy)<radius) blackholes.splice(i,1);
  }
  for(let i=acidPools.length-1;i>=0;i--){
    if(dist(acidPools[i].x,acidPools[i].y,cx,cy)<radius) acidPools.splice(i,1);
  }
}

// ── PROJECTILE UPDATE ────────────────────────────
function updateProjectiles(dt) {
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.x+=p.vx*(slowMoOn?0.25:1)*dt;
    p.y+=p.vy*(slowMoOn?0.25:1)*dt;
    if(gravityOn&&p.type==='bullet') p.vy+=0.3*dt;
    if(p.type==='shuriken'){p.angle+=0.4*(slowMoOn?0.25:1)*dt;}
    p.life-=dt;

    // Trail
    if(p.type==='bullet') spawnParticle(p.x,p.y,0,0,'#ffdd44',5,2,'generic');
    if(p.type==='shuriken') spawnParticle(p.x,p.y,(Math.random()-0.5)*1,(Math.random()-0.5)*1,'#cccccc',8,1.5,'spark');

    // Hit bodies
    for(let b of bodies){
      if(dist(p.x,p.y,b.x,b.y)<20){
        if(p.type==='bullet'){b.health-=30;b.ragdoll=true;b.bleeding=true;b.bleedTimer=80;b.vx+=p.vx*0.4;b.vy+=p.vy*0.4;}
        if(p.type==='shuriken'){b.health-=50;b.ragdoll=true;b.bleeding=true;b.bleedTimer=120;}
        projectiles.splice(i,1); break;
      }
    }
    // Hit objects
    for(let o of objects){
      if(o.contains&&o.contains(p.x,p.y)){
        o.health-=30;o.vx+=p.vx*0.3;o.vy+=p.vy*0.3;
        if(o.isExplosive)o.health=0;
        projectiles.splice(i,1); break;
      }
    }

    // Off screen or expired
    if(!projectiles[i]||p.life<=0||p.x<0||p.x>canvas.width||p.y>canvas.height){
      if(projectiles[i]) projectiles.splice(i,1);
    }
  }
}

// ── DRAW PROJECTILES ─────────────────────────────
function drawProjectiles() {
  for(let p of projectiles){
    ctx.save();
    ctx.translate(p.x,p.y);
    if(p.type==='shuriken'){
      ctx.rotate(p.angle);
      ctx.fillStyle='#cccccc';
      for(let i=0;i<4;i++){
        ctx.save();ctx.rotate((i/4)*Math.PI*2);
        ctx.beginPath();ctx.moveTo(0,-p.r);ctx.lineTo(p.r/3,0);ctx.lineTo(0,p.r/4);ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle='#888';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle=p.color;
      ctx.shadowColor=p.color; ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

// ── DRAW EFFECTS ─────────────────────────────────
function updateDrawEffects(dt) {
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];
    e.life-=dt;
    if(e.life<=0){effects.splice(i,1);continue;}
    const alpha=e.life/30;
    if(e.type==='lightning'){
      ctx.save();ctx.globalAlpha=alpha;
      ctx.strokeStyle=`rgba(200,220,255,${alpha})`;
      ctx.lineWidth=2+Math.random()*3;
      ctx.shadowColor='#88aaff';ctx.shadowBlur=15;
      // Jagged bolt
      ctx.beginPath();
      let ly=0, lx=e.x;
      ctx.moveTo(lx,ly);
      while(ly<e.ty){
        ly+=20+Math.random()*20;
        lx=e.tx+(Math.random()-0.5)*40;
        ctx.lineTo(lx,ly);
      }
      ctx.stroke();
      ctx.restore();
    } else if(e.type==='laser'){
      ctx.save();
      const a=e.life/20;
      ctx.globalAlpha=a;
      ctx.strokeStyle='#ff4400';ctx.lineWidth=3+Math.random()*2;
      ctx.shadowColor='#ff2200';ctx.shadowBlur=20;
      ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.y);ctx.stroke();
      ctx.strokeStyle='rgba(255,200,100,0.5)';ctx.lineWidth=10;
      ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.y);ctx.stroke();
      ctx.restore();
    } else if(e.type==='spike'){
      ctx.save();ctx.globalAlpha=alpha;
      ctx.fillStyle='#888888';
      ctx.strokeStyle='#444';ctx.lineWidth=1;
      for(let j=0;j<5;j++){
        const sx=e.x+(j-2)*12;
        ctx.beginPath();ctx.moveTo(sx,e.y);ctx.lineTo(sx+5,e.y-25);ctx.lineTo(sx+10,e.y);ctx.fill();ctx.stroke();
      }
      ctx.restore();
    }
  }
}

// ── GROUND / BACKGROUND DRAW ─────────────────────
function drawBackground() {
  // Sky gradient
  const skyGrad=ctx.createLinearGradient(0,0,0,canvas.height);
  skyGrad.addColorStop(0,'#1a1a2e');
  skyGrad.addColorStop(0.7,'#16213e');
  skyGrad.addColorStop(1,'#0f3460');
  ctx.fillStyle=skyGrad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid
  ctx.strokeStyle='rgba(50,50,100,0.2)';
  ctx.lineWidth=1;
  const gs=40;
  for(let x=0;x<canvas.width;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<canvas.height;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
}

function drawGround() {
  // Ground
  const groundGrad=ctx.createLinearGradient(0,ground.y,0,canvas.height);
  groundGrad.addColorStop(0,'#2a2a2a');
  groundGrad.addColorStop(0.3,'#1a1a1a');
  groundGrad.addColorStop(1,'#0a0a0a');
  ctx.fillStyle=groundGrad;
  ctx.fillRect(0,ground.y,canvas.width,ground.thickness);
  // Ground line
  ctx.strokeStyle='#444';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,ground.y);ctx.lineTo(canvas.width,ground.y);ctx.stroke();
  // Grid lines on ground
  ctx.strokeStyle='rgba(80,80,80,0.3)';ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=40){
    ctx.beginPath();ctx.moveTo(x,ground.y);ctx.lineTo(x,canvas.height);ctx.stroke();
  }
}

function drawPlatforms() {
  for(let p of platforms){
    // Shadow
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=6;ctx.shadowOffsetY=3;
    const len=Math.sqrt((p.x2-p.x1)**2+(p.y2-p.y1)**2);
    const ang=Math.atan2(p.y2-p.y1,p.x2-p.x1);
    ctx.translate((p.x1+p.x2)/2,(p.y1+p.y2)/2);
    ctx.rotate(ang);
    const platGrad=ctx.createLinearGradient(0,-8,0,8);
    platGrad.addColorStop(0,'#7a5a2a');
    platGrad.addColorStop(0.5,'#5a3a0a');
    platGrad.addColorStop(1,'#3a1a00');
    ctx.fillStyle=platGrad;
    ctx.strokeStyle='#9a7a4a';ctx.lineWidth=1;
    ctx.fillRect(-len/2,-6,len,12);
    ctx.strokeRect(-len/2,-6,len,12);
    // Wood planks
    ctx.strokeStyle='rgba(100,70,20,0.4)';ctx.lineWidth=1;
    for(let x=-len/2+10;x<len/2;x+=20){ctx.beginPath();ctx.moveTo(x,-6);ctx.lineTo(x,6);ctx.stroke();}
    ctx.restore();
  }
}

// ── CURSOR INDICATOR ─────────────────────────────
function drawCursor() {
  const x=mouseX,y=mouseY;
  const radius = (['freeze','flamethrower','push','pull','eraser'].includes(activeTool)) ? 30*brushSize : 10;

  ctx.save();
  ctx.globalAlpha=0.5;
  const colors={'human':'#3498db','zombie':'#2ecc71','melon':'#27ae60','box':'#f39c12','ball':'#e74c3c','barrel':'#888','gun':'#ffdd44','bomb':'#ff4444','rocket':'#e74c3c','laser':'#ff2200','nuke':'#ff6600','blackhole':'#8800ff','freeze':'#aaddff','flamethrower':'#ff6600','lightning':'#ffff00','push':'#44aaff','pull':'#ff88ff','spike':'#aaaaaa','shuriken':'#cccccc','acid':'#00ff44','platform':'#7a5a2a','eraser':'#ff4444','grab':'#ffffff'};
  ctx.strokeStyle=colors[activeTool]||'#fff';
  ctx.lineWidth=1.5;
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  // Cross
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);ctx.stroke();
  ctx.restore();
}

// ── PLATFORM DRAWING MODE ────────────────────────
canvas.addEventListener('mousedown', e => {
  isMouseDown=true;
  const x=e.clientX-70, y=e.clientY;

  if(activeTool==='platform'){
    platformStart={x,y};
    return;
  }
  if(activeTool==='grab'){
    // Find draggable object
    for(let b of bodies){if(b.contains(x,y)){dragging=b;dragOffX=b.x-x;dragOffY=b.y-y;return;}}
    for(let o of objects){if(o.contains&&o.contains(x,y)){dragging=o;dragOffX=o.x-x;dragOffY=o.y-y;return;}}
    return;
  }
  if(activeTool==='laser'){fireLaser(x,y);return;}
  useTool(x, y, true);
});

canvas.addEventListener('mouseup', e => {
  isMouseDown=false;
  const x=e.clientX-70, y=e.clientY;
  if(activeTool==='platform'&&platformStart){
    if(Math.abs(x-platformStart.x)>10||Math.abs(y-platformStart.y)>10){
      platforms.push({x1:platformStart.x,y1:platformStart.y,x2:x,y2:y});
    }
    platformStart=null;
  }
  dragging=null;
});

canvas.addEventListener('mousemove', e => {
  mouseX=e.clientX-70; mouseY=e.clientY;
  if(!isMouseDown)return;
  const x=mouseX, y=mouseY;

  if(activeTool==='grab'&&dragging){
    dragging.x=x+dragOffX; dragging.y=y+dragOffY;
    dragging.vx=0; dragging.vy=0;
    return;
  }
  if(activeTool==='platform')return; // handled on mouseup

  // Continuous tools
  if(['flamethrower','freeze','push','pull','eraser','gun'].includes(activeTool)){
    if(activeTool==='gun'){
      if(Math.random()<0.5) shootProjectile(x,y);
    } else {
      useTool(x, y, false);
    }
  }
});

// Right click to freeze/unfreeze
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const x=e.clientX-70, y=e.clientY;
  for(let b of bodies){if(dist(b.x,b.y,x,y)<25){b.frozen=!b.frozen;if(!b.frozen){b.vx=(Math.random()-0.5)*3;b.vy=-2;}}}
  for(let o of objects){if(dist(o.x,o.y,x,y)<35){o.frozen=!o.frozen;}}
});

// ── CONTROLS ─────────────────────────────────────
function toggleGravity() {
  gravityOn=!gravityOn;
  const btn=document.getElementById('gravBtn');
  btn.textContent=gravityOn?'🌍 Gravity: ON':'🌌 Gravity: OFF';
  btn.classList.toggle('active',!gravityOn);
  if(!gravityOn){
    for(let b of bodies){b.vx+=(Math.random()-0.5)*2;b.vy+=(Math.random()-0.5)*2;}
    for(let o of objects){o.vx+=(Math.random()-0.5)*2;o.vy+=(Math.random()-0.5)*2;}
  }
}

function togglePause() {
  paused=!paused;
  document.getElementById('pauseBtn').textContent=paused?'▶ Resume':'⏸ Pause';
  document.getElementById('pauseBtn').classList.toggle('active',paused);
}

function clearAll() {
  bodies.length=0; objects.length=0; particles.length=0;
  projectiles.length=0; effects.length=0; blackholes.length=0; acidPools.length=0;
  platforms.length=0;
}

function slowMo() {
  slowMoOn=!slowMoOn;
  document.getElementById('slowBtn').classList.toggle('active',slowMoOn);
  document.getElementById('slowBtn').textContent=slowMoOn?'🐢 SlowMo: ON':'🐢 SlowMo';
}

function toggleStats() {
  document.getElementById('statsPanel').classList.toggle('show');
  document.getElementById('statsBtn').classList.toggle('active');
}

function updateBrush(v) {
  brushSize=parseInt(v);
  document.getElementById('brushVal').textContent=v;
}

function spawnPreset(type) {
  switch(type){
    case 'tower':
      for(let row=0;row<5;row++){
        for(let col=0;col<4;col++){
          const o=new PhysObject(canvas.width/2-60+col*36, ground.y-40-row*38, 'box');
          o.vx=0;o.vy=0;objects.push(o);
        }
      }
      break;
    case 'army':
      for(let i=0;i<15;i++){
        const b=new Ragdoll(canvas.width/4+i*30+(Math.random()-0.5)*10, ground.y-30, i%3===0?'zombie':'human');
        bodies.push(b);
      }
      break;
    case 'melons':
      for(let i=0;i<20;i++){
        setTimeout(()=>{
          const o=new PhysObject(Math.random()*canvas.width, -30, 'melon');
          o.vy=2+Math.random()*3;
          objects.push(o);
        },i*100);
      }
      break;
  }
}

// ── TOOL BUTTONS ────────────────────────────────
document.querySelectorAll('.tool-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeTool=btn.dataset.tool;
  });
  // Tooltip
  btn.addEventListener('mouseenter',e=>{
    const tip=document.getElementById('tooltip');
    tip.textContent=btn.dataset.tip||btn.dataset.tool;
    tip.style.display='block';
    tip.style.left=(e.clientX+15)+'px';
    tip.style.top=(e.clientY-5)+'px';
  });
  btn.addEventListener('mouseleave',()=>{document.getElementById('tooltip').style.display='none';});
});

// ── MAIN LOOP ────────────────────────────────────
let lastTime=performance.now();
let fpsFrames=0, fpsTime=0;

function loop(now) {
  requestAnimationFrame(loop);
  const raw=Math.min((now-lastTime)/16.67,3);
  const dt=raw;
  lastTime=now;
  frameCount++;

  // FPS
  fpsFrames++;fpsTime+=now-lastTime||16;
  if(fpsFrames>=30){fps=Math.round(1000/(fpsTime/fpsFrames));fpsFrames=0;fpsTime=0;}

  // Camera shake
  if(shakeDecay>0){
    shakeX*=0.8;shakeY*=0.8;shakeDecay*=0.8;
    if(shakeDecay<0.1)shakeDecay=0;
  }

  ctx.save();
  ctx.translate(Math.round(shakeX),Math.round(shakeY));

  // Draw background
  drawBackground();

  // Platforms
  drawPlatforms();

  // Platform preview
  if(platformStart&&activeTool==='platform'){
    ctx.save();
    ctx.strokeStyle='rgba(122,90,42,0.6)';ctx.lineWidth=12;ctx.setLineDash([8,4]);
    ctx.beginPath();ctx.moveTo(platformStart.x,platformStart.y);ctx.lineTo(mouseX,mouseY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Acid pools
  for(let i=acidPools.length-1;i>=0;i--){
    acidPools[i].update(dt);
    if(acidPools[i].life<=0){acidPools.splice(i,1);continue;}
    acidPools[i].draw();
  }

  // Objects
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    o.update(dt);
    if(o.exploded){objects.splice(i,1);continue;}
    if(o.y>canvas.height+100){objects.splice(i,1);continue;}
    o.draw();
  }

  // Bodies - dead drawn first for depth
  const deadBodies=bodies.filter(b=>b.dead);
  const aliveBodies=bodies.filter(b=>!b.dead);
  for(let b of deadBodies){b.update(dt);b.draw();}
  for(let b of aliveBodies){b.update(dt);b.draw();}

  // Remove OOB bodies
  for(let i=bodies.length-1;i>=0;i--){
    if(bodies[i].y>canvas.height+200||bodies[i].size<0.1)bodies.splice(i,1);
  }

  // Black holes
  for(let i=blackholes.length-1;i>=0;i--){
    blackholes[i].update(dt);
    if(blackholes[i].life<=0){blackholes.splice(i,1);continue;}
    blackholes[i].draw();
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    particles[i].update(dt);
    particles[i].draw();
    if(particles[i].life<=0)particles.splice(i,1);
  }

  // Projectiles
  updateProjectiles(dt);
  drawProjectiles();

  // Effects
  updateDrawEffects(dt);

  // Ground
  drawGround();

  // Cursor
  drawCursor();

  ctx.restore();

  // HUD
  document.getElementById('bCount').textContent=bodies.length;
  document.getElementById('oCount').textContent=objects.length;

  // Stats
  if(document.getElementById('statsPanel').classList.contains('show')){
    document.getElementById('sFps').textContent=fps;
    document.getElementById('sBodies').textContent=bodies.length;
    document.getElementById('sParts').textContent=particles.length;
    document.getElementById('sPlatforms').textContent=platforms.length;
    document.getElementById('sFrame').textContent=frameCount;
  }
}

// ── KEYBOARD SHORTCUTS ───────────────────────────
document.addEventListener('keydown', e => {
  const map={'KeyH':'human','KeyZ':'zombie','KeyM':'melon','KeyB':'box','KeyL':'ball','KeyE':'eraser','KeyG':'grab','KeyF':'flamethrower','KeyN':'nuke','KeyP':'platform','Space':'toggle-pause','KeyC':'clear'};
  const action=map[e.code];
  if(!action)return;
  if(action==='toggle-pause'){togglePause();return;}
  if(action==='clear'){clearAll();return;}
  document.querySelectorAll('.tool-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.tool===action);
  });
  if(action)activeTool=action;
});

// Start
requestAnimationFrame(loop);

// Welcome spawn
setTimeout(()=>{
  bodies.push(new Ragdoll(canvas.width/2-30, ground.y-40, 'human'));
  bodies.push(new Ragdoll(canvas.width/2+30, ground.y-40, 'zombie'));
  objects.push(new PhysObject(canvas.width/2, ground.y-25, 'melon'));
},300);
</script>
